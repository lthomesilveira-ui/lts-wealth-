function flowVals(x,prev){

        exits=Math.abs(sum(cashEv.filter(e=>num(e.signed_amount)<0).map(e=>e.signed_amount)));

    if(ACC==='Consolidado'){
      const z=x.Consolidado||{},c=x.fix86_columns||{},abs=z.bank_balance,fin=c.saldo_final_operacional??abs;
      if(fin!=null){const pc=prev?.fix86_columns||{},pr=pc.saldo_final_operacional??(prev?.historical&&prev?.Consolidado?.bank_balance!=null?prev.Consolidado.bank_balance:fin-num(z.economic_net??z.net));return {prev:pr,en:entries,ex:exits,fin:fin,basis:'cash'}}
      return {prev:null,en:entries,ex:exits,fin:null,basis:'movement_only'}
    }
    const key=ACC==='Itaú'?'Itaú':ACC,z=x[key]||x[ACC]||{},abs=z.balance;
    if(abs!=null){const pz=prev?.historical?(prev[key]||prev[ACC]||{}):{},pr=pz.balance!=null?pz.balance:abs-num(z.net);return {prev:pr,en:entries,ex:exits,fin:abs,basis:'bank'}}
    return {prev:null,en:entries,ex:exits,fin:null,basis:'movement_only'}
  }
  const c=x.fix86_columns||{};
  if(ACC==='Consolidado')return {prev:c.saldo_anterior_operacional??c.saldo_anterior,en:c.entradas_operacionais??entries,ex:c.saidas_operacionais??exits,fin:c.saldo_final_operacional??c.saldo_final,basis:'cash'};
  const key=ACC==='Itaú'?'Itaú':ACC,z=x[key]||x[ACC]||{},isItau=ACC==='Itaú',fin=isItau?(z.operational_balance??z.balance):z.balance,
        pz=prev&&!prev.historical?(prev[key]||prev[ACC]||{}):{},pr=isItau?(pz.operational_balance??pz.balance):(pz.balance),
        net=isItau?(z.operational_net??z.net):z.net,wh=isItau?num(c.payroll_withholding_today||0):0;
  let en=entries,ex=exits;/* Coopharma já está refletida no salário líquido retornado pelo backend; não descontar novamente na UI. */
  return {prev:pr!=null?pr:fin-num(net),en,ex,fin,basis:'bank'}
}

function planejamento(){const l=D.planning_ladder||{},layers=l.layers||[],eps=l.gap_episodes||[],fg=l.fgts_access||{},futureGross=sum((D.planning?.conditional_liquidity||[]).map(x=>x.gross_value_brl)),gap=l.first_real_gap_date;return `<div class="p130-head"><div><span class="w104-eye">Planejamento</span><h1>De onde vem o dinheiro — e quando cada camada acaba.</h1><p>Caixa → Cofrinho → RSU vested → novos vestings → FGTS D+30. A leitura acompanha os gaps reais do Fluxo, inclusive 2027.</p></div><span class="status ${gap?'at':'ok'}">${gap?'gap previsto':'sem gap no horizonte'}</span></div><div class="p130-gap"><div><span>Primeiro gap após todas as camadas realizáveis/condicionais</span><strong>${gap?fmt(gap):'Nenhum'}</strong><small>${eps[0]?`${eps[0].days} dia(s) · pior ponto ${brl(eps[0].worst_balance)} · recupera em ${fmt(eps[0].recovery_date)}`:'Sem episódio negativo no horizonte.'}</small></div><div class="right"><span>FGTS de contingência · ~D+30</span><b>${brl(fg.amount_brl)}</b><small>${fg.request_by_date?`para o primeiro gap, acionar por volta de ${fmt(fg.request_by_date)}`:'sem acionamento indicado'}</small></div></div><div class="p130-ladder">${layers.map(x=>p130Layer(x,futureGross,fg)).join('')}</div>${eps.length?`<div class="section"><div class="u130-classhead"><div><span class="w104-eye">Gaps de liquidez</span><h2>Quando falta caixa e quando ele se recompõe</h2><p>Não é “saldo no horizonte”; são episódios concretos para decidir se precisa antecipar liquidez.</p></div><span>${eps.length}</span></div><div class="p130-episodes">${eps.map(e=>`<div class="p130-episode"><span>${fmt(e.start_date)} → ${fmt(e.end_date)}</span><b>Pior ponto ${brl(e.worst_balance)}</b><small>${e.days} dia(s) · recuperação em ${fmt(e.recovery_date)}${fg.covers_horizon_if_available?' · FGTS atual é suficiente se estiver disponível':''}</small></div>`).join('')}</div></div>`:''}`}
function patrimonio(){const w=D.wealth||{},vals=w.market_valuations||{},cv=vals.cipo_396||{},vv=vals.volvo_xc40||{},hist=w.cipo_396?.historical_excel||{},docs=D.documentary_commitments?.items||[],ci=docs.find(x=>x.commitment_id==='cipo_396')||{},tf=dashboardTodayFlow(),fc=tf?.fix86_columns||{},co=tf?.Consolidado||{},bank=co.bank_balance!=null?num(co.bank_balance):sum((w.accounts||[]).map(x=>x.balance)),d0=fc.liq_d0_1_recurso!=null?num(fc.liq_d0_1_recurso):0,vested=fc.rsus_vested!=null?num(fc.rsus_vested):0,fgts=fc.fgts!=null?num(fc.fgts):sum((w.asset_layers?.documentary_snapshots||[]).filter(x=>x.liquidity_class==='restricted').map(x=>x.value_brl)),future=sum((w.asset_layers?.documentary_snapshots||[]).filter(x=>x.liquidity_class==='future').map(x=>x.value_brl)),cDebt=num(ci.debt_balance||w.cipo_396?.mortgage?.current_debt_balance),vDebt=num(vv.metadata?.documented_total_financed_brl),cEq=num(cv.central_value_brl)-cDebt,vEq=num(vv.central_value_brl)-vDebt,known=bank+d0+vested+fgts+cEq+vEq,low=bank+d0+vested+fgts+(num(cv.low_value_brl)-cDebt)+(num(vv.low_value_brl)-vDebt),high=bank+d0+vested+fgts+(num(cv.high_value_brl)-cDebt)+(num(vv.high_value_brl)-vDebt),com=D.commitments?.commitments||[],cooph=com.find(x=>x.id==='coopharma')||{},family=com.find(x=>x.id==='pai_mae')||{};return `<div class="w130-head"><div><span class="w104-eye">Patrimônio</span><h1>Ativos, dívidas e equity — sem misturar valor de mercado com custo.</h1><p>Estimativas ficam separadas de posições documentais. Awards futuros não entram no patrimônio adquirido.</p></div><span class="status at">estimativas de mercado</span></div><div class="w130-summary"><div class="w130-main"><span>Patrimônio líquido estimado · parcial</span><strong>${brl(known)}</strong><small>Faixa ${brl(low)} → ${brl(high)} · considera apenas dívidas com saldo atual conhecido.</small></div><div class="w130-kpi"><span>Liquidez até D+3</span><b>${brl(bank+d0+vested)}</b><small>caixa + Cofrinho + RSU vested</small></div><div class="w1 entada</span><b>${brl(vDebt)}</b><small>antes da 1ª parcela</small></div><div><span>Equity estimado</span><b>${brl(vEq)}</b><small>valor central − dívida conhecida</small></div></div><div class="w130-note">Confiança ${esc(vv.confidence||'—')}; versão/trim e quilometragem ainda não estão documentadas no LTS, por isso a faixa permanece ampla.</div></div></div><div class="w130-oblig"><div class="title">Compromissos sem saldo devedor atual certificado</div><div class="item"><span>Coopharma · fluxo econômico remanescente</span><b>${brl(cooph.remaining_economic_outflow)}</b></div><div class="item"><span>Pai e Mãe · cronograma histórico remanescente</span><b>${brl(family.remaining_scheduled_outflow)}</b></div><div class="w130-note">Esses valores são cronogramas futuros, não “saldo devedor atual”; por isso não foram subtraídos do patrimônio líquido parcial acima.</div></div>`}

function r129Kpi(label,value,sub,cls=''){return `<div class="r129-kpi ${cls}"><span>${esc(label)}</span><b>${value}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>`}
function r129MonthBars(items,valueKey='spend'){const xs=(items||[]).slice(-12),mx=Math.max(...xs.map(x=>Math.abs(num(x[valueKey]))),1);return `<div class="r129-bars">${xs.map(x=>{const v=num(x[valueKey]),h=Math.max(3,Math.round(Math.abs(v)/mx*100));const m=String(x.month||x.reference_month||'').slice(0,7);return `<div class="r129-col" title="${esc(expenseMonthPt(m))} · ${brl(v)}"><strong>${brl(v)}</strong><i style="height:${h}%"></i><em>${esc(expenseMonthPt(m).replace(/ de /,'/').slice(0,7))}</em></div>`}).join('')}</div>`}
function r129Rank(items,total,limit=8){const xs=(items||[]).slice(0,limit),mx=Math.max(...xs.map(x=>Math.abs(num(x.total??x.spend))),1);return `<div class="r129-rank">${xs.map(x=>{const k=x.key??x.category??x.center??x.counterparty??'—',v=num(x.total??x.spend),p=Math.max(1,Math.round(Math.abs(v)/mx*100));return `<div class="r129-rankrow"><span title="${esc(k)}">${esc(k)}</span><div class="r129-track"><i style="width:${p}%"></i></div><b>${brl(v)}</b></div>`}).join('')||'<div class="empty">Sem dados no período.</div>'}</div>`}
function despesasLegacyV129(){const st=expenseDualState(),j=st?.data,ins=D.expense_insights||{},rows=exp110Rows(),months=(ins.monthly_12m||[]).slice(-12),periods=[['3m','3 meses'],['6m','6 meses'],['12m','12 meses']],tabs=['Visão','Caixa','Consumo','Detalhes'];if(!st||st.loading)return `<div class="r129-page"><div class="r129-head"><div class="r129-title"><span>Relatório</span><h1>Despesas</h1></div></div><div class="section">Carregando…</div></div>`;if(st.error)return `<div class="section notice">Falha ao carregar: ${esc(st.error)}</div>`;const cats=expenseGroup(rows,'category').filter(x=>!/^a classificar$/i.test(String(x.key))),centers=expenseGroup(rows,'center_cost'),cps=expenseGroup(rows,'counterparty').filter(x=>!/^não identificado$/i.test(String(x.key))),total=num(j?.consumption?.total),avg=months.length?sum(months.map(x=>x.spend))/months.length:0,last=num(months.at(-1)?.spend),prev=num(months.at(-2)?.spend),delta=prev?((last/prev)-1)*100:0,uncl=num(j?.consumption?.unclassified);const head=`<div class="r129-head"><div class="r129-title"><span>Relatório de consumo</span><h1>Despesas</h1><p>Consumo, tendência e concentração em uma única leitura.</p></div><div class="r129-asof">Atualizado ${fmt(ins.as_of||today())}</div></div><div class="r129-toolbar"><div class="r129-sectiontabs">${tabs.map(x=>`<button data-dsp="${x}" class="chip ${DSP===x?'active':''}">${x}</button>`).join('')}</div><div class="chips">${periods.map(([k,l])=>`<button data-dper="${k}" class="chip ${DSPPER===k?'active':''}">${l}</button>`).join('')}</div></div>`;let body='';if(DSP==='Visão'){body=`<div class="r129-kpis">${r129Kpi('Consumo no período',brl(total),expensePeriodName())}${r129Kpi('Média mensal · 12m',brl(avg),'base observada')}${r129Kpi('Último mês',brl(last),`${delta>=0?'+':''}${delta.toFixed(1)}% vs mês anterior`)}${r129Kpi('A classificar',brl(uncl),uncl?'ainda fora da análise completa':'classificação completa')}</div><div class="r129-grid"><div class="r129-panel"><div class="r129-panelhead"><div><span>Tendência</span><h3>Consumo mensal · 12 meses</h3></div><b class="r129-delta ${delta>=0?'neg':'pos'}">${delta>=0?'+':''}${delta.toFixed(1)}%</b></div>${r129MonthBars(months)}</div><div class="r129-panel"><div class="r129-panelhead"><div><span>Concentração</span><h3>Maiores categorias</h3></div></div>${r129Rank(cats,total,8)}</div></div><div class="r129-grid"><div class="r129-panel"><div class="r129-panelhead"><div><span>Centros de custo</span><h3>Quem concentra o consumo</h3></div></div>${r129Rank(centers,total,7)}</div><div class="r129-panel"><div class="r129-panelhead"><div><span>Contrapartes</span><h3>Principais destinos</h3></div></div>${r129Rank(cps,total,7)}</div></div>`}else if(DSP==='Caixa'){const buckets=(j?.cash?.buckets||[]).map(x=>({key:x.label||x.bucket,total:x.total}));body=`<div class="r129-kpis">${r129Kpi('Saídas relevantes',brl(j?.cash?.spend_outflows),'exclui transferências próprias')}${r129Kpi('Pendente de conciliação',brl(j?.cash?.pending_reconciliation),'após última posição')}${r129Kpi('Consumo econômico',brl(total),'não duplica faturas')}${r129Kpi('Movimentos',String((j?.cash?.recent||[]).length),'linhas recentes')}</div><div class="r129-grid"><div class="r129-panel"><div class="r129-panelhead"><div><span>Caixa</span><h3>Saídas por natureza</h3></div></div>${r129Rank(buckets,num(j?.cash?.spend_outflows),12)}</div><div class="r129-panel"><div class="r129-panelhead"><div><span>Movimentos</span><h3>Mais recentes</h3></div></div>${(j?.cash?.recent||[]).filter(x=>!x.excluded_from_spend).slice(0,18).map(exp110CashRow).join('')||'<div class="empty">Sem saídas.</div>'}</div></div>`}else if(DSP==='Consumo'){body=`<div class="r129-kpis">${r129Kpi('Consumo',brl(total),expensePeriodName())}${r129Kpi('Categorias',String(cats.length),'com movimento')}${r129Kpi('Centros',String(centers.length),'identificados no período')}${r129Kpi('Linhas',String(rows.length),'compras e despesas')}</div><div class="r129-grid"><div class="r129-panel"><div c <script id="updates-v132-js">/* updates-v132-js */
function u132StatusMeta(s){s=String(s||'');if(['current','documented','covered'].includes(s))return {cls:'ok',icon:'✓',label:'OK'};if(['aging','partial','review'].includes(s))return {cls:'warn',icon:'!',label:s==='aging'?'Acompanhar':s==='partial'?'Parcial':'Revisar'};if(['missing','stale'].includes(s))return {cls:'bad',icon:'!',label:s==='missing'?'Faltando':'Atualizar'};return {cls:'warn',icon:'!',label:'Revisar'}}

function u132TaxOther(q,x){const sug=String(x.suggested_category||''),p=(q.taxonomy_guard?.active_pairs||[]).find(z=>z.category_a===sug||z.category_b===sug);if(!p)return '';return p.category_a===sug?p.category_b:p.category_a}
function u132Confidence(x){const sc=num(x.suggestion_confidence),ec=num(x.enrichment_confidence),lvl=String(x.suggestion_confidence_level||'');if(x.suggested_category&&sc>0){const lab=lvl==='medium'?'média':lvl==='low'?'baixa':x.taxonomy_ambiguous?'alta evidência · taxonomia protegida':'alta';return `Sugestão ${Math.round(sc*100)}% · ${lab}`};if(x.merchant_identified&&ec>0)return `Identificação ${Math.round(ec*100)}%`;return x.enrichment_attempted?'Sem confiança suficiente para classificar':'Sem sugestão'}
function u132Recurrence(x){if(x.amount_pattern_evidence)return String(x.amount_pattern_evidence);const n=num(x.occurrences);if(n>1)return `${n} ocorrências neste grupo; sem padrão histórico categorizado suficiente para auto-classificar.`;return '1 ocorrência; sem repetição histórica suficiente por valor/parcela.'}
function u132Research(x){if(x.enrichment_evidence)return String(x.enrichment_evidence);if(x.enrichment_attempted)return 'Pesquisa/enriquecimento executado, sem evidência conclusiva.';return 'Ainda sem evidência externa; histórico interno continua tendo prioridade.'}
function u132Need(q,x){const e=String(x.enrichment_status||''),s=String(x.suggested_category||''),other=u132TaxOther(q,x);if(e==='payment_intermediary_needs_context')return 'Dizer onde/como foi o consumo final ou escolher a categoria da compra real.';if(e==='marketplace_needs_item_context')return s?`O histórico sugere ${s}, mas o marketplace não prova o item. Confirme ou escolha outra categoria.`:'Dizer o item/finalidade ou escolher a categoria da compra real.';if(e==='person_name_needs_user_context')return 'Dar o contexto dessa pessoa/despesa ou escolher a categoria; o LTS não fará pesquisa pública invasiva.';if(s&&other)return `Confirmar ${s} ou ${other}.`;if(s)return `Confirmar ${s} ou escolher outra categoria.`;if(x.merchant_identified)return 'Escolher a categoria/finalidade; o estabelecimento já foi identificado.';return 'Identificar a compra ou escolher a categoria.'}
function u132BasisTag(x){const b=String(x.suggestion_basis||'');if(b.includes('historico'))return 'Histórico do LTS';if(b.includes('pesquisa_publica')||b.includes('estabelecimento_identificado'))return 'Pesquisa pública';if(x.enrichment_status==='marketplace_needs_item_context')return 'Marketplace';if(x.enrichment_status==='payment_intermediary_needs_context')return 'Intermediador';return x.enrichment_attempted?'Pesquisa tentada':'Sem fonte segura'}
function cardClassificationUpdates(){const q=D.card_classification_review||{},items=q.items||[],ordered=items.slice().sort((a,b)=>(b.suggestion_safe?1:0)-(a.suggestion_safe?1:0)||(b.suggested_category?1:0)-(a.suggested_category?1:0)||num(b.total_value)-num(a.total_value)),opts=(q.category_options||[]).slice().sort((a,b)=>String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base'})),safe=num(q.safe_suggestion_groups);if(!num(q.pending_groups))return '';const batch=`<div class="safe121-head u131-batch"><button class="btn ghost safe121-submit" ${safe?'':'disabled'}>Confirmar selecionadas (${safe})</button><span class="mut">${safe?'Somente sugestões seguras vêm marcadas; o backend revalida cada item.':'Nenhuma sugestão é segura para confirmação em lote neste momento.'}</span></div>`;return `<div id="cardClassReview" class="section card fx89-review"><div class="flowbar"><div><div class="title" style="margin:0">Classificação de faturas</div><div class="mut">${num(q.pending_groups)} grupo(s) · ${num(q.pending_lines)} lançamento(s) · ${brl(q.pending_value)} ainda sem categoria</div></div><span class="status at">decisão assistida</span></div>${batch}<div class="u132-classintro"><span>Histórico idêntico tem prioridade</span><span>Recorrência/valor aparecem quando existem</span><span>Pesquisa pública fica explícita</span><span>Confiança não elimina taxonomia protegida</span></div>${ordered.map(x=>{const sug=x.suggested_category||'',name=x.merchant_name||x.example_description||'Lançamento',safeItem=!!x.suggestion_safe;return `<div class="cardclass-row u132-classrow ${safeItem?'safe121-suggested':''}"><div class="u132-classmain"><b>${esc(name)}</b><small>${esc(x.example_description||'')} · ${esc(x.card_name)} · ${fmt(x.due_date)} · ${num(x.occurrences)} ocorrência(s) · ${brl(x.total_value)}</small><div class="u132-facts"><div><span>Confiança</span><p>${esc(u132Confidence(x))}</p></div><div><span>Repetição / parcela</span><p>${esc(u132Recurrence(x))}</p></div><div><span>O que o LTS pesquisou/sabe</span><p>${esc(u132Research(x))}</p></div><div><span>Só falta você</span><p>${esc(u132Need(q,x))}</p></div></div><div class="u132-source"><i class="tag">${esc(u132BasisTag(x))}</i>${x.taxonomy_ambiguous?'<i class="tag">taxonomia protegida</i>':''}${x.amount_pattern_months?`<i class="tag">${num(x.amount_pattern_months)} mês(es) no padrão</i>`:''}</div>${safeItem&&sug?`<label class="safe121-check"><input type="checkbox" class="safe121-pick" data-key="${esc(x.description_key)}" data-category="${esc(sug)}" checked> incluir no lote seguro</label>`:''}</div><div class="u132-actions"><select class="chip cardcat" title="Escolha a categoria completa"><option value="">Escolher categoria…</option>${opts.map(c=>`<option value="${esc(c)}" ${sug===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button type="button" class="chip newcatbtn">+ Nova categoria</button><button class="chip cardclass-save" data-key="${esc(x.description_key)}">Salvar classificação</button></div></div>`}).join('')}<div class="notice" style="margin-top:10px">${esc(q.guardrail||'Itens sem evidência permanecem sem classificação até revisão.')}</div></div>`}
function u132TaskButton(x){const t=String(x?.type||''),dest=String(x?.destination||''),id=esc(x.id||'');if(t==='overdue_transfer_review')return `<button class="chip updconfirm" data-update="${id}">Confirmar realizado</button>`;if(t==='overdue_event_review')return `<button class="chip updeventconfirm" data-update="${id}">Confirmar realizado</button>`;if(t==='card_payment_review')return `<button class="chip cardpayconfirm" data-update="${id}">Confirmar pagamento</button>`;if(t==='document_request'||t==='reconciliation')return `<button class="chip updinput" data-update="${id}">${t==='reconciliation'?'Enviar evidência':'Enviar documento'}</button>`;if(dest)return `<button class="chip u113-go" data-v="${esc(dest)}">Abrir ${esc(dest)}</button>`;return `<span class="status at">Revisar</span>`}
function u132Task(x,i){const amb=String(x.match_status||'')==='ambiguous'&&Array.isArray(x.candidate_matches)&&x.candidate_matches.length;return `<div class="u130-task ${num(x.priority)===1?'urgent':''}"><div class="u130-check">${i+1}</div><div><b>${esc(x.title||'Pendência')}</b><p>${esc(x.detail||'')}${num(x.impact_amount)?' · impacto '+brl(x.impact_amount):''}</p><small>${amb?'Há candidatos; escolha explícita necessária.':'Ação direta; o LTS não altera dinheiro ou regra sem confirmação.'}</small>${amb?`<div class="preview" style="margin-top:8px">${x.candidate_matches.map(c=>`<div class="recon120-cand"><span>${fmt(c.date)} · ${esc(c.account)} · ${esc(c.description)}</span><b>${brl(c.amount)}</b><button class="chip recon120-use" data-update="${esc(x.id)}" data-source-table="${esc(c.source_table)}" data-source-ref="${esc(c.source_ref)}">Usar este crédito</button></div>`).join('')}</div>`:''}</div>${u132TaskButton(x)}</div>`}
function atualizacoes(){const u=D.updates||{},q=D.card_classification_review||{},sq=D.semantic_review||{},raw=groupUpdateItems((u.items||[]).slice()).sort((a,b)=>num(a.priority)-num(b.priority)||Math.abs(num(b.impact_amount))-Math.abs(num(a.impact_amount))),actions=raw.filter(updateIsAction),oper=actions.filter(x=>String(x.type)!=='maintenance_request'),info=raw.filter(x=>!updateIsAction(x)),checks=u.maintenance_checks||[],maintOpen=checks.filter(x=>x.actionable).length,classes=num(q.pending_groups)+num(sq.pending_groups),open=oper.length+maintOpen+classes,uf=u.freshness||{},fresh=uf.position_as_of?`Base ${fmt(uf.position_as_of)}`:'Base documental';return `<div class="u130-head"><div><span class="w104-eye">Atualizações</span><h1>Checklist para deixar o LTS em dia.</h1><p>Classificação, documentos e cobertura futura no mesmo lugar — com evidência antes de pedir uma decisão.</p></div><div class="u130-counter"><span>Pendências abertas</span><b>${open}</b><small>${fresh}</small></div></div>${oper.length?`<div class="u130-list">${oper.map(u132Task).join('')}</div>`:''}${u132Maintenance()}${classes?`<div class="u130-classhead"><div><span class="w104-eye">Classificação</span><h2>Itens que ainda precisam de decisão</h2><p>Agora cada item mostra confiança, repetição/parcelas, pesquisa e a decisão exata que falta.</p></div><span>${classes}</span></div>${cardClassificationUpdates()}${expenseClassificationUpdates()}`:''}${info.length?`<details class="u130-info"><summary>Informações e proteções do sistema (${info.length})</summary>${info.map(renderUpdateInfo).join('')}</details>`:''}<div class="section u105-guard">${esc(u.maintenance_contract||u.guardrail||'Itens resolvidos não reaparecem; documentos existentes não são pedidos novamente.')}</div>`}

<script id="updates-v132-controls-js">/* updates-v132-controls */
function u132Cycles(){return (D.updates?.maintenance_checks||[]).filter(x=>x.group==='Faturas a atualizar')}
function u132CardOptions(){return [...new Set(u132Cycles().map(x=>x.card_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function u132NextMonth(){const d=new Date(today()+'T12:00:00');d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,7)}
function u132InvoicePanel(origin='updates'){const cards=u132CardOptions(),cycles=u132Cycles(),id='u132inv';if(!cards.length)return '';const next=u132NextMonth();return `<div class="u132-tool" id="u132InvoicePanel"><span class="w104-eye">Faturas em aberto / futuras</span><h3>Atualizar valor da fatura</h3><p>Use quando você souber o total do cartão, mesmo sem ter o detalhe. O valor corrige a obrigação de caixa no Fluxo; as compras só entram em Despesas quando houver detalhe/reconciliação.</p><div class="u132-formgrid"><label>Cartão<select id="${id}Card" onchange="u132InvoicePrefill()">${cards.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></label><label>Competência<input id="${id}Month" type="month" value="${next}" onchange="u132InvoicePrefill()"></label><label>Valor conhecido<input id="${id}Amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00"></label><button class="btn" onclick="u132InvoiceSave(this)">Atualizar fatura</button></div><div class="u132-cycleform-msg" id="${id}Msg">Selecione cartão e competência. Se já houver projeção, o LTS usa o vencimento conhecido e substitui apenas o valor vigente do ciclo.</div></div>`}
function u132InvoicePrefill(){const card=document.getElementById('u132invCard')?.value,month=document.getElementById('u132invMonth')?.value;if(!card||!month)return;const x=u132Cycles().find(z=>z.card_name===card&&String(z.reference_month||'').slice(0,7)===month),a=document.getElementById('u132invAmount'),m=document.getElementById('u132invMsg');if(a)a.value=x?.amount!=null?Number(x.amount).toFixed(2):'';if(m)m.textContent=x?`${x.detail}`:'Sem ciclo existente: o vencimento será inferido pelo padrão do cartão; nenhum valor será inventado.'}
function u132OpenInvoiceCheck(card,month,amount){const p=document.getElementById('u132InvoicePanel');if(!p)return;const c=document.getElementById('u132invCard'),m=document.getElementById('u132invMonth'),a=document.getElementById('u132invAmount');if(c)c.value=card;if(m)m.value=String(month||'').slice(0,7);if(a&&amount!=null)a.value=Number(amount).toFixed(2);u132InvoicePrefill();p.scrollIntoView({behavior:'smooth',block:'center'})}
async function u132InvoiceSave(b){const card=document.getElementById('u132invCard')?.value,month=document.getElementById('u132invMonth')?.value,amount=Number(document.getElementById('u132invAmount')?.value||0),msg=document.getElementById('u132invMsg');if(!card||!month||!amount){if(msg)msg.textContent='Preencha cartão, competência e valor.';return}const old=b.textContent;b.disabled=true;b.textContent='Salvando…';try{const {data:j,error}=await S.rpc('lts_browser_card_invoice_manual_update_v1',{p_card_name:card,p_reference_month:month+'-01',p_amount:amount,p_due_date:null,p_note:'Atualização manual pela Central de Atualizações'});if(error||!j?.ok)throw Error(error?.message||'Falha ao atualizar fatura');if(msg)msg.textContent=`Salvo: ${brl(j.amount)} · vence ${fmt(j.due_date)}. Fluxo atualizado; sem detalhe não há nova despesa categorizada.`;const {data:p}=await S.rpc('lts_browser_product_v1');if(p?.mvp)D=p.mvp;toast('Fatura atualizada no Fluxo.');render()}catch(e){if(msg)msg.textContent=String(e?.message||e)}finally{b.disabled=false;b.textContent=old}}

<script id="executive-reports-v134-js">/* executive-reports-v134-js */
function ex134Range(k){const t=today(),y=t.slice(0,4),d=new Date(t+'T12:00:00');if(k==='ytd')return {from:y+'-01-01',to:t,label:'Ano atual'};if(k==='12m'){d.setMonth(d.getMonth()-11);return {from:d.toISOString().slice(0,7)+'-01',to:t,label:'Últimos 12 meses'}};if(k==='2023')return {from:'2023-01-01',to:t,label:'Desde 2023'};return {from:'2013-10-10',to:t,label:'Histórico completo'}}
function ex134State(){const s=window.EX134||(window.EX134={rangeKey:'ytd',loading:false,error:null,data:null,key:null});const r=ex134Range(s.rangeKey),key=r.from+'|'+r.to;if(s.key!==key&&!s.loading)loadEx134(s.rangeKey);return s}
async function loadEx134(k){const s=window.EX134||(window.EX134={});s.rangeKey=k||s.rangeKey||'ytd';const r=ex134Range(s.rangeKey);s.key=r.from+'|'+r.to;s.loading=true;s.error=null;if(V==='Despesas')render();try{const {data,error}=await S.rpc('lts_browser_expense_executive_v3',{p_from:r.from,p_to:r.to});if(error||!data)throw Error(error?.message||'Não foi possível carregar Despesas');s.data=data}catch(e){s.error=String(e?.message||e)}finally{s.loading=false;if(V==='Despesas')render()}}
function ex134SetRange(k){const s=window.EX134||(window.EX134={});if(s.rangeKey===k)return;s.rangeKey=k;s.key=null;s.data=null;loadEx134(k)}
function ex134Annual(xs){const mx=Math.max(1,...xs.map(x=>num(x.total)));return `<div class="ex134-yearbars">${xs.map(x=>{const h=Math.max(3,Math.round(num(x.total)/mx*100));return `<div class="ex134-year" title="${x.year} · ${brl(x.total)}"><i style="height:${h}%"></i><b>${x.year}</b><small>${brl(x.total).replace('R$ ','')}</small></div>`}).join('')}</div>`}
function ex134Months(xs){const a=xs.slice(-24),mx=Math.max(1,...a.map(x=>num(x.total)));return `<div class="ex134-months">${a.map(x=>`<div class="ex134-month" title="${fmt(x.month)} · ${brl(x.total)}"><i style="height:${Math.max(2,Math.round(num(x.total)/mx*100))}%"></i></div>`).join('')}</div><div class="ex134-monthlabels"><span>${a[0]?fmt(a[0].month):''}</span><span>${a.at(-1)?fmt(a.at(-1).month):''}</span></div>`}
function ex134Rank(xs,limit=8){const a=(xs||[]).slice(0,limit),mx=Math.max(1,...a.map(x=>num(x.total)));return `<div class="ex134-rank">${a.map((x,i)=>`<div class="ex134-rankrow"><div><b>${i+1}. ${esc(x.name||'Não identificado')}</b><small>${num(x.rows)>0?num(x.rows)+' lançamento(s) · ':''}${num(x.share_pct).toFixed(1)}% do período</small><div class="ex134-bar"><i style="width:${Math.max(2,Math.round(num(x.total)/mx*100))}%"></i></div></div><strong>${brl(x.total)}</strong></div>`).join('')||'<div class="empty">Sem dados neste período.</div>'}</div>`}
function despesas(){const s=ex134State(),r=ex134Range(s.rangeKey||'ytd');if(s.loading&&!s.data)return `<div class="ex134-page"><div class="ex134-head"><div><span class="eye">Despesas</span><h1>Entendendo para onde o dinheiro foi.</h1><p>Carregando o histórico consolidado…</p></div></div><div class="section">Carregando…</div></div>`;if(s.error&&!s.data)return `<div class="section notice">Falha ao carregar Despesas: ${esc(s.error)}</div>`;const j=s.data||{},q=j.summary||{},rk=j.rankings||{},hi=j.highlights||{},dq=j.data_quality||{},ys=j.history_yearly||[],ms=j.history_monthly||[],delta=num(q.ytd_delta),dp=q.ytd_delta_pct,sel=num(q.selected_total),acc=num(q.account_total),card=num(q.card_total);return `<div class="ex134-page"><div class="ex134-head"><div><span class="eye">Despesas · visão executiva</span><h1>Quanto você gastou — e com o quê.</h1><p>${esc(j.definition||'')}</p></div><div><div class="ex134-period">${[['ytd','Ano atual'],['12m','12 meses'],['2023','Desde 2023'],['all','Desde 2013']].map(([k,l])=>`<button class="${s.rangeKey===k?'active':''}" onclick="ex134SetRange('${k}')">${l}</button>`).join('')}</div><div class="ex134-asof">Período analisado · ${fmt(r.from)} → ${fmt(r.to)} · último fato realizado ${fmt(j.period?.last_available)}</div></div></div><div class="ex134-kpis"><div class="ex134-kpi"><span>Gasto no período</span><b>${brl(sel)}</b><small>${num(j.period?.months_in_selection)} competência(s)</small></div><div class="ex134-kpi"><span>Média mensal</span><b>${brl(q.monthly_average)}</b><small>média das competências selecionadas</small></div><div class="ex134-kpi ${delta<=0?'good':'warn'}"><span>2026 vs 2025 · até ${fmt(r.to).slice(0,5)}</span><b>${dp==null?'—':`${delta>0?'+':''}${num(dp).toFixed(1)}%`}</b><small>${brl(q.current_ytd)} vs ${brl(q.prior_ytd)}</small></div><div class="ex134-kpi"><span>Últimos 12 meses</span><b>${brl(q.last_12m)}</b><small>janela móvel até ${fmt(r.to)}</small></div><div class="ex134-kpi"><span>Conta corrente</span><b>${brl(acc)}</b><small>${sel?((100*acc/sel).toFixed(1)+'% do período'):''}</small></div><div class="ex134-kpi"><span>Cartões</span><b>${brl(card)}</b><small>${sel?((100*card/sel).toFixed(1)+'% do período'):''}</small></div></div><div class="ex134-grid"><div class="ex134-panel yearpanel"><div class="ex134-panelhead"><div><span>Histórico completo</span><h3>Evolução anual · 2013 → ${ys.at(-1)?.year||''}</h3></div><b>${brl(q.history_total)} acumulados</b></div>${ex134Annual(ys)}</div><div class="ex134-panel"><div class="ex134-panelhead"><div><span>Leitura rápida</span><h3>O que chama atenção</h3></div></div><div class="ex134-insights"><div class="ex134-insight"><span>Maior ano</span><b>${hi.largest_year?.year||'—'}</b><small>${brl(hi.largest_year?.total)}</small></div><div class="ex134-insight"><span>Maior mês</span><b>${hi.largest_month?fmt(hi.largest_month.month):'—'}</b><small>${brl(hi.largest_month?.total)}</small></div><div class="ex134-insight"><span>Principal categoria · período</span><b>${esc(hi.top_category?.category||'—')}</b><small>${brl(hi.top_category?.total)}</small></div><div class="ex134-insight"><span>Financiamentos · período</span><b>${brl(q.financing_total)}</b><small>compromissos financeiros efetivamente pagos</small></div></div></div></div><div class="ex134-grid"><div class="ex134-panel"><div class="ex134-panelhead"><div><span>Últimos 24 meses</span><h3>Evolução mensal</h3></div><b>${fmt(j.period?.last_available)}</b></div>${ex134Months(ms)}</div><div class="ex134-panel"><div class="ex134-panelhead"><div><span>Composição do período</span><h3>Conta, cartão e patrimônio</h3></div></div>${ex134Rank([{name:'Conta corrente',total:acc,rows:0,share_pct:sel?100*acc/sel:0},{name:'Cartões',total:card,rows:0,share_pct:sel?100*card/sel:0},{name:'Financiamentos',total:q.financing_total,rows:0,share_pct:sel?100*num(q.financing_total)/sel:0},{name:'Imóvel / projeto',total:q.property_total,rows:0,share_pct:sel?100*num(q.property_total)/sel:0}],4)}</div></div><div class="ex134-three"><div class="ex134-panel"><div class="ex134-panelhead"><div><span>${esc(r.label)}</span><h3>Maiores categorias</h3></div></div>${ex134Rank(rk.categories,10)}</div><div class="ex134-panel"><div class="ex134-panelhead"><div><span>${esc(r.label)}</span><h3>Principais destinatários</h3></div></div>${ex134Rank(rk.counterparties,10)}</div><div class="ex134-panel"><div class="ex134-panelhead"><div><span>${esc(r.label)}</span><h3>Centros de custo</h3></div></div>${ex134Rank(rk.centers,10)}</div></div><details class="ex134-quality"><summary>Qualidade dos dados e pendências de cobertura</summary><div class="ex134-qualitygrid"><div><span>Movimentos de conta documentados até</span><b>${fmt(dq.latest_documentary_direct_date)}</b></div><div><span>Sem categoria</span><b>${brl(dq.unclassified_total)}</b></div><div><span>Centro de custo não atribuído</span><b>${brl(dq.unassigned_center_total)}</b></div><div><span>Cartões históricos ainda sem detalhe</span><b>${brl(dq.historical_card_without_detail)}</b></div></div><div class="ex134-note">O total histórico é preservado mesmo quando uma fatura antiga ainda não tem compras individualizadas. À medida que o detalhe é recuperado, o LTS melhora os rankings sem alterar o total econômico. Gap documental C6 ago/2024: ${brl(dq.c6_aug_2024_open_gap)}.</div></details></div>`}
function w134Conf(v){return ({medium_high:'média-alta',medium:'média',high:'alta',low:'baixa'})[String(v||'')]||'em revisão'}
patrimonio=function(){const w=D.wealth||{},vals=w.market_valuations||{},cv=vals.cipo_396||{},vv=vals.volvo_xc40||{},hist=w.cipo_396?.historical_excel||{},docs=D.documentary_commitments?.items||[],ci=docs.find(x=>x.commitment_id==='cipo_396')||{},accs=w.accounts||[],bank=sum(accs.map(x=>x.balance)),sn=w.asset_layers?.documentary_snapshots||[],d0=sum(sn.filter(x=>x.liquidity_class==='D+0').map(x=>x.value_brl)),vested=sum(sn.filter(x=>x.liquidity_class==='D+3').map(x=>x.value_brl)),fgts=sum(sn.filter(x=>x.liquidity_class==='restricted').map(x=>x.value_brl)),future=sum(sn.filter(x=>x.liquidity_class==='future').map(x=>x.value_brl)),cVal=num(cv.central_value_brl),cDebt=num(ci.debt_balance||w.cipo_396?.mortgage?.current_debt_balance),vVal=num(vv.central_value_brl),vDebt=num(vv.metadata?.documented_total_financed_brl),liquid=bank+d0+vested,assets=liquid+fgts+cVal+vVal,debts=cDebt+vDebt,net=assets-debts,low=liquid+fgts+num(cv.low_value_brl)+num(vv.low_value_brl)-debts,high=liquid+fgts+num(cv.high_value_brl)+num(vv.high_value_brl)-debts,cEq=cVal-cDebt,vEq=vVal-vDebt,com=D.commitments?.commitments||[],cooph=com.find(x=>x.id==='coopharma')||{},fam=com.find(x=>x.id==='pai_mae')||{},cPct=cVal?Math.max(0,Math.min(100,100*cEq/cVal)):0,vPct=vVal?Math.max(0,Math.min(100,100*vEq/vVal)):0;return `<div class="ex134-page"><div class="ex134-head"><div><span class="eye">Patrimônio</span><h1>Quanto você tem, quanto deve e quanto é seu.</h1><p>Ativos e dívidas em uma mesma leitura. Estimativas de mercado ficam separadas de valores documentais e awards futuros ficam fora do patrimônio adquirido.</p></div><div class="ex134-asof">Posições documentais até ${fmt(accs.map(x=>x.as_of).sort().at(-1)||today())}</div></div><div class="w134-hero"><div class="w134-main"><span>Patrimônio líquido estimado</span><strong>${brl(net)}</strong><small>Faixa de referência ${brl(low)} → ${brl(high)} · exclui compromissos sem saldo devedor atual certificado.</small></div><div class="w134-kpi"><span>Ativos considerados</span><b>${brl(assets)}</b><small>liquidez + FGTS + imóvel + Volvo</small></div><div class="w134-kpi"><span>Dívidas conhecidas</span><b>${brl(debts)}</b><small>CIPÓ + dívida inicial/documental do Volvo</small></div><div class="w134-kpi"><span>Liquidez até D+3</span><b>${brl(liquid)}</b><small>caixa + Cofrinho + RSU vested</small></div></div><div class="w134-balance"><div class="w134-asset"><div class="w134-assettop"><div><span class="eye">Imóvel</span><h3>CIPÓ 396 · cobertura duplex</h3></div><span class="w134-tag">175 m² · 4 vagas · jacuzzi</span></div><div class="w134-facts"><div><span>Valor de mercado</span><b>${brl(cVal)}</b><small>${brl(cv.low_value_brl)} → ${brl(cv.high_value_brl)} · confiança ${w134Conf(cv.confidence)}</small></div><div><span>Saldo devedor</span><b>${brl(cDebt)}</b><small>posição documental Bradesco</small></div><div><span>Equity estimado</span><b>${brl(cEq)}</b><small>valor de mercado − dívida</small></div><div><span>Compra + reforma</span><b>${brl(hist.purchase_plus_reform_accum_brl)}</b><small>histórico do Excel; não é valor de mercado</small></div></div><div class="w134-equitybar"><i style="width:${cPct}%"></i></div><div class="ex134-note">Reformas e melhorias registradas no histórico: ${brl(hist.reforms_improvements_brl)}. O preço pedido do próprio imóvel não é tratado como venda comparável independente.</div><div class="w134-alert">Financiamento: parcelas exatas carregadas até 20/12/2029. O contrato segue até 20/06/2052 e é sujeito a TR; valores posteriores ainda não documentados não são considerados zero.</div></div><div class="w134-asset"><div class="w134-assettop"><div><span class="eye">Veículo</span><h3>Volvo XC40 · 2019/2020</h3></div><span class="w134-tag">blindado Avalon</span></div><div class="w134-facts"><div><span>Valor de mercado</span><b>${brl(vVal)}</b><small>${brl(vv.low_value_brl)} → ${brl(vv.high_value_brl)} · confiança ${w134Conf(vv.confidence)}</small></div><div><span>Dívida documentada</span><b>${brl(vDebt)}</b><small>não é soma das parcelas futuras</small></div><div><span>Equity estimado</span><b>${brl(vEq)}</b><small>valor de mercado − dívida conhecida</small></div><div><span>Valor do bem no contrato</span><b>${brl(vv.metadata?.documented_purchase_value_brl)}</b><small>âncora de custo documental</small></div></div><div class="w134-equitybar"><i style="width:${vPct}%"></i></div><div class="ex134-note">Faixa ainda é provisória porque versão/trim e quilometragem não estão documentadas no LTS.</div></div></div><div class="w134-stack"><div class="w134-list"><h3>Liquidez e reservas</h3><div class="w134-row"><div><b>Caixa bancário</b><span>${accs.map(x=>`${x.institution} ${brl(x.balance)}`).join(' · ')}</span></div><strong>${brl(bank)}</strong></div><div class="w134-row"><div><b>Cofrinho Itaú</b><span>D+0</span></div><strong>${brl(d0)}</strong></div><div class="w134-row"><div><b>RSU já vested</b><span>D+3</span></div><strong>${brl(vested)}</strong></div><div class="w134-row"><div><b>FGTS</b><span>contingência ~D+30</span></div><strong>${brl(fgts)}</strong></div></div><div class="w134-list"><h3>Fora do patrimônio líquido acima</h3><div class="w134-row"><div><b>Awards futuros</b><span>ainda condicionais/indisponíveis</span></div><strong>${brl(future)}</strong></div><div class="w134-row"><div><b>Coopharma</b><span>fluxo econômico futuro; saldo atual não certificado</span></div><strong>${brl(cooph.remaining_economic_outflow)}</strong></div><div class="w134-row"><div><b>Pai e Mãe</b><span>cronograma histórico; saldo atual não certificado</span></div><strong>${brl(fam.remaining_scheduled_outflow)}</strong></div><div class="ex134-note">Esses compromissos são mostrados para não desaparecerem da análise, mas não são subtraídos como “dívida atual” sem um saldo devedor documental.</div></div></div></div>`}
function p134LayerName(id){return ({cash:'Caixa',d01:'Cofrinho',rsu_vested:'RSU vested',future_vestings:'Novos vestings',fgts:'FGTS'})[id]||id}
planejamento=function(){const l=D.planning_ladder||{},layers=l.layers||[],eps=l.gap_episodes||[],fg=l.fgts_access||{},p=D.planning||{},w=D.wealth||{},future=(w.asset_layers?.derived_future_schedule||[]).filter(x=>String(x.available_date)>=today()&&String(x.available_date)<=String(l.to||'9999-12-31')).slice(0,5),cash=layers.find(x=>x.id==='cash')||{},d01=layers.find(x=>x.id==='d01')||{},vest=layers.find(x=>x.id==='rsu_vested')||{},gap=l.first_real_gap_date,immediate=num(cash.starting_amount)+num(d01.starting_amount),realizable=immediate+num(vest.starting_amount);return `<div class="ex134-page"><div class="ex134-head"><div><span class="eye">Planejamento</span><h1>Até quando sua liquidez aguenta.</h1><p>A leitura segue a ordem real de acesso ao dinheiro: caixa, Cofrinho, RSU já vested, novos vestings e FGTS de contingência.</p></div><div class="ex134-asof">Horizonte · ${fmt(l.from)} → ${fmt(l.to)}</div></div><div class="p134-hero"><div class="p134-main"><span>Primeiro gap após as camadas condicionais</span><strong>${gap?fmt(gap):'Sem gap'}</strong><small>${eps[0]?`Primeiro episódio: ${eps[0].days} dia(s) · pior ponto ${brl(eps[0].worst_balance)} · recupera em ${fmt(eps[0].recovery_date)}.`:'Nenhum episódio negativo no horizonte.'}</small></div><div class="p134-kpi"><span>Caixa + Cofrinho</span><b>${brl(immediate)}</b><small>próxima camada em ${fmt(d01.first_need_next_layer)}</small></div><div class="p134-kpi"><span>Com RSU vested</span><b>${brl(realizable)}</b><small>D+3 · próxima camada em ${fmt(vest.first_need_next_layer)}</small></div><div class="p134-kpi"><span>FGTS de contingência</span><b>${brl(fg.amount_brl)}</b><small>${fg.request_by_date?`se for usar no primeiro gap, solicitar por volta de ${fmt(fg.request_by_date)}`:'sem acionamento indicado'}</small></div></div><div class="ex134-panel"><div class="ex134-panelhead"><div><span>Escada de liquidez</span><h3>Quando cada fonte precisa entrar</h3></div></div><div class="p134-road">${layers.map(x=>`<div class="p134-step"><span>${esc(p134LayerName(x.id))} · ${esc(x.liquidity||'')}</span><b>${x.id==='future_vestings'?'condicional':brl(x.starting_amount)}</b><small>${x.first_need_next_layer?`próxima camada em ${fmt(x.first_need_next_layer)}`:'sem nova camada no horizonte'}</small></div>`).join('')}</div></div>${eps.length?`<div class="ex134-panel"><div class="ex134-panelhead"><div><span>Risco de caixa</span><h3>Episódios de saldo negativo previstos</h3></div><b>${eps.length} episódio(s)</b></div><div class="p134-episodes">${eps.map(e=>`<div class="p134-episode"><span>${fmt(e.start_date)} → ${fmt(e.end_date)}</span><b>Pior ponto ${brl(e.worst_balance)}</b><small>${e.days} dia(s) · recuperação em ${fmt(e.recovery_date)}</small></div>`).join('')}</div><div class="w134-alert">${fg.covers_horizon_if_available?'O FGTS atual cobre todos os gaps modelados se estiver disponível a tempo.':`O FGTS ajuda, mas não cobre todo o horizonte: mesmo com ele, o modelo volta a ficar negativo em ${fmt(fg.first_negative_even_with_fgts)}.`}</div></div>`:''}<div class="ex134-panel"><div class="ex134-panelhead"><div><span>Entradas condicionais</span><h3>Próximos vestings / awards mapeados</h3></div><b>não são caixa garantido</b></div><div class="p134-future">${future.map(x=>`<div><span>${fmt(x.available_date)} · ${esc(x.asset_type)}</span><b>${brl(x.net_value_brl!=null?x.net_value_brl:x.gross_value_brl)}</b></div>`).join('')||'<div class="empty">Sem eventos condicionais no horizonte.</div>'}</div><div class="ex134-note">Valores brutos continuam sujeitos a preço, câmbio, tributação e efetiva liquidação. O LTS só os usa depois da data de vesting/settlement prevista.</div></div></div>`}

<script id="expense-month-year-v135-js">/* expense-month-year-v135 */
function ex135Range(k){const t=today(),d=new Date(t+'T12:00:00'),y=t.slice(0,4);if(k==='ytd')return {from:y+'-01-01',to:t,label:'Ano atual'};if(k==='6m'){d.setDate(1);d.setMonth(d.getMonth()-5);return {from:d.toISOString().slice(0,10),to:t,label:'Últimos 6 meses'}};if(k==='12m'){d.setDate(1);d.setMonth(d.getMonth()-11);return {from:d.toISOString().slice(0,10),to:t,label:'Últimos 12 meses'}};if(k==='2023')return {from:'2023-01-01',to:t,label:'Desde 2023'};return {from:'2013-10-10',to:t,label:'Desde 2013'}}
function ex135State(){const s=window.EX135||(window.EX135={rangeKey:'ytd',winKey:'6m',loading:false,error:null,data:null,key:null,month:null,monthData:null,monthLoading:false,monthError:null,monthCategory:null});const r=ex135Range(s.rangeKey),key=r.from+'|'+r.to;if(s.key!==key&&!s.loading)ex135Load(s.rangeKey);return s}
async function ex135Load(k){const s=window.EX135||(window.EX135={});s.rangeKey=k||s.rangeKey||'ytd';const r=ex135Range(s.rangeKey);s.key=r.from+'|'+r.to;s.loading=true;s.error=null;if(V==='Despesas')render();try{const {data,error}=await S.rpc('lts_browser_expense_executive_v3',{p_from:r.from,p_to:r.to});if(error||!data)throw Error(error?.message||'Não foi possível carregar Despesas');s.data=data}catch(e){s.error=String(e?.message||e)}finally{s.loading=false;if(V==='Despesas')render()}}
function ex135SetRange(k){const s=window.EX135||(window.EX135={});if(s.rangeKey===k)return;s.rangeKey=k;s.key=null;s.data=null;s.month=null;s.monthData=null;ex135Load(k)}
function ex135SetWindow(k){const s=window.EX135||(window.EX135={});s.winKey=k;if(V==='Despesas')render()}
function ex135MonthLabel(v,long=false){if(!v)return '—';try{return new Intl.DateTimeFormat('pt-BR',long?{month:'long',year:'numeric'}:{month:'short',year:'2-digit'}).format(new Date(String(v).slice(0,10)+'T12:00:00')).replace('.','')}catch(e){return String(v).slice(0,7)}}
function ex135Pct(v){if(v==null||!Number.isFinite(Number(v)))return '<span class="ex135-delta flat">—</span>';const n=num(v),c=n>1?'up':n<-1?'down':'flat';return `<span class="ex135-delta ${c}">${n>0?'+':''}${n.toFixed(1)}%</span>`}
function ex135Coverage(v){const n=Math.max(0,Math.min(100,num(v)));return `<div class="ex135-coverage"><i style="width:${n}%"></i></div>`}
function ex135HumanCategory(v){return String(v||'Não identificado')==='Cartão — detalhe histórico não recuperado'?'Compras antigas de cartão ainda sem detalhamento':String(v||'Não identificado')}
function ex135TopCats(xs,limit=3){return `<div class="ex135-cats">${(xs||[]).slice(0,limit).map(x=>`<span class="ex135-cat" title="${brl(x.total)}">${esc(ex135HumanCategory(x.name))}</span>`).join('')||'<span class="mut">Sem composição disponível</span>'}</div>`}
function ex135Rank(xs,knownTotal,limit=12){const a=(xs||[]).slice(0,limit),mx=Math.max(1,...a.map(x=>Math.abs(num(x.total))));return `<div class="ex135-rank">${a.map((x,i)=>{const sh=knownTotal?100*num(x.total)/knownTotal:0;return `<div class="ex135-rankrow"><div><b>${i+1}. ${esc(ex135HumanCategory(x.name))}</b><small>${sh.toFixed(1)}% do valor com categoria conhecida</small><div class="ex135-bar"><i style="width:${Math.max(1,Math.round(Math.abs(num(x.total))/mx*100))}%"></i></div></div><strong>${brl(x.total)}</strong></div>`}).join('')||'<div class="empty">Sem categorias detalhadas neste período.</div>'}</div>`}
function ex135WindowCards(j,s){const rw=j.rolling_windows||{};return `<div class="ex135-three">${['3m','6m','12m'].map(k=>{const x=rw[k]||{},on=s.winKey===k;return `<button class="ex135-window ${on?'active':''}" onclick="ex135SetWindow('${k}')" style="text-align:left;color:inherit;cursor:pointer"><span>${k==='3m'?'3 meses':k==='6m'?'6 meses':'12 meses'}</span><b>${brl(x.total)}</b><small>média ${brl(x.monthly_average)}/mês · financiamentos ${brl(x.financing_total)}</small>${ex135Coverage(x.category_detail_pct)}<small>${num(x.category_detail_pct).toFixed(1)}% com categoria conhecida · ${num(x.transaction_detail_pct).toFixed(1)}% individualizado</small></button>`}).join('')}</div>`}
function ex135MonthRows(xs){const a=[...(xs||[])].reverse();return `<div class="ex135-monthwrap"><div class="ex135-monthhead"><div>Mês</div><div>Total</div><div>vs mês ant.</div><div>vs ano ant.</div><div>Principais categorias</div><div>Detalhe</div></div>${a.map(x=>`<div class="ex135-monthrow ${x.is_partial?'partial':''}" onclick="ex135OpenMonth('${x.month}')"><div class="month">${esc(ex135MonthLabel(x.month))}${x.is_partial?'<small>até '+fmt(x.month).slice(0,0)+String((window.EX135?.data?.period?.to||today())).slice(8,10)+'/'+String((window.EX135?.data?.period?.to||today())).slice(5,7)+'</small>':''}</div><div class="total">${brl(x.total)}</div><div>${ex135Pct(x.mom_comparison_pct)}</div><div>${ex135Pct(x.yoy_comparison_pct)}</div><div>${ex135TopCats(x.top_categories,3)}</div><div class="ex135-cov"><b>${num(x.category_detail_pct).toFixed(0)}%</b><small>categoria · ${num(x.transaction_detail_pct).toFixed(0)}% individual</small></div></div>`).join('')}</div>`}
function ex135YearRows(xs){const a=[...(xs||[])].reverse();return `<div class="ex135-yearwrap"><div class="ex135-yearhead"><div>Ano</div><div>Total</div><div>Média/mês</div><div>vs anterior</div><div>Financiamentos</div><div>Principais categorias</div><div>Detalhe</div></div>${a.map(x=>`<div class="ex135-yearrow"><div><b>${x.year}</b>${x.is_partial_year?'<br><small>até '+String(today()).slice(8,10)+'/'+String(today()).slice(5,7)+'</small>':''}</div><div><b>${brl(x.total)}</b></div><div>${brl(x.monthly_average)}</div><div>${ex135Pct(x.comparison_pct)}</div><div>${brl(x.financing_total)}</div><div>${ex135TopCats(x.top_categories,3)}</div><div class="ex135-cov"><b>${num(x.category_detail_pct).toFixed(0)}%</b><small>categoria · ${num(x.transaction_detail_pct).toFixed(0)}% individual</small></div></div>`).join('')}</div>`}
function ex135Trends(xs){return `<div class="ex135-trends">${(xs||[]).map(x=>{const ss=x.series||[],mx=Math.max(1,...ss.map(z=>Math.abs(num(z.total))));return `<div class="ex135-trend"><div class="ex135-trendname"><b>${esc(ex135HumanCategory(x.name))}</b><small>últimos 12 meses</small></div><div class="ex135-trendtotal">${brl(x.total)}</div><div class="ex135-spark" title="${esc(x.name)} · evolução mensal">${ss.map(z=>`<i title="${ex135MonthLabel(z.month)} · ${brl(z.total)}" style="height:${Math.max(2,Math.round(Math.abs(num(z.total))/mx*100))}%"></i>`).join('')}</div></div>`}).join('')||'<div class="empty">Sem série categorizada suficiente.</div>'}</div>`}
async function ex135OpenMonth(month,category=null){const s=window.EX135||(window.EX135={});s.month=month;s.monthCategory=category;s.monthLoading=true;s.monthError=null;if(V==='Despesas')render();try{const {data,error}=await S.rpc('lts_browser_expense_month_detail_v2',{p_month:month,p_category:category||null});if(error||!data)throw Error(error?.message||'Não foi possível abrir o mês');s.monthData=data}catch(e){s.monthError=String(e?.message||e)}finally{s.monthLoading=false;if(V==='Despesas')render()}}
function ex135CloseMonth(){const s=window.EX135||(window.EX135={});s.month=null;s.monthData=null;s.monthCategory=null;s.monthError=null;if(V==='Despesas')render()}
function ex135MonthDetail(s){if(!s.month)return '';if(s.monthLoading)return `<div class="ex135-detail">Abrindo ${esc(ex135MonthLabel(s.month,true))}…</div>`;if(s.monthError)return `<div class="ex135-detail"><b>Não foi possível abrir o mês.</b><div class="mut">${esc(s.monthError)}</div><button class="chip" onclick="ex135CloseMonth()">Fechar</button></div>`;const d=s.monthData||{},cats=(d.categories||[]).filter(x=>x.name!=='Cartão — detalhe histórico não recuperado'),items=d.items||[];return `<div class="ex135-detail"><div class="ex135-detailhead"><div><span class="ex135-eye">Drilldown mensal</span><h3>${esc(ex135MonthLabel(d.month,true))}${d.is_partial?' · parcial':''}</h3><div class="mut">${s.monthCategory?'Categoria '+esc(s.monthCategory)+' · ':''}${items.length} item(ns) · ${brl(d.total)}</div></div><button class="chip" onclick="ex135CloseMonth()">Fechar</button></div><div class="ex135-detailcats"><button class="${!s.monthCategory?'active':''}" onclick="ex135OpenMonth('${d.month}',null)">Tudo</button>${cats.slice(0,14).map(x=>`<button class="${s.monthCategory===x.name?'active':''}" onclick="ex135OpenMonth('${d.month}',${JSON.stringify(x.name)})">${esc(x.name)} · ${brl(x.total)}</button>`).join('')}</div><div class="ex135-items">${items.slice(0,180).map(x=>`<div class="ex135-item"><span>${fmt(x.transaction_date||x.event_date)}</span><div><b>${esc(x.counterparty||'Não identificado')}</b><span>${esc(ex135HumanCategory(x.category))} · ${esc(x.origin_name||x.origin_type||'')} · ${x.detail_level==='category_only'?'composição histórica da fatura':x.detail_level==='total_only'?'fatura consolidada sem composição':'lançamento individual'}</span></div><strong>${brl(x.amount)}</strong></div>`).join('')||'<div class="empty">Sem lançamentos.</div>'}</div>${items.length>180?`<div class="mut" style="margin-top:6px">Mostrando 180 de ${items.length} lançamentos.</div>`:''}</div>`}
function despesas(){const s=ex135State(),r=ex135Range(s.rangeKey||'ytd');if(s.loading&&!s.data)return `<div class="ex135-page"><div class="ex135-head"><div><span class="ex135-eye">Despesas</span><h1>Quanto saiu — mês a mês.</h1><p>Consolidando conta, cartão, financiamentos e patrimônio sem dupla contagem.</p></div></div><div class="ex135-panel">Carregando histórico…</div></div>`;if(s.error&&!s.data)return `<div class="section notice">Falha ao carregar Despesas: ${esc(s.error)}</div>`;const j=s.data||{},q=j.summary||{},ms=j.monthly_detail||[],ys=j.yearly_detail||[],rw=j.rolling_windows||{},w=rw[s.winKey||'6m']||{},last=ms.at(-1)||{},cmp=last.is_partial?`mesmos dias: ${ex135Pct(last.mom_comparison_pct)} vs mês anterior · ${ex135Pct(last.yoy_comparison_pct)} vs ano anterior`:`${ex135Pct(last.mom_comparison_pct)} vs mês anterior · ${ex135Pct(last.yoy_comparison_pct)} vs ano anterior`,coverage=num(w.category_detail_pct);return `<div class="ex135-page"><div class="ex135-head"><div><span class="ex135-eye">Despesas · visão executiva</span><h1>Quanto você gastou — e como isso evoluiu.</h1><p>Do mês ao histórico completo: total gasto, composição, tendências e drilldown. Pagamento de fatura e transferências próprias não duplicam consumo.</p></div><div><div class="ex135-periods">${[['ytd','Ano atual'],['6m','6 meses'],['12m','12 meses'],['2023','Desde 2023'],['all','Desde 2013']].map(([k,l])=>`<button class="${s.rangeKey===k?'active':''}" onclick="ex135SetRange('${k}')">${l}</button>`).join('')}</div><div class="ex135-asof">${esc(r.label)} · ${fmt(r.from)} → ${fmt(r.to)}</div></div></div><div class="ex135-hero"><div class="ex135-main"><span>Gasto no período selecionado</span><strong>${brl(q.selected_total)}</strong><small>${num(j.period?.months_in_selection)} competência(s) · média ${brl(q.monthly_average)}/mês</small></div><div class="ex135-kpi"><span>${ex135MonthLabel(last.month,true)}${last.is_partial?' · parcial':''}</span><b>${brl(last.total)}</b><small>${cmp.replace(/<[^>]*>/g,'')}</small></div><div class="ex135-kpi"><span>Últimos 6 meses · financiamentos</span><b>${brl(rw['6m']?.financing_total)}</b><small>financiamentos, empréstimos e compromissos pagos</small></div><div class="ex135-kpi ${coverage>=85?'good':coverage>=60?'warn':''}"><span>Cobertura de categorias · 6 meses</span><b>${num(rw['6m']?.category_detail_pct).toFixed(0)}%</b><small>${brl(rw['6m']?.category_known_total||rw['6m']?.known_category_total)} com categoria conhecida · ${num(rw['6m']?.transaction_detail_pct).toFixed(0)}% individualizado</small></div></div><div class="ex135-panel"><div class="ex135-panelhead"><div><span>Janelas móveis</span><h3>Quanto saiu nos últimos 3, 6 e 12 meses</h3></div><small>toque para abrir a composição</small></div>${ex135WindowCards(j,s)}</div><div class="ex135-panel"><div class="ex135-panelhead"><div><span>${s.winKey==='3m'?'Últimos 3 meses':s.winKey==='12m'?'Últimos 12 meses':'Últimos 6 meses'}</span><h3>Para onde foi o dinheiro com categoria conhecida</h3></div><b>${brl(w.known_category_total)} de ${brl(w.total)}</b></div>${ex135Rank(w.top_categories,w.known_category_total,12)}${num(w.category_unallocated_total)>0?`<div class="mut" style="margin-top:8px">${brl(w.category_unallocated_total)} ainda estão preservados apenas como total de fatura. Esse valor faz parte do gasto, mas fica fora do ranking até existir composição documental.</div>`:''}</div>${ex135MonthDetail(s)}<div class="ex135-panel"><div class="ex135-panelhead"><div><span>${esc(r.label)}</span><h3>Mês a mês</h3></div><small>clique em um mês para abrir os lançamentos</small></div>${ex135MonthRows(ms)}</div><div class="ex135-panel"><div class="ex135-panelhead"><div><span>Histórico completo</span><h3>Ano a ano</h3></div><small>ano atual comparado ao mesmo período do ano anterior</small></div>${ex135YearRows(ys)}</div><div class="ex135-panel"><div class="ex135-panelhead"><div><span>Evolução de categorias</span><h3>Como os maiores gastos se moveram nos últimos 12 meses</h3></div><small>categorias conhecidas; inclui composição histórica certificada</small></div>${ex135Trends(j.category_trends_12m)}</div><details class="ex135-panel ex135-quality"><summary>Cobertura do histórico</summary><div class="ex135-qualitybody"><div><span>Total histórico</span><b>${brl(q.history_total)}</b></div><div><span>Categoria conhecida · período</span><b>${num(j.data_quality?.selected_category_detail_pct).toFixed(0)}%</b></div><div><span>Lançamento individualizado · período</span><b>${num(j.data_quality?.selected_transaction_detail_pct).toFixed(0)}%</b></div><div><span>Ainda sem categoria no período</span><b>${brl(j.data_quality?.selected_category_unallocated_total)}</b></div><div><span>Composição histórica certificada</span><b>${brl(j.data_quality?.selected_category_allocated_history_total)}</b></div><div><span>Último fato realizado</span><b>${fmt(j.period?.last_available)}</b></div></div><div class="mut" style="margin-top:8px">O total econômico não muda quando uma fatura antiga ganha composição por categoria. Categoria conhecida e lançamento individualizado são níveis diferentes: o LTS mostra cada um separadamente e nunca inventa estabelecimento. Grupo/Macrogrupo só será agregado quando houver mapeamento documental.</div></details></div>`}
</script>
