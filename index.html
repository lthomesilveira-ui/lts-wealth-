function flowVals(x,prev){

        entries=sum(cashEv.filter(e=>num(e.signed_amount)>0).map(e=>e.signed_amount)),
        exits=Math.abs(sum(cashEv.filter(e=>num(e.signed_amount)<0).map(e=>e.signed_amount)));
  if(x.historical){
    if(ACC==='Consolidado'){
      const z=x.Consolidado||{},c=x.fix86_columns||{},abs=z.bank_balance,fin=c.saldo_final_operacional??abs;
      if(fin!=null){const pc=prev?.fix86_columns||{},pr=pc.saldo_final_operacional??(prev?.historical&&prev?.Consolidado?.bank_balance!=null?prev.Consolidado.bank_balance:fin-num(z.economic_net??z.net));return {prev:pr,en:entries,ex:exits,fin:fin,basis:'cash'}}
      return {prev:null,en:entries,ex:exits,fin:null,basis:'movement_only'}
    }
    const key=ACC==='Itaú'?'Itaú':ACC,z=x[key]||x[ACC]||{},abs=z.balance;
    if(abs!=null){const pz=prev?.historical?(prev[key]||prev[ACC]||{}):{},pr=pz.balance!=null?pz.balance:abs-num(z.net);return {prev:pr,en:entries,ex:exits,fin:abs,basis:'bank'}}
    return {prev:null,en:entries,ex:exits,fin:null,basis:'movement_only'}
  }
  const c=x.fix86_columns||{};
  if(ACC==='Consolidado')return {prev:c.saldo_anterior_operacional??c.saldo_anterior,en:c.entradas_operacionais??entries,ex:c.saidas_operacionais??exits,fin:c.saldo_final_operacional??c.saldo_final,basis:'cash'};
  const key=ACC==='Itaú'?'Itaú':ACC,z=x[key]||x[ACC]||{},isItau=ACC==='Itaú',fin=isItau?(z.operational_balance??z.balance):z.balance,
        pz=prev&&!prev.historical?(prev[key]||prev[ACC]||{}):{},pr=isItau?(pz.operational_balance??pz.balance):(pz.balance),
        net=isItau?(z.operational_net??z.net):z.net,wh=isItau?num(c.payroll_withholding_today||0):0;
  let en=entries,ex=exits;if(isItau&&wh<0){const a=en+wh;en=Math.max(a,0);ex+=Math.max(-a,0)}
  return {prev:pr!=null?pr:fin-num(net),en,ex,fin,basis:'bank'}
}

function flowDayMaterial(x,prev){if(x.date===today())return true;const ev=dayEvents(x.date);if(ev.length)return true;if(x.historical){if(ACC==='Consolidado')return Math.abs(num(x.summary?.entries))+Math.abs(num(x.summary?.exits))+Math.abs(num(x.summary?.net))>0;const key=ACC==='Itaú'?'Itaú':ACC;return Math.abs(num((x[key]||x[ACC]||{}).net))>0}const c=x.fix86_columns||{},p=prev?.fix86_columns||{};if(Math.abs(num(c.entradas))+Math.abs(num(c.saidas))>0)return true;const keys=['liq_d0_1','posicao_antes_rsus','rsus_vested','posicao_curto_prazo','liq_d30','fgts','rsus_futuras','posicao_economica_total'];return keys.some(k=>Math.abs(num(c[k])-num(p[k]))>0.005)}
function flowHistorySummary(ev,open){
