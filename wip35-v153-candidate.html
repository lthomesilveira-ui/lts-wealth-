function axisMoney(v){const a=Math.abs(v);if(a>=1000000)return `${v<0?'-':''}R$ ${(a/1000000).toFixed(1).replace('.',',')}m`;if(a>=1000)return `${v<0?'-':''}R$ ${Math.round(a/1000)}k`;return `R$ ${Math.round(v)}`}
function spark(raw,attentionDate){let vals=(raw||[]).map((x,i)=>typeof x==='object'?{value:num(x.value),date:x.date,label:x.label}:{value:num(x),date:null,label:i===0?'Hoje':null}).filter(x=>x.value!=null);if(vals.length<2)return '<div style="height:100%;display:grid;place-items:center;color:#7b8797;font-size:10px">Projeção em revalidação</div>';const W=560,H=160,L=44,R=10,T=24,B=27,min0=Math.min(...vals.map(x=>x.value),0),max0=Math.max(...vals.map(x=>x.value),0),pad=Math.max(5000,(max0-min0)*.12),min=min0-pad*.35,max=max0+pad*.35,span=Math.max(1,max-min),pts=vals.map((x,i)=>[L+(W-L-R)*i/(vals.length-1),T+(H-T-B)*(1-(x.value-min)/span)]),zero=T+(H-T-B)*(1-(0-min)/span);let worst=0;vals.forEach((x,i)=>{if(x.value<vals[worst].value)worst=i});const yTicks=[max0,0,min0].filter((v,i,a)=>i===0||Math.abs(v-a[i-1])>1);const poly=pts.map(x=>x.join(',')).join(' ');const area=`${L},${zero} ${poly} ${W-R},${zero}`;const labIdx=[0,Math.round((vals.length-1)/3),Math.round((vals.length-1)*2/3),vals.length-1].filter((v,i,a)=>a.indexOf(v)===i);const callX=pts[worst][0],callY=pts[worst][1],callLeft=Math.min(W-132,Math.max(L+8,callX-58));return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="cashFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a68a7" stop-opacity=".13"/><stop offset="1" stop-color="#2a68a7" stop-opacity=".02"/></linearGradient></defs>${yTicks.map(v=>{const y=T+(H-T-B)*(1-(v-min)/span);return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e1e6ec" stroke-width="1"/><text x="2" y="${y+3}" font-size="9" fill="#46566b">${axisMoney(v)}</text>`}).join('')}<polygon points="${area}" fill="url(#cashFill)"/><line x1="${L}" y1="${zero}" x2="${W-R}" y2="${zero}" stroke="#9ea9b7"/><polyline points="${poly}" fill="none" stroke="#123f7d" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===worst?4:2.2}" fill="${vals[i].value<0?'#d13a34':'#123f7d'}"/
