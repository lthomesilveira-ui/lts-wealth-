uras`,cards.open)}${commit('card','Próximo cartão',cards.nextName,cards.next)}${commit('wealth','Financiamentos / empréstimos','contratos ativos',n(we.debt))}${commit('flow','Saídas previstas','próximos 30 dias',0)}</div><div class="notice">${icon('warn')}<span>Atenção: saldo projetado negativo${p.date?` em ${date(p.date)}`:''} (sem usar contingência).</span></div></div></div></section><section class="row second"><div class="panel"><div class="panel-head"><span class="round">${icon('trend')}</span><h2>Evolução do caixa</h2></div><div class="panel-body"><div class="chart-wrap"><div class="chart-box">${spark(m.horizons)}</div><div class="chart-side"><div class="metric bad"><span>Pior saldo projetado</span><strong>${brl(p.worst)}</strong><span>${p.date?`em ${date(p.date)}`:''}</span></div><div class="metric good"><span>FGTS disponível hoje</span><strong>${brl(liq.fgts)}</strong><span>acionamento ~30 dias</span></div></div></div></div></div><div class="panel"><div class="panel-head"><span class="round">${icon('wealth')}</span><h2>Patrimônio e posição financeira</h2></div><div class="panel-body"><div class="wealth-wrap"><div><div class="wealth-table">${wealthRows.map(r=>`<div class="wealth-row"><i class="dot" style="background:${r[2]}"></i><span>${r[0]}</span><b>${brl(r[1])}</b><em>${(r[1]/Math.max(1,n(we.net))*100).toFixed(1).replace('.',',')}%</em><span class="wbar"><i style="width:${Math.min(100,Math.abs(r[1])/base*100)}%;background:${r[2]}"></i></span></div>`).join('')}</div><div class="wealth-total"><span>Patrimônio líquido</span><b>${brl(we.net)}</b></div></div><div class="net-card"><span>Patrimônio líquido</span><strong>${brl(we.net)}</strong><small>posição consolidada atual</small><div class="delta">Dados do LTS</div><button data-route2="Patrimônio">Ver detalhe completo ›</button></div></div></div></div></section><section class="attention"><div class="attention-head"><span class="round">${icon('target')}</span><h2>O que exige minha atenção</h2></div><div class="attention-grid"><div class="att-col"><h3>● Ações</h3>${att(`${w.actions||0} itens acionáveis`,'Revisar pendências priorizadas')}${att(`${w.docs||0} documento(s) para revisar`,'Abrir Atualizações')}${att(`${w.updates||0} atualizações em fila`,'Resolver ou confirmar')}<button data-route2="Atualizações">Ver todas as ações ›</button></div><div class="att-col alerts"><h3>● Alertas</h3>${att(p.date?`Caixa fica pressionado em ${date(p.date)}`:'Projeção de caixa disponível','Considere contingência e liquidez')}${att(cards.nextDate?`Próxima fatura vence em ${date(cards.nextDate)}`:'Próxima fatura','Acompanhar vencimento')}${att(`FGTS disponível: ${brl(liq.fgts)}`,'Prazo operacional ~30 dias')}<button data-route2="Fluxo Diário">Ver todos os alertas ›</button></div><div class="att-col insights"><h3>● Insights</h3>${att(`Patrimônio líquido ${brl(we.net)}`,'Posição consolidada')}${att(`Gasto do mês ${brl(m.expenses?.current)}`,delta?`${delta>0?'+':''}${delta.toFixed(1).replace('.',',')}% vs mês anterior`:'Comparação indisponível')}${att(`Liquidez D+3 ${brl(liq.through)}`,'Visão de curto prazo')}<button data-route2="Despesas">Ver mais insights ›</button></div></div></section>`;dash.querySelectorAll('[data-route2]').forEach(b=>b.addEventListener('click',()=>route(b.dataset.route2)))}function kpi(i,l,v,s,c){return `<div class="kpi ${c}"><span class="kpi-icon">${icon(i)}</span><div><label>${l}</label><strong>${v}</strong><small>${s}</small></div></div>`}function commit(i,t,m,a){return `<div class="commit-row">${icon(i)}<b>${t}</b><span class="meta">${m}</span><span class="amount">${a?brl(a):'—'}</span><span style="color:#9aa4b1;font-size:16px">›</span></div>`}function att(t,s){return `<div class="att-item"><i></i><div><b>${t}</b><span>${s}</span></div></div>`}function poll(){if(FIXTURE){model=fixture();route('Dashboard');return}const x=extract();if(x){model=x;render()}setTimeout(poll,600)}frame.addEventListener('load',()=>{setTimeout(()=>{if(active!=='Dashboard')deepRoute(active)},70
