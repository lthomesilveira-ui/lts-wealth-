function render(){if(active!=='Dashboard')return;const m=model||fixture(),liq=m.liq||{},cards=m.cards||{},we=m.wealth||{},p=m.plan||{},w=m.work||{},acc=liq.accounts||[],rows=we.rows||[];document.getElementById('topDate').innerHTML=icon('calendar')+`<span>${date(m.asof)}</span>`;const delta=num(m.expenses?.previous)&&num(m.expenses?.current)!=null?((m.expenses.current-m.expenses.previous)/Math.abs(m.expenses.previous)*100):null;const maxRow=Math.max(1,...rows.map(r=>Math.abs(num(r[1])||0)));const planKpi=p.validated?kpi('warn','Menor saldo projetado',money(p.worst),p.date?`em ${date(p.date)}`:'sem data','bad'):kpi('warn','Projeção de caixa','Em revalidação','FGTS conservador sem aportes futuros','');dash.innerHTML=`<h1 class="section-title">Sua posição hoje</h1><section class="kpis">${kpi('wallet','Disponível D+3',money(liq.through),'liquidez imediata')}${kpi('wallet','FGTS',money(liq.fgts),'contingência ~30 dias','green')}${kpi('card','Cartões em aberto',money(cards.open),cards.count!=null?`${cards.count} faturas abertas`:'posição atual')}${kpi('trend','Patrimônio líquido',money(we.net),'posição consolidada')}${planKpi}</section><section class="row"><div class="panel"><div class="panel-head"><span class="round">${icon('drop')}</span><h2>Liquidez</h2></div><div class="panel-body"><div class="liq-grid"><div><div class="mini-table">${acc.map(a=>`<div class="mini-row"><span class="bank ${a[2]}">${a[0].split(' ')[0].slice(0,4)}</span><span>${a[0]}</span><b>${money(a[1])}</b><span class="chev">›</span></div>`).join('')}</div><div class="mini-total"><span>Total realizável até D+3</span><b>${money(liq.through)}</b></div></div><div class="fgts-card"><h3>FGTS</h3><strong>${money(liq.fgts)}</strong><hr><div class="cont">${icon('calendar')}<span>contingência<br>~30 dias</span></div><small>recurso estratégico · sem projetar aportes futuros</small></div></div></div></div><div class="panel"><div class="panel-head"><span class="round">${icon('calendar')}</span><h2>Compromissos próximos</h2></div><div class="panel-body"><div class="commit-list">${(m.commitments||[]).map(x=>commit(x[0],x[1],x[2])).join('')}</div><div class="notice">${icon('warn')}<span>${p.validated&&p.date?`Atenção: saldo projetado negativo em ${date(p.date)} (sem usar contingência).`:'Planejamento em revalidação sob a regra conservadora do FGTS.'}</span></div></div></div></section><section class="row"><div class="panel"><div class="panel-head"><span class="round">${icon('trend')}</span><h2>Evolução do caixa</h2></div><div class="panel-body"><div class="chart-wrap"><div class="chart-box">${spark(m.horizons)}</div><div class="chart-side"><div class="metric bad"><span>${p.validated?'Pior saldo projetado':'Projeção'}</span><strong>${p.validated?money(p.worst):'Em revalidação'}</strong><span>${p.validated&&p.date?`em ${date(p.date)}`:'sem estimar FGTS futuro'}</span></div><div class="metric good"><span>FGTS disponível hoje</span><strong>${money(liq.fgts)}</strong><span>acionamento ~30 dias</span></div></div></div></div></div><div class="panel"><div class="panel-head"><span class="round">${icon('wealth')}</span><h2>Patrimônio e posição financeira</h2></div><div class="panel-body"><div class="wealth-wrap"><div><div class="wealth-table">${rows.slice(0,5).map(r=>`<div class="wealth-row"><i class="dot" style="background:${r[2]}"></i><span>${r[0]}</span><b>${money(r[1])}</b><em>${we.assets&&r[1]>0?(r[1]/we.assets*100).toFixed(1).replace('.',',')+'%':''}</em><span class="wbar"><i style="width:${Math.min(100,Math.abs(r[1])/maxRow*100)}%;background:${r[2]}"></i></span></div>`).join('')}</div><div class="wealth-total"><span>Patrimônio líquido</span><b>${money(we.net)}</b></div></div><div class="net-card"><span>Patrimônio líquido</span><strong>${money(we.net)}</strong><small>posição consolidada atual</small><div class="delta">Dados do LTS</div><button data-route2="Patrimônio">Ver detalhe completo ›</button></div></div></div></div></section><section class="attention"><div class="attention-head"><span class="round">${icon('target')}</span><h2>O que exige minha atenção</h2></div><div class="attention-grid"><div class="att-col"><h3>● Ações</h3>${att(`${w.actions||0} itens acionáveis`,'Revisar pendências priorizadas')}${att(`${w.docs||0} documento(s) para revisar`,'Abrir Atualizações')}${att(`${w.updates||0} atualizações em fila`,'Resolver ou confirmar')}<button data-route2="Atualizações">Ver todas as ações ›</button></div><div class="att-col alerts"><h3>● Alertas</h3>${att(p.validated&&p.date?`Caixa pressionado em ${date(p.date)}`:'Planejamento em revalidação',p.validated?'Considere liquidez e contingência':'Regra conservadora do FGTS')}${att(cards.nextDate?`Próxima fatura vence em ${date(cards.nextDate)}`:'Próxima fatura','Acompanhar vencimento')}${att(`FGTS disponível: ${money(liq.fgts)}`,'Prazo operacional ~30 dias')}<button data-route2="Fluxo Diário">Ver todos os alertas ›</button></div><div class="att-col insights"><h3>● Insights</h3>${att(`Patrimônio líquido ${money(we.net)}`,'Posição consolidada')}${att(`Gasto do mês ${money(m.expenses?.current)}`,delta!=null?`${delta>0?'+':''}${delta.toFixed(1).replace('.',',')}% vs mês anterior`:'Comparação indisponível')}${att(`Liquidez D+3 ${money(liq.through)}`,'Visão de curto prazo')}<button data-route2="Despesas">Ver mais insights ›</button></div></div></section>`;dash.querySelectorAll('[data-route2]').forEach(b=>b.addEventListener('click',()=>route(b.dataset.route2)))}
function poll(){if(FIXTURE){model=fixture();route('Dashboard');return}const x=extract();if(x){model=x;render()}setTimeout(poll,700)}frame.addEventListener('load',()=>setTimeout(()=>{if(active!=='Dashboard')deepRoute(active)},700));route('Dashboard');poll();
})();
</script></body></html>
