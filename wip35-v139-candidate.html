        .u139-context{margin:10px 0 2px;border:1px solid #e1e6eb;border-radius:12px;background:#fafbfd;padding:9px 11px}.u139-context summary{cursor:pointer;font-size:9px;font-weight:850;color:var(--mut)}.u139-context-list{display:grid;gap:6px;margin-top:8px}.u139-context-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:6px;border-top:1px solid #e8ecf0}.u139-context-item:first-child{border-top:0;padding-top:0}.u139-context-item b{font-size:9px}.u139-context-item span{font-size:7px;color:var(--mut);text-transform:uppercase;font-weight:850}
        .u137-flow{padding:11px 12px!important;margin:10px 0!important}.u137-flowhead h3{font-size:13px!important;margin-top:2px!important}.u137-flowhead p{display:none!important}.u137-steps{display:none!important}.u137-live{margin-top:7px!important}

    if(typeof w.u137Lifecycle==='function'){

          const anchor='<div class="u113-actions">';
