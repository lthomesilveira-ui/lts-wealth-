<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LTS Wealth · WIP35-v139 candidate</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f6f8}#shell{border:0;width:100%;height:100%;display:block}#badge{position:fixed;right:10px;bottom:10px;z-index:999999;background:#102B50;color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 9px;font:700 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.14);pointer-events:none}
</style>
</head>
<body>
<iframe id="shell" src="./wip35-v138-candidate.html?v139-parent"></iframe>
<div id="badge">CANDIDATA v139 · v136 permanece fallback</div>
<script>
(function(){
  const shell=document.getElementById('shell');
  let wired=null;
  function deepest(){
    try{
      const v138doc=shell.contentDocument;
      const v138shell=v138doc&&v138doc.getElementById('shell');
      const v137doc=v138shell&&v138shell.contentDocument;
      const app=v137doc&&v137doc.getElementById('app');
      if(!app)return null;
      return {w:app.contentWindow,d:app.contentDocument,app};
    }catch(e){return null}
  }
  function install(){
    const z=deepest();if(!z||!z.w||wired===z.w)return;
    const w=z.w,d=z.d; if(!w.S||typeof w.S.rpc!=='function'||typeof w.render!=='function')return;
    wired=w;
    const originalRpc=w.S.rpc.bind(w.S);
    w.S.rpc=function(name,args){
      const n=String(name||'');
      if((n==='lts_browser_flow_v1'||n==='lts_browser_flow_v2'||n==='lts_browser_flow_v3')&&args&&args.p_from&&args.p_to){
        return originalRpc('lts_browser_flow_v4',args);
      }
      return originalRpc(name,args);
    };

    if(d&&!d.getElementById('wip35-v139-updates-css')){
      const st=d.createElement('style');st.id='wip35-v139-updates-css';st.textContent=`
        .u139-flowline{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px;color:var(--mut);font-size:8px;font-weight:850}.u139-flowline span{background:#f2f5f8;border:1px solid #e3e8ed;border-radius:999px;padding:4px 7px}.u139-flowline span.active{background:#fff7e8;border-color:#d8c5a2;color:#735727}.u139-flowline i{font-style:normal;color:#a2acb6}
        .u139-context{margin:10px 0 2px;border:1px solid #e1e6eb;border-radius:12px;background:#fafbfd;padding:9px 11px}.u139-context summary{cursor:pointer;font-size:9px;font-weight:850;color:var(--mut)}.u139-context-list{display:grid;gap:6px;margin-top:8px}.u139-context-item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-top:6px;border-top:1px solid #e8ecf0}.u139-context-item:first-child{border-top:0;padding-top:0}.u139-context-item b{font-size:9px}.u139-context-item span{font-size:7px;color:var(--mut);text-transform:uppercase;font-weight:850}.u139-context-item small{display:block;font-size:7px;color:var(--mut);margin-top:2px;line-height:1.35}
        .u139-future{background:#f8f9fb;border-color:#e1e5ea}.u139-future summary{color:#687482}
        .u139-changes{margin:10px 0;border:1px solid #cfe3d8;border-radius:12px;background:#f6fbf8;padding:9px 11px}.u139-changes>span{display:block;font-size:7px;text-transform:uppercase;font-weight:900;color:#5a7a68;margin-bottom:5px}.u139-change{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid #dfebe4}.u139-change:first-of-type{border-top:0;padding-top:0}.u139-change b{font-size:9px;line-height:1.35}.u139-change strong{font-size:10px;white-space:nowrap}.u139-change small{display:block;font-size:7px;color:var(--mut);margin-top:2px}.u139-change details{margin-top:4px}.u139-change summary{cursor:pointer;font-size:7px;color:#668274}.u139-change .detail{font-size:7px;color:var(--mut);line-height:1.4;margin-top:4px}
        .u137-flow{padding:11px 12px!important;margin:10px 0!important}.u137-flowhead h3{font-size:13px!important;margin-top:2px!important}.u137-flowhead p{display:none!important}.u137-steps{display:none!important}.u137-live{margin-top:7px!important}
      `;d.head.appendChild(st);
    }

    w.u139FarFuture=function(x){
      const id=String(x?.id||'');
      const m=id.match(/^coverage_(?:salary|ipva)_(\d{4})$/);
      if(!m)return false;
      const year=Number(m[1]);
      return Number.isFinite(year)&&year>(new Date().getFullYear()+1);
    };

    if(typeof w.u137Lifecycle==='function'){
      w.u137Lifecycle=function(){
        const u=w.D?.updates||{},items=(u.items||[]).slice();
        const allActions=typeof w.updateIsAction==='function'?items.filter(w.updateIsAction):items;
        const actions=allActions.filter(x=>!w.u139FarFuture(x));
        const future=allActions.length-actions.length;
        const evidence=actions.filter(x=>['document_request','reconciliation'].includes(String(x.type))).length;
        const confirm=actions.filter(x=>['overdue_transfer_review','overdue_event_review','card_payment_review'].includes(String(x.type))).length;
        const decision=Math.max(0,actions.length-evidence-confirm);
        return `<div class="u137-flow"><div class="u137-flowhead"><div><span class="w104-eye">Fluxo de trabalho</span><h3>${actions.length} ação(ões) próximas</h3></div><span class="u105-num">${actions.length} ativa(s)</span></div><div class="u139-flowline"><span>Recebido</span><i>›</i><span>Interpretado</span><i>›</i><span>Reconciliado</span><i>›</i><span class="active">Decisão necessária</span><i>›</i><span>Resolvido</span></div><div class="u137-live"><span>${evidence} evidência/conciliação</span><span>${confirm} confirmação explícita</span><span>${decision} outra decisão</span>${future?`<span>${future} cobertura(s) futura(s)</span>`:''}</div></div>`;
      };
    }

    w.u139DocumentChanges=function(){
      const docs=w.D?.updates?.documents?.items||[];
      const changed=[];
      docs.forEach(doc=>{
        const cs=doc?.change_summary;
        if(!cs||cs.changed!==true)return;
        (cs.entries||[]).forEach(e=>changed.push({doc,e}));
      });
      if(!changed.length)return '';
      const rows=changed.slice(0,6).map(({doc,e})=>{
        const where=e.account_or_card|| (e.target_type==='document_card_purchase'?'Cartão':'Conta');
        const label=[where,e.date?w.fmt(e.date):'',e.category||''].filter(Boolean).join(' · ');
        const effect=e.effect_type==='card_purchase_no_bank_cash_effect'?'Compra documentada; efeito de caixa ocorre pela fatura.':'Evento aplicado ao fluxo.';
        const detail=[e.description,e.counterparty?`Contraparte: ${e.counterparty}`:'',e.cost_center?`Centro de custo: ${e.cost_center}`:'',effect].filter(Boolean).map(w.esc).join(' · ');
        return `<div class="u139-change"><div><b>Aplicado: ${w.esc(label)}</b><small>${w.esc(doc.phase_label||'Resolvido')}</small><details><summary>Ver detalhe</summary><div class="detail">${detail}</div></details></div><strong>${w.brl(e.amount)}</strong></div>`;
      }).join('');
      return `<div class="u139-changes"><span>O que mudou</span>${rows}</div>`;
    };

    if(typeof w.atualizacoes==='function'&&typeof w.updateIsAction==='function'){
      const baseUpdates=w.atualizacoes;
      w.atualizacoes=function(){
        const u=w.D?.updates;
        if(!u||!Array.isArray(u.items))return baseUpdates();
        const original=u.items;
        const allActions=original.filter(w.updateIsAction);
        const future=allActions.filter(w.u139FarFuture);
        const actions=allActions.filter(x=>!w.u139FarFuture(x));
        const context=original.filter(x=>!w.updateIsAction(x));
        let h='';
        try{u.items=actions;h=baseUpdates()}finally{u.items=original}
        const anchor='<div class="u113-actions">';
        const changes=w.u139DocumentChanges();
        if(changes)h=h.includes(anchor)?h.replace(anchor,changes+anchor):h+changes;
        if(future.length){
          const rows=future.map(x=>`<div class="u139-context-item"><div><b>${w.esc(x.title||x.id||'Cobertura futura')}</b><small>${w.esc(x.detail||'Mantido para revisão futura; nenhum valor é criado automaticamente.')}</small></div><span>futuro</span></div>`).join('');
          const block=`<details class="u139-context u139-future"><summary>Cobertura futura · ${future.length} item(ns)</summary><div class="u139-context-list">${rows}</div></details>`;
          h=h.includes(anchor)?h.replace(anchor,block+anchor):h+block;
        }
        if(context.length){
          const rows=context.map(x=>`<div class="u139-context-item"><div><b>${w.esc(x.title||x.id||'Informação')}</b>${x.detail?`<small>${w.esc(x.detail)}</small>`:''}</div><span>${w.esc(x.status||x.type||'informativo')}</span></div>`).join('');
          const block=`<details class="u139-context"><summary>Contexto / monitoramento · ${context.length} item(ns)</summary><div class="u139-context-list">${rows}</div></details>`;
          h=h.includes(anchor)?h.replace(anchor,block+anchor):h+block;
        }
        return h;
      };
    }

    w.LTS_CANDIDATE='wip35-v139-flow-cache-lifecycle-updates-priority-change-summary';
    try{w.render()}catch(e){}
  }
  function wire(){
    try{
      const v138doc=shell.contentDocument,v138shell=v138doc&&v138doc.getElementById('shell');
      if(v138shell){v138shell.addEventListener('load',()=>setTimeout(install,220));const v137doc=v138shell.contentDocument,app=v137doc&&v137doc.getElementById('app');if(app)app.addEventListener('load',()=>setTimeout(install,180));}
    }catch(e){}
    setTimeout(install,250);
  }
  shell.addEventListener('load',()=>setTimeout(wire,120));
  setInterval(install,1200);
})();
</script>
</body>
</html>
