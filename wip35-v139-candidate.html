    w.u139FarFuture=function(x){

      const baseUpdates=w.atualizacoes;
      w.atualizacoes=function(){
        const u=w.D?.updates;
        if(!u||!Array.isArray(u.items))return baseUpdates();
        const original=u.items;
        const allActions=original.filter(w.updateIsAction);
        const future=allActions.filter(w.u139FarFuture);
        const actions=allActions.filter(x=>!w.u139FarFuture(x));
        const context=original.filter(x=>!w.updateIsAction(x));
        let h='';

          const block=`<details class="u139-context u139-future"><summary>Cobertura futura · ${future.length} item(ns)</summary><div class="u139-context-list">${rows}</div></details>`;
          h=h.includes(anchor)?h.replace(anchor,block+anchor):h+block;

        if(context.length){
          const rows=context.map(x=>`<div class="u139-context-item"><div><b>${w.esc(x.title||x.id||'Informação')}</b>${x.detail?`<small>${w.esc(x.detail)}</small>`:''}</div><span>${w.esc(x.status||x.type||'informativo')}</span></div>`).join('');

<script>
(function(){
  const shell=document.getElementById('shell');
  let wired=null;
  function deepest(){
    try{
      const d1=shell.contentDocument,f1=d1&&d1.getElementById('shell');

  function install(){
    const z=deepest();if(!z||!z.w||wired===z.w)return;

    wired=w;
    if(d&&!d.getElementById('wip35-v139-evidence-css')){
      const st=d.createElement('style');st.id='wip35-v139-evidence-css';st.textContent=`
        .e139-panel{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:12px}.e139-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.e139-head span{font-size:8px;text-transform:uppercase;font-weight:900;color:var(--mut)}.e139-head h3{margin:3px 0 0;font-size:14px}.e139-head small{font-size:8px;color:var(--mut);max-width:330px;text-align:right;line-height:1.4}.e139-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.e139-kpi{border:1px solid #e3e8ed;border-radius:12px;padding:10px;background:#fafbfd}.e139-kpi span{display:block;font-size:7px;text-transform:uppercase;font-weight:900;color:var(--mut)}.e139-kpi b{display:block;font-size:15px;margin-top:5px}.e139-kpi small{display:block;font-size:7px;color:var(--mut);margin-top:3px;line-height:1.35}.e139-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.e139-box{border:1px solid #e3e8ed;border-radius:13px;padding:11px}.e139-box h4{margin:0 0 7px;font-size:11px}.e139-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:7px 0;border-top:1px solid #edf0f3}.e139-row:first-of-type{border-top:0}.e139-row b{font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.e139-row span{display:block;font-size:7px;color:var(--mut);margin-top:2px}.e139-row strong{font-size:9px;white-space:nowrap}.e139-history{overflow:auto}.e139-hrow{display:grid;grid-template-columns:minmax(150px,1.5fr) 55px 80px 80px 100px;gap:7px;align-items:center;min-width:600px;padding:7px 0;border-top:1px solid #edf0f3;font-size:8px}.e139-hrow.head{border-top:0;color:var(--mut);font-size:7px;text-transform:uppercase;font-weight:900}.e139-hrow b{font-size:9px}.e139-note{font-size:8px;color:var(--mut);line-height:1.45;margin-top:8px}.e139-loading{font-size:9px;color:var(--mut)}
        @media(max-width:820px){.e139-kpis{grid-template-columns:1fr 1fr}.e139-grid{grid-template-columns:1fr}.e139-head{flex-direction:column}.e139-head small{text-align:left}.e139-hrow{min-width:540px}}
        @media(max-width:520px){.e139-kpis{grid-template-columns:1fr}}
      `;d.head.appendChild(st);
    }
    const E=w.EX139EVIDENCE||(w.EX139EVIDENCE={expense:{key:null,loading:false,error:null,data:null},history:{loading:false,error:null,data:null,loaded:false}});
    function range(){
      try{return typeof w.ex135Range==='function'?w.ex135Range(w.EX135?.rangeKey||'ytd'):{from:'2023-01-01',to:w.today(),label:'Período'}}catch(e){return {from:'2023-01-01',to:w.today(),label:'Período'}}

    function ensureExpense(){

      w.S.rpc('lts_browser_expense_merchant_drilldown_v1',{p_from:r.from,p_to:r.to,p_category:null,p_limit:10}).then(({data,error})=>{if(error||!data)throw Error(error?.message||'Lente documental indisponível');s.data=data}).catch(e=>{s.error=String(e?.message||e)}).finally(()=>{s.loading=false;if(w.V==='Despesas')w.render()});

      return `<div class="e139-panel"><div class="e139-head"><div><span>Rastreabilidade do período</span><h3>Merchants de cartão e contrapartes de conta — sem inventar detalhe</h3></div><small>Merchant só aparece quando existe compra individual estruturada. Histórico recuperado apenas por categoria e fatura agregada ficam fora deste ranking.</small></div><div class="e139-kpis"><div class="e139-kpi"><span>Merchant de cartão documentado</span><b>${w.num(q.card_merchant_coverage_pct).toFixed(1)}%</b><small>${w.brl(q.card_merchant_amount)} em ${w.num(q.card_merchant_rows)} linha(s)</small></div><div class="e139-kpi"><span>Contraparte de conta</span><b>${w.num(q.cash_counterparty_coverage_pct).toFixed(0)}%</b><small>${w.brl(q.cash_counterparty_amount)} em ${w.num(q.cash_counterparty_rows)} linha(s)</small></div><div class="e139-kpi"><span>Cartão só por categoria</span><b>${w.brl(q.card_category_only_amount)}</b><small>categoria certificada, sem merchant individual</small></div><div class="e139-kpi"><span>Fatura ainda agregada</span><b>${w.brl(q.card_aggregate_fallback_amount)}</b><small>total preservado; composição ainda não recuperada</small></div></div><div class="e139-grid"><div class="e139-box"><h4>Merchants de cartão documentados</h4>${rows(j.card_merchants,'card')}</div><div class="e139-box"><h4>Contrapartes de conta documentadas</h4>${rows(j.cash_counterparties,'cash')}</div></div><div class="e139-note">Cobertura não é confundida com qualidade: ausência de merchant individual não altera o total econômico nem autoriza inferir estabelecimento.</div></div>`;

      const j=s.data;if(!j)return '';

      const hr=recent.map(x=>`<div class="e139-hrow"><b>${w.esc(x.origin_name)}</b><span>${w.num(x.year)}</span><span>${w.num(x.certified_months)} mês(es)</span><span>${w.num(x.aggregate_months)} mês(es)</span><strong>${w.brl(x.aggregate_amount)}</strong></div>`).join('');
