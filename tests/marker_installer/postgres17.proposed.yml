name: PostgreSQL 17 synthetic marker installer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/marker_installer/**'
jobs:
  synthetic-marker-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wealth_synthetic_marker_installer
          POSTGRES_USER: wealth_synthetic_marker_installer
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealth_synthetic_marker_installer -d wealth_synthetic_marker_installer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Check allowlisted synthetic artifacts
        run: python tests/marker_installer/validate_static.py
      - name: Execute complete baseline and real installer envelopes
        run: python tests/marker_installer/run_postgres17.py --allow-fresh-synthetic-postgres17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-marker-installer-postgres17
          path: tests/marker_installer/results/
          if-no-files-found: warn
