<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LTS Wealth · WIP35-v138 candidate</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f6f8}#shell{border:0;width:100%;height:100%;display:block}
#badge{position:fixed;right:10px;bottom:10px;z-index:999999;background:#102B50;color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 9px;font:700 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.14);pointer-events:none}
</style>
</head>
<body>
<iframe id="shell" src="./wip35-v137-candidate.html?v138-parent"></iframe>
<div id="badge">CANDIDATA v138 · v136 permanece fallback</div>
<script>
(function(){
  const outer=document.getElementById('shell');
  let appliedWindow=null;
  function applyToInner(){
    try{
      const od=outer.contentDocument;
      const inner=od&&od.getElementById('app');
      if(!inner)return;
      const w=inner.contentWindow,d=inner.contentDocument;
      if(!w||!d||appliedWindow===w||typeof w.render!=='function')return;
      if(!w.__v138RenderGuard){
        const baseRender=w.render;
        w.render=function(...args){if(!w.D)return;return baseRender.apply(this,args)};
        w.__v138RenderGuard=true;
      }
      appliedWindow=w;
      const css=d.createElement('style');
      css.id='wip35-v138-candidate-css';
      css.textContent=`
        .u138-review{padding:0!important;background:transparent!important;border:0!important;box-shadow:none!important}
        .u138-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 14px;background:#fff;border:1px solid var(--bd);border-radius:15px;margin-bottom:8px}
        .u138-head h3{margin:3px 0 0;font-size:14px}.u138-head p{margin:4px 0 0;font-size:9px;color:var(--mut)}
        .u138-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,300px);gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--bd);border-radius:14px;margin-top:7px;align-items:start}
        .u138-row b{font-size:11px}.u138-meta{font-size:8px;color:var(--mut);margin-top:3px;line-height:1.4}.u138-signals{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
        .u138-signal{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:999px;background:#eef2f6;color:#52677d;font-size:8px;font-weight:850}.u138-signal.good{background:#eaf6f0;color:var(--ok)}.u138-signal.warn{background:#fff5df;color:var(--at)}
        .u138-proof{margin-top:7px;font-size:8px;color:var(--mut);line-height:1.4}.u138-proof summary{cursor:pointer;font-weight:800;color:#607185}.u138-actions{display:grid;grid-template-columns:1fr;gap:6px}.u138-actions select,.u138-actions button{width:100%}
        .u138-nosug{font-size:8px;color:var(--mut);padding:7px 9px;border:1px dashed var(--bd);border-radius:9px;background:#fafbfd}
        .u138-summary{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.u138-summary span{font-size:8px;padding:4px 7px;border-radius:999px;background:#eef2f6;color:var(--mut);font-weight:800}
        @media(max-width:820px){.u138-row{grid-template-columns:1fr}.u138-head{flex-direction:column}.u138-actions{grid-template-columns:1fr}}
      `;
      d.head.appendChild(css);

      w.ex135Load=async function(k){
        const s=w.EX135||(w.EX135={});
        s.rangeKey=k||s.rangeKey||'ytd';
        const r=w.ex135Range(s.rangeKey);
        s.key=r.from+'|'+r.to;s.loading=true;s.error=null;
        if(w.V==='Despesas')w.render();
        try{
          const {data,error}=await w.S.rpc('lts_browser_expense_executive_v4',{p_from:r.from,p_to:r.to});
          if(error||!data)throw Error(error?.message||'Não foi possível carregar Despesas');
          s.data=data;
        }catch(e){s.error=String(e?.message||e)}
        finally{s.loading=false;if(w.V==='Despesas')w.render()}
      };

      function pct(x){const n=Number(x);return Number.isFinite(n)&&n>0?Math.round(n*100)+'%':null}
      function evidenceState(x){
        const basis=String(x?.suggestion_basis||''),support=Number(x?.suggestion_support||0),attempted=!!x?.enrichment_attempted,status=String(x?.enrichment_status||'');
        if(/hist|mesma_descricao|amount_pattern|recorr/i.test(basis)||support>1)return {label:'Histórico/evidência: encontrado',tone:'good'};
        if(attempted&&(status==='search_no_result'||status==='search_ambiguous'))return {label:'Pesquisa: sem conclusão',tone:'warn'};
        if(attempted)return {label:'Pesquisa realizada',tone:''};
        return {label:'Histórico/evidência: não encontrado',tone:''};
      }
      function suggestionLabel(x){
        if(!x?.suggested_category)return '';
        const p=pct(x.suggestion_confidence);
        return `Sugestão: ${w.esc(x.suggested_category)}${p?' · confiança '+p:''}`;
      }
      function compactProof(x){
        const bits=[];
        if(x.enrichment_evidence)bits.push(String(x.enrichment_evidence));
        if(x.amount_pattern_evidence)bits.push(String(x.amount_pattern_evidence));
        if(Number(x.suggestion_support)>0)bits.push(Number(x.suggestion_support)+' evidência(s) de suporte');
        if(x.taxonomy_ambiguous)bits.push('taxonomia ambígua: revisão obrigatória');
        if(x.enrichment_status==='payment_intermediary_needs_context')bits.push('intermediador identificado; compra final precisa de contexto');
        if(x.enrichment_status==='marketplace_needs_item_context')bits.push('marketplace identificado; item/finalidade precisa de contexto');
        if(x.enrichment_status==='person_name_needs_user_context')bits.push('nome de pessoa; somente contexto interno do LTS');
        return bits.filter(Boolean).join(' · ');
      }
      function optionsHtml(opts,sug){return `<option value="">Escolher categoria…</option>${opts.map(c=>`<option value="${w.esc(c)}" ${String(sug)===String(c)?'selected':''}>${w.esc(c)}</option>`).join('')}`}

      w.cardClassificationUpdates=function(){
        const q=w.D?.card_classification_review||{},items=q.items||[],opts=(q.category_options||[]).slice().sort((a,b)=>String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base'}));
        if(!Number(q.pending_groups||0))return '';
        const suggested=items.filter(x=>x.suggested_category).length;
        const safe=items.filter(x=>x.suggestion_safe).length;
        const rows=items.map(x=>{
          const sug=x.suggested_category||'',conf=pct(x.suggestion_confidence),ev=evidenceState(x),proof=compactProof(x),name=x.merchant_name||x.example_description||'Lançamento';
          return `<div class="cardclass-row u138-row"><div><b>${w.esc(name)}</b><div class="u138-meta">${x.merchant_name?'Original: '+w.esc(x.example_description)+' · ':''}${w.esc(x.card_name||'Cartão')} · ${w.fmt(x.due_date)} · ${w.num(x.occurrences)} ocorrência(s) · ${w.brl(x.total_value)}</div><div class="u138-signals">${sug?`<span class="u138-signal ${x.suggestion_safe?'good':'warn'}">${suggestionLabel(x)}</span>`:`<span class="u138-signal">Sem sugestão segura</span>`}<span class="u138-signal ${ev.tone}">${ev.label}</span>${conf&&!sug?`<span class="u138-signal">confiança ${conf}</span>`:''}</div>${proof?`<details class="u138-proof"><summary>Ver evidência</summary>${w.esc(proof)}</details>`:''}</div><div class="u138-actions"><select class="chip cardcat">${optionsHtml(opts,sug)}</select><button type="button" class="chip newcatbtn">+ Nova categoria</button><button class="chip cardclass-save" data-key="${w.esc(x.description_key)}">${sug?'Confirmar / alterar':'Salvar classificação'}</button>${!sug?`<div class="u138-nosug">Sem categoria sugerida com evidência suficiente. As ${opts.length} opções continuam disponíveis para sua decisão.</div>`:''}</div></div>`;
        }).join('');
        return `<div id="cardClassReview" class="section u138-review"><div class="u138-head"><div><span class="w104-eye">Classificação de cartões</span><h3>${w.num(q.pending_groups)} grupos ainda precisam de decisão</h3><p>Sugestão só aparece quando existe evidência. O seletor fica disponível em todos os itens.</p><div class="u138-summary"><span>${suggested} com sugestão</span><span>${items.length-suggested} sem sugestão segura</span><span>${safe} auto-classificáveis</span><span>${opts.length} categorias disponíveis</span></div></div><span class="status at">revisão guiada</span></div>${rows}</div>`;
      };

      w.expenseClassificationUpdates=function(){
        const q=w.D?.semantic_review||{},items=q.items||[],opts=(w.D?.card_classification_review?.category_options||[]).slice().sort((a,b)=>String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base'}));
        if(!items.length)return '';
        const rows=items.map(x=>{
          const sug=x.suggested_category||'',conf=pct(x.suggestion_confidence),basis=String(x.suggestion_basis||''),history= basis==='mesma_descricao_com_categoria_historica_unica'||x.historical_category?{label:'Histórico: encontrado',tone:'good'}:{label:'Histórico: não encontrado',tone:''},proof=[x.amount_pattern_evidence,basis&&basis!=='sem_regra_segura'?basis:null,Number(x.suggestion_support)>0?Number(x.suggestion_support)+' evidência(s) de suporte':null].filter(Boolean).join(' · ');
          return `<div class="cardclass-row u138-row"><div><b>${w.esc(x.example_description)}</b><div class="u138-meta">${w.num(x.occurrences)} ocorrência(s) · ${w.brl(x.total_outflow)} · ${w.fmt(x.first_seen)} → ${w.fmt(x.last_seen)}</div><div class="u138-signals">${sug?`<span class="u138-signal warn">Sugestão: ${w.esc(sug)}${conf?' · confiança '+conf:''}</span>`:`<span class="u138-signal">Sem sugestão segura</span>`}<span class="u138-signal ${history.tone}">${history.label}</span></div>${proof?`<details class="u138-proof"><summary>Ver evidência</summary>${w.esc(proof)}</details>`:''}</div><div class="u138-actions"><select class="chip cardcat">${optionsHtml(opts,sug)}</select><button type="button" class="chip newcatbtn">+ Nova categoria</button><button class="chip cardclass-save" data-key="${w.esc(x.description_key)}">${sug?'Confirmar / alterar':'Salvar classificação'}</button>${!sug?`<div class="u138-nosug">Nenhuma sugestão foi criada sem evidência. Escolha uma das ${opts.length} categorias se você reconhecer o lançamento.</div>`:''}</div></div>`;
        }).join('');
        return `<div id="expenseClassReview" class="section u138-review"><div class="u138-head"><div><span class="w104-eye">Classificação de extrato</span><h3>${items.length} grupos realmente sem categoria</h3><p>Confiança e histórico ficam na primeira leitura; detalhes metodológicos ficam recolhidos.</p></div><span class="status at">revisão necessária</span></div>${rows}</div>`;
      };

      w.LTS_CANDIDATE='wip35-v138-performance-and-classification';
      if(w.V==='Despesas'){
        const s=w.EX135||(w.EX135={});s.key=null;s.data=null;s.error=null;
      }
      w.render();
    }catch(e){console.error('v138 candidate injection failed',e)}
  }
  function wire(){
    try{
      const od=outer.contentDocument,inner=od&&od.getElementById('app');
      if(inner){inner.addEventListener('load',()=>setTimeout(applyToInner,80));setTimeout(applyToInner,120)}
    }catch(e){}
  }
  outer.addEventListener('load',()=>setTimeout(wire,60));
  setTimeout(wire,500);
})();
</script>
<script src="./wip35-v138-cockpits.js"></script>
</body>
</html>
