<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LTS Wealth · WIP35-v144 candidate</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f6f8}#shell{border:0;width:100%;height:100%;display:block}#badge{position:fixed;right:10px;bottom:10px;z-index:999999;background:#102B50;color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 9px;font:700 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.14);pointer-events:none}
</style>
</head>
<body>
<iframe id="shell" src="./wip35-v142-candidate.html?v144-parent"></iframe>
<div id="badge">CANDIDATA v144 · v143 permanece homologação</div>
<!-- v144 reuses the exact proven v143 runtime layers, then hosts the Updates restoration in the v138 ownership context directly above v137/#app. -->
<script src="./wip35-v143-life-real.js?v143-life-real-v1"></script>
<script src="./wip35-v143-feedback-polish.js?v143-feedback-polish-v2"></script>
<script src="./wip35-v143-ownership.js?v143-ownership-v1"></script>
<script>
(function(){
  const root=document.getElementById('shell');
  const MARK='v138-hosted-updates-v1';
  let loading=false,done=false;
  function inject(){
    if(done||loading||!root)return;
    try{
      let hostDoc=document,f=root;
      for(let i=0;i<12&&f;i++){
        const childDoc=f.contentDocument,childWin=f.contentWindow;
        if(!childDoc||!childWin)return;
        const app=childDoc.getElementById('app');
        if(app){
          if(hostDoc.getElementById('wip35-v144-updates-hosted')){done=true;window.__LTS_V144_BOOTSTRAP=MARK;return;}
          const s=hostDoc.createElement('script');
          s.id='wip35-v144-updates-hosted';
          s.src='./wip35-v144-updates-classification.js?v144-updates-classification-v4';
          s.dataset.v144Host='v138';
          loading=true;
          s.onload=()=>{loading=false;done=true;window.__LTS_V144_BOOTSTRAP=MARK;};
          s.onerror=()=>{loading=false;try{s.remove()}catch(e){}};
          (hostDoc.head||hostDoc.documentElement).appendChild(s);
          return;
        }
        hostDoc=childDoc;
        f=childDoc.getElementById('shell');
      }
    }catch(e){}
  }
  root?.addEventListener('load',()=>{setTimeout(inject,120);setTimeout(inject,420);setTimeout(inject,900)});
  setInterval(inject,220);
  setTimeout(inject,300);
})();
window.__LTS_TOP_CANDIDATE_VERSION='v144';
</script>
</body>
</html>
