name: V182 homologation follow-up
on:
  pull_request:
    paths:
      - 'wip35-v182-candidate.html'
      - 'lts-v182-homologation-feedback.js'
      - '.github/workflows/v182-homologation.yml'
      - 'PROJECT_MASTER_BACKLOG.md'
permissions:
  contents: read
jobs:
  candidate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated candidate and protected root
        run: |
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const candidate=fs.readFileSync('wip35-v182-candidate.html','utf8');
          const runtime=fs.readFileSync('lts-v182-homologation-feedback.js','utf8');
          assert.match(candidate,/V182 · Homologação/);
          assert.match(candidate,/lts-v181-regression-closure\.js\?v=20260922-v181c/);
          assert.match(candidate,/lts-v182-homologation-feedback\.js\?v=20260922-v182a/);
          assert.doesNotThrow(()=>new Function(runtime));
          assert.match(runtime,/monthly_totals/);
          assert.match(runtime,/expense_unclassified_card_coverage/);
          assert.doesNotMatch(runtime,/Bearer\s|access_token|refresh_token/);
          assert.equal(crypto.createHash('sha256').update(fs.readFileSync('index.html')).digest('hex'),'cca36731258680cc15a73fbad61c90ddf803358b741fd3ef58fefe5419eb688b');
          const manifest=JSON.parse(fs.readFileSync('homologacao-current.json','utf8'));
          assert.equal(manifest.version,'wip35-v181');
          JS
