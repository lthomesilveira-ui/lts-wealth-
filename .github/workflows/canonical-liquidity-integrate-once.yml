name: Canonical liquidity integrate once

on:
  push:
    branches: [canonical-app-v1]
    paths:
      - .github/workflows/canonical-liquidity-integrate-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-app-v1
          fetch-depth: 0
      - name: Re-fetch continuity state and verify protected baseline
        run: |
          git fetch origin main canonical-app-v1
          test "$(git hash-object canonical-app.html)" = "7029b5b710cab2bbb18e3bdf1a9b89a4c1e8170f"
          test "$(git hash-object index.html)" = "a130eafe5f7ee5b7f60a95b5ff988669d0c401d9"
          grep -q "Master Backlog" PROJECT_MASTER_BACKLOG.md
          grep -q "Next Homologation Gate" NEXT_HOMOLOGATION_GATE.md
          grep -q "Continuity Handoff" LTS_WEALTH_CONTINUITY_HANDOFF.md
          test "$(git hash-object backups/CANONICAL_APP_V1_LIQUIDITY_USER_SURFACE_REFRESH_V5_CHECKPOINT_2026-09-06.md)" = "fb51dd4db389050ec88ca2ebd91fef5c51218cf3"
          test -s canonical-liquidity.js
      - name: Wire liquidity module and strengthen canonical gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('canonical-app.html').read_text()
          tag='<script src="canonical-liquidity.js?v=20260906-1"></script>'
          if tag not in html:
              assert html.count('</body>') == 1
              html=html.replace('</body>',tag+'\n</body>')
          Path('canonical-app.html').write_text(html)

          p=Path('.github/workflows/canonical-app.yml')
          s=p.read_text()
          if '      - canonical-liquidity.js\n' not in s:
              anchor='      - canonical-app.html\n'
              assert anchor in s
              s=s.replace(anchor,anchor+'      - canonical-liquidity.js\n',1)
          if 'node --check canonical-liquidity.js' not in s:
              anchor='          node --check /tmp/canonical-script.js\n'
              assert anchor in s
              s=s.replace(anchor,anchor+'          node --check canonical-liquidity.js\n',1)
          marker="            if(await page.getByText('Documentos',{exact:true}).count()<1)throw new Error(name+': documents area missing');\n"
          if 'liquidity movement card missing' not in s:
              assert marker in s
              extra="""            await page.waitForSelector('#liquidityMovementCard');
            if(await page.locator('#liquidityMovementCard').count()!==1)throw new Error(name+': liquidity movement card missing');
            await page.locator('#liqType').selectOption('application');
            await page.locator('#liqAccount').selectOption('fixture-itau');
            await page.locator('#liqAsset').selectOption('fixture-cofrinho');
            await page.locator('#liqAmount').fill('5 mil');
            await page.locator('#liqPreviewBtn').click();
            await page.waitForSelector('#liqPreview');
            if(!(await page.locator('#liqPreview').textContent()).includes('R$ 0,00'))throw new Error(name+': liquidity neutral preview missing');
            if(await page.locator('#liqApply').count()!==0)throw new Error(name+': fixture liquidity writer unexpectedly enabled');
"""
              s=s.replace(marker,marker+extra,1)
          p.write_text(s)
          PY
          node --check canonical-liquidity.js
          git diff --check
          grep -q 'canonical-liquidity.js?v=20260906-1' canonical-app.html
          grep -q 'liquidity movement card missing' .github/workflows/canonical-app.yml
      - name: Commit guarded integration
        run: |
          rm .github/workflows/canonical-liquidity-integrate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical-app.html canonical-liquidity.js .github/workflows/canonical-app.yml .github/workflows/canonical-liquidity-integrate-once.yml
          git diff --cached --check
          git commit -m "Wire canonical liquidity movement UI"
          git push origin HEAD:canonical-app-v1
