name: V365 homologation flows and source presentation
on:
  pull_request:
    paths: ['releases/v365/**','.github/scripts/*v365*','.github/workflows/v365.yml','docs/V365_HOMOLOGATION.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v365_release_contract.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v365-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v365_browser.cjs
      - run: LTS_RELEASE=v365 node .github/scripts/lts_v342_month_rollover_contract.cjs
      - run: LTS_RELEASE=v365 node .github/scripts/lts_v342_month_rollover_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v365-homologation-browser
          path: qa/v365/
