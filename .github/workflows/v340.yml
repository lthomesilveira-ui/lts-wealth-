name: V340 pending income query work
on:
  pull_request:
    paths: ['backend/patches/v340/**','backend/qa/*v340*','backend/qa/fixtures/v340*','.github/workflows/v340.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-income-review:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v340_ci_sql.py > /tmp/lts-v340.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/lts-v340.sql > /tmp/lts-v340-result.log
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipts=[json.loads(s) for s in Path('/tmp/lts-v340-result.log').read_text().splitlines() if s.startswith('{')]
          assert len(receipts)==1, 'Native receipt missing'
          result=receipts[0]
          assert result['pass'] and result['version']==340
          assert result['queue_cases']==10 and result['rejection_cases']==13 and result['pending_rows']==11
          assert result['definition_rejection_cases']==3
          assert all(value is True for key,value in result.items() if key not in ['version','queue_cases','rejection_cases','pending_rows','definition_rejection_cases'])
          print(json.dumps(result))
          PY
