name: LTS candidate smoke
on:
  push:
    branches: [main, v142-button-contract-audit]
    paths:
      - 'index.html'
      - 'homologacao.html'
      - 'homologacao-current.json'
      - 'wip35-v137-candidate.html'
      - 'wip35-v138-candidate.html'
      - 'wip35-v138-cockpits.js'
      - 'wip35-v139-candidate.html'
      - 'wip35-v140-candidate.html'
      - 'wip35-v141-candidate.html'
      - 'wip35-v142-candidate.html'
      - 'wip35-v142-ux.js'
      - 'wip35-v142-planning-bridge-v2.js'
      - 'wip35-v142-dashboard-cockpit.js'
      - 'wip35-v142-liquidity-ui-v2.js'
      - 'wip35-v142-final-polish.js'
      - '.github/scripts/lts_candidate_smoke.py'
      - '.github/scripts/lts_candidate_browser_smoke.js'
      - '.github/scripts/lts_button_contract_audit.js'
      - '.github/workflows/candidate-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fixed homologation entrypoint
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('.')
          manifest = json.loads((root / 'homologacao-current.json').read_text(encoding='utf-8'))
          target = str(manifest.get('path') or '')
          assert re.fullmatch(r'wip35-v\d+-candidate\.html', target), target
          assert (root / target).exists(), target
          bootstrap = (root / 'homologacao.html').read_text(encoding='utf-8')
          assert 'homologacao-current.json' in bootstrap
          assert "cache:'no-store'" in bootstrap
          assert 'Date.now()' in bootstrap
          print('fixed_homologation_entrypoint=PASS target=' + target)
          PY
      - name: Parse and validate isolated candidate
        run: python .github/scripts/lts_candidate_smoke.py
      - name: Validate audited Dashboard cockpit layer
        run: |
          node --check wip35-v142-dashboard-cockpit.js
          python - <<'PY'
          from pathlib import Path
          html=Path('wip35-v142-candidate.html').read_text(encoding='utf-8')
          js=Path('wip35-v142-dashboard-cockpit.js').read_text(encoding='utf-8')
          required_html=['wip35-v142-dashboard-cockpit.js?v142-dashboard-cockpit-v1']
          required_js=['Sua vida financeira, em uma tela.','Disponível realizável até D+3','Ponto de gestão auditado','Plano de cobertura · FGTS D+30','lts_browser_dashboard_cockpit_v1','LTS_DASHBOARD_COCKPIT','v142-claude-cockpit-audited',"['Dashboard','Atualizações','Fluxo Diário','Despesas','Cartões','Patrimônio','Planejamento']"]
          missing=[x for x in required_html if x not in html]+[x for x in required_js if x not in js]
          assert not missing, 'dashboard markers missing: '+repr(missing)
          print('dashboard_cockpit_static=PASS')
          PY
      - name: Validate reviewed liquidity UI layer
        run: |
          node --check wip35-v142-liquidity-ui-v2.js
          python - <<'PY'
          from pathlib import Path
          html=Path('wip35-v142-candidate.html').read_text(encoding='utf-8')
          js=Path('wip35-v142-liquidity-ui-v2.js').read_text(encoding='utf-8')
          required_html=['wip35-v142-liquidity-ui-v2.js?v142-liquidity-ui-v2']
          required_js=['LTS_V142_LIQUIDITY_UI','reviewed-preview-confirm-v2','__LTS_V142_PARSE_AMOUNT_SELFTEST','fiveMil','decimalPtBr','lts_browser_liquidity_movement_options_v1','lts_browser_preview_liquidity_movement_v1','lts_browser_apply_liquidity_movement_v1','Resgate e aplicação movem valor entre banco e ativo. Não são renda nem gasto.','Nada é gravado enquanto você estiver nesta etapa.','Este clique é a aprovação explícita que autoriza a gravação.','Fluxo, Planejamento, Dashboard, Patrimônio e cache futuro foram atualizados']
          forbidden=['insert into','delete from','update public.','.upsert(']
          missing=[x for x in required_html if x not in html]+[x for x in required_js if x not in js]
          leaked=[x for x in forbidden if x.lower() in js.lower()]
          assert not missing, 'liquidity markers missing: '+repr(missing)
          assert not leaked, 'direct write leaked into browser layer: '+repr(leaked)
          print('liquidity_ui_static=PASS')
          PY
      - name: Validate action-first final polish layer
        run: |
          node --check wip35-v142-final-polish.js
          python - <<'PY'
          from pathlib import Path
          html=Path('wip35-v142-candidate.html').read_text(encoding='utf-8')
          js=Path('wip35-v142-final-polish.js').read_text(encoding='utf-8')
          required_html=['wip35-v142-final-polish.js?v142-final-polish-v1']
          required_js=['LTS_V142_FINAL_POLISH','action-first-round3-v1','Resolver agora','Atualizações necessárias','Classificações para revisar','Documentos com decisão','wip35-v142-final-polish-css','stable-nonconfigurable-v1']
          missing=[x for x in required_html if x not in html]+[x for x in required_js if x not in js]
          assert not missing, 'final polish markers missing: '+repr(missing)
          print('final_polish_static=PASS')
          PY
      - name: Audit button wiring contracts
        run: node .github/scripts/lts_button_contract_audit.js
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run local candidate browser smoke
        run: |
          python3 -m http.server 8765 >/tmp/lts-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node .github/scripts/lts_candidate_browser_smoke.js
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wip35-v142-candidate-smoke
          path: |
            candidate-smoke-result.txt
            candidate-browser-smoke-result.json
            button-contract-audit-result.json
          if-no-files-found: error
