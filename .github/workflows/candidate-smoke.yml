name: LTS candidate smoke
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'homologacao.html'
      - 'homologacao-current.json'
      - 'wip35-v137-candidate.html'
      - 'wip35-v138-candidate.html'
      - 'wip35-v138-cockpits.js'
      - 'wip35-v139-candidate.html'
      - 'wip35-v140-candidate.html'
      - 'wip35-v141-candidate.html'
      - 'wip35-v142-candidate.html'
      - '.github/scripts/lts_candidate_smoke.py'
      - '.github/scripts/lts_candidate_browser_smoke.js'
      - '.github/workflows/candidate-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fixed homologation entrypoint
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('.')
          manifest = json.loads((root / 'homologacao-current.json').read_text(encoding='utf-8'))
          target = str(manifest.get('path') or '')
          assert re.fullmatch(r'wip35-v\d+-candidate\.html', target), target
          assert (root / target).exists(), target
          bootstrap = (root / 'homologacao.html').read_text(encoding='utf-8')
          assert 'homologacao-current.json' in bootstrap
          assert "cache:'no-store'" in bootstrap
          assert 'Date.now()' in bootstrap
          print('fixed_homologation_entrypoint=PASS target=' + target)
          PY
      - name: Parse and validate isolated candidate
        run: python .github/scripts/lts_candidate_smoke.py
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run local candidate browser smoke
        run: |
          python3 -m http.server 8765 >/tmp/lts-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node .github/scripts/lts_candidate_browser_smoke.js
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wip35-v142-candidate-smoke
          path: |
            candidate-smoke-result.txt
            candidate-browser-smoke-result.json
          if-no-files-found: error
