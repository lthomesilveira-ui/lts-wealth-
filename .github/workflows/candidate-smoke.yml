name: LTS candidate smoke
on:
  push:
    branches: [main, canonical-app-v1, canonical-v157plus-product-recovery, v143-life-real-feedback]
    paths:
      - 'index.html'
      - 'homologacao.html'
      - 'homologacao-current.json'
      - 'canonical-app.html'
      - 'canonical-dashboard-fidelity.css'
      - 'canonical-liquidity.js'
      - 'canonical-liquidity-core.js'
      - 'canonical-flow-v157.js'
      - 'canonical-product-v157.js'
      - 'canonical-presentation-v157.js'
      - 'canonical-capabilities-v161.js'
      - 'canonical-reviewed-input-v112.js'
      - '.github/workflows/canonical-app.yml'
      - '.github/scripts/lts_canonical_v157plus_browser_gate.js'
      - 'wip35-v137-candidate.html'
      - 'wip35-v138-candidate.html'
      - 'wip35-v138-cockpits.js'
      - 'wip35-v139-candidate.html'
      - 'wip35-v140-candidate.html'
      - 'wip35-v141-candidate.html'
      - 'wip35-v142-candidate.html'
      - 'wip35-v142-ux.js'
      - 'wip35-v142-planning-bridge-v2.js'
      - 'wip35-v142-dashboard-cockpit.js'
      - 'wip35-v142-liquidity-ui-v2.js'
      - 'wip35-v142-final-polish.js'
      - 'wip35-v143-candidate.html'
      - 'wip35-v143-life-real.js'
      - 'wip35-v143-feedback-polish.js'
      - 'wip35-v143-ownership.js'
      - '.github/scripts/lts_candidate_smoke.py'
      - '.github/scripts/lts_candidate_browser_smoke.js'
      - '.github/scripts/lts_v143_browser_smoke.js'
      - '.github/scripts/lts_button_contract_audit.js'
      - '.github/workflows/candidate-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: candidate
        name: Validate fixed homologation entrypoint
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path('.')
          manifest = json.loads((root / 'homologacao-current.json').read_text(encoding='utf-8'))
          target = str(manifest.get('path') or '')
          version = str(manifest.get('version') or '')
          if target == 'canonical-app.html':
              assert version == 'canonical-v1', (version, target)
              mode = 'canonical'
          else:
              assert re.fullmatch(r'wip35-v\d+-candidate\.html', target), target
              mode = 'legacy'
          assert (root / target).exists(), target
          bootstrap = (root / 'homologacao.html').read_text(encoding='utf-8')
          assert 'homologacao-current.json' in bootstrap
          assert "cache:'no-store'" in bootstrap
          assert 'Date.now()' in bootstrap
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'mode={mode}\n')
              fh.write(f'target={target}\n')
          print(f'fixed_homologation_entrypoint=PASS mode={mode} version={version} target={target}')
          PY
      - name: Validate canonical product contract
        if: steps.candidate.outputs.mode == 'canonical'
        run: |
          node --check canonical-liquidity.js
          node --check canonical-liquidity-core.js
          node --check canonical-flow-v157.js
          node --check canonical-product-v157.js
          node --check canonical-presentation-v157.js
          node --check canonical-capabilities-v161.js
          node --check canonical-reviewed-input-v112.js
          node --check .github/scripts/lts_canonical_v157plus_browser_gate.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('canonical-app.html').read_text(encoding='utf-8')
          liq=Path('canonical-liquidity.js').read_text(encoding='utf-8')
          core=Path('canonical-liquidity-core.js').read_text(encoding='utf-8')
          flow=Path('canonical-flow-v157.js').read_text(encoding='utf-8')
          product=Path('canonical-product-v157.js').read_text(encoding='utf-8')
          presentation=Path('canonical-presentation-v157.js').read_text(encoding='utf-8')
          capabilities=Path('canonical-capabilities-v161.js').read_text(encoding='utf-8')
          reviewed_input=Path('canonical-reviewed-input-v112.js').read_text(encoding='utf-8')
          css=Path('canonical-dashboard-fidelity.css').read_text(encoding='utf-8')
          gate=Path('.github/scripts/lts_canonical_v157plus_browser_gate.js').read_text(encoding='utf-8')
          required_html=[
            'canonical-dashboard-fidelity.css?v=20260909-ux22',
            'canonical-liquidity.js?v=20260909-ux22',
            'single-owner-history-nature-context-v1','Quanto você gasta — e para quem é cada gasto.',
            'reference-layered-liquidity-commitments-v3','approved-1312x1199-single-screen-v1','fact-before-asof-projection-after-asof-v1','current-base-scheduled-rsu-restricted-fgts-v1','layered-fact-projection-v2','product-commitments-plus-card-due','v151-first-negative-management-separation-v1','Primeiro caixa negativo','Ponto de gestão','canonical-route-session-continuity-v1','classification-first-guided-document-intake-v1','lts_browser_register_document_v2','v149-evidence-review-readonly-canonical-v1','lts_browser_document_review_queue_v1','updatesOtherActions','data-dashboard-reload','data-mg-shortcut',
            'Dashboard','Fluxo Diário','Despesas','Patrimônio','Cartões','Atualizações'
          ]
          required_css=['#dashboard-view .grid-main','#dashboard-view .rank-row.clickable','#dashboard-view .series.conditional','#dashboard-view .series.restricted','#dashboard-view .liquidity-layer-values','#planning-panel .planning-decision','#planning-panel .planning-negative-marker']
          required_loader=['LTS v1.22','UPDATES_CONTRACT','DOCUMENT_REVIEW_CONTRACT','DASHBOARD_DENSITY_CONTRACT','PLANNING_DECISION_CONTRACT','DASHBOARD_VISUAL_CONTRACT','executive-cockpit-readable-density-v1','user-facing-product-language-v1','safe-errors-accessible-controls-readable-mobile-v1','evidence-backed-executive-report-v1','canonical-liquidity-core.js?v=20260908-ux19','canonical-flow-v157.js?v=20260908-flow20','canonical-product-v157.js','canonical-presentation-v157.js','canonical-capabilities-v161.js?v=20260909-reports21','canonical-reviewed-input-v112.js?v=20260908-ux19']
          required_flow=['lts_browser_flow_v8','lts_browser_card_settlement_detail_v2','LTS v1.20','v150-validated-flow-plus-v157-liquidity-v1','historical-opening-from-close-and-net-v1','historical-closed-date-label-close-only-v1','projection-edit-postpone-duplicate-split-cancel-v1','today-marker-without-row-band-v1','future-through-2029-plus-d30-v1','Histórico / período','Histórico / movimentos','Editar','Postergar','Duplicar','Dividir / substituir','inline-card-settlement-v150','RSUs futuras','Cash Awards futuros','lts_browser_flow_event_editor_v1','lts_browser_flow_mutate_v1']
          required_product=['Dinheiro em contas','Contas + curto prazo','RSUs vested','FGTS','Despesas (mês)','Evolução da Liquidez','Quanto você gastou — e como isso evoluiu.','Mês a mês','Ano a ano','Cobertura do histórico','Quanto você tem, quanto deve e quanto é seu.','Conferência de fatura, não análise de gasto.']
          required_presentation=['presentation-polish-v2','safe-errors-accessible-controls-readable-mobile-v1','__LTS_V157_PRESENTATION_STATUS','__LTS_V157_POLISH_STATUS']
          required_capabilities=['LTS v1.21','__LTS_CANONICAL_CAPABILITIES_STATUS','session-persisted-management-pane-v1','evidence-backed-executive-report-v1','Relatório executivo','Hoje e curto prazo','Caixa projetado · quando agir','Evolução das despesas','Qualidade, controle e rastreabilidade','Planejamento','Entradas & compromissos','Recorrências','Simulações','Conciliação','Relatórios','Backup & restauração','Configurações & integrações','Financiamentos','Documentos']
          required_reviewed_input=['LTS v1.19','review-before-explicit-apply-v1','Lançamento por texto','lts_browser_apply_reviewed_input_v1','Nada foi gravado.','requires_explicit_confirmation']
          required_gate=['lts-canonical-definition-of-done-receipt-v1','route_session_continuity','document_intake','document_review','AUTOMATED_GATE_PASS_REAL_E2E_OPEN']
          forbidden_html=['<iframe','document.write','MutationObserver','setInterval(']
          forbidden_modules=['MutationObserver','setInterval(']
          missing=([x for x in required_html if x not in html]+[x for x in required_css if x not in css]
                   +[x for x in required_loader if x not in liq]+[x for x in required_flow if x not in flow]
                   +[x for x in required_product if x not in product]+[x for x in required_presentation if x not in presentation]
                   +[x for x in required_capabilities if x not in capabilities]+[x for x in required_reviewed_input if x not in reviewed_input]+[x for x in required_gate if x not in gate])
          leaked=[x for x in forbidden_html if x in html]+[x for module in [liq,core,flow,product,presentation,capabilities,reviewed_input] for x in forbidden_modules if x in module]
          assert not missing, 'canonical markers missing: '+repr(missing)
          assert not leaked, 'forbidden canonical markers: '+repr(leaked)
          assert 'canonical-flow-v150.js' not in liq
          assert "const ROUTES=['Patrimônio','Cartões']" in product
          for rpc in ['lts_browser_product_v1','lts_browser_dashboard_cockpit_v1','lts_browser_transactions_v1','lts_browser_expense_context_lens_v1','lts_browser_wealth_detail_v1','lts_browser_card_history_coverage_v1','lts_browser_document_lifecycle_v1','lts_browser_semantic_feedback_v1']:
              assert rpc in html, rpc
          for rpc in ['lts_browser_liquidity_movement_options_v1','lts_browser_preview_liquidity_movement_v1','lts_browser_apply_liquidity_movement_v1']:
              assert rpc in core, rpc
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          Path('/tmp/canonical-script.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('canonical_product_static=PASS')
          PY
          node --check /tmp/canonical-script.js
      - name: Parse and validate isolated v142 fallback candidate
        if: steps.candidate.outputs.mode == 'legacy'
        run: python .github/scripts/lts_candidate_smoke.py
      - name: Validate audited Dashboard cockpit layer
        if: steps.candidate.outputs.mode == 'legacy'
        run: |
          node --check wip35-v142-dashboard-cockpit.js
          python - <<'PY'
          from pathlib import Path
          html=Path('wip35-v142-candidate.html').read_text(encoding='utf-8')
          js=Path('wip35-v142-dashboard-cockpit.js').read_text(encoding='utf-8')
          required_html=['wip35-v142-dashboard-cockpit.js?v142-dashboard-cockpit-v1']
          required_js=['Sua vida financeira, em uma tela.','Disponível realizável até D+3','Ponto de gestão auditado','Plano de cobertura · FGTS D+30','lts_browser_dashboard_cockpit_v1','LTS_DASHBOARD_COCKPIT','v142-claude-cockpit-audited',"['Dashboard','Atualizações','Fluxo Diário','Despesas','Cartões','Patrimônio','Planejamento']"]
          missing=[x for x in required_html if x not in html]+[x for x in required_js if x not in js]
          assert not missing, 'dashboard markers missing: '+repr(missing)
          print('dashboard_cockpit_static=PASS')
          PY
      - name: Validate reviewed liquidity UI layer
        if: steps.candidate.outputs.mode == 'legacy'
        run: |
          node --check wip35-v142-liquidity-ui-v2.js
          python - <<'PY'
          from pathlib import Path
          html=Path('wip35-v142-candidate.html').read_text(encoding='utf-8')
          js=Path('wip35-v142-liquidity-ui-v2.js').read_text(encoding='utf-8')
          required_html=['wip35-v142-liquidity-ui-v2.js?v142-liquidity-ui-v2']
          required_js=['LTS_V142_LIQUIDITY_UI','reviewed-preview-confirm-v2','__LTS_V142_PARSE_AMOUNT_SELFTEST','fiveMil','decimalPtBr','lts_browser_liquidity_movement_options_v1','lts_browser_preview_liquidity_movement_v1','lts_browser_apply_liquidity_movement_v1','Resgate e aplicação movem valor entre banco e ativo. Não são renda nem gasto.','Nada é gravado enquanto você estiver nesta etapa.','Este clique é a aprovação explícita que autoriza a gravação.','Fluxo, Planejamento, Dashboard, Patrimônio e cache futuro foram atualizados']
          forbidden=['insert into','delete from','update public.','.upsert(']
          missing=[x for x in required_html if x not in html]+[x for x in required_js if x not in js]
          leaked=[x for x in forbidden if x.lower() in js.lower()]
          assert not missing, 'liquidity markers missing: '+repr(missing)
          assert not leaked, 'direct write leaked into browser layer: '+repr(leaked)
          print('liquidity_ui_static=PASS')
          PY
      - name: Validate action-first final polish layer
        if: steps.candidate.outputs.mode == 'legacy'
        run: |
          node --check wip35-v142-final-polish.js
          python - <<'PY'
          from pathlib import Path
          html=Path('wip35-v142-candidate.html').read_text(encoding='utf-8')
          js=Path('wip35-v142-final-polish.js').read_text(encoding='utf-8')
          required_html=['wip35-v142-final-polish.js?v142-final-polish-v1']
          required_js=['LTS_V142_FINAL_POLISH','action-first-round3-v1','Resolver agora','Atualizações necessárias','Classificações para revisar','Documentos com decisão','wip35-v142-final-polish-css','stable-nonconfigurable-v2']
          missing=[x for x in required_html if x not in html]+[x for x in required_js if x not in js]
          assert not missing, 'final polish markers missing: '+repr(missing)
          print('final_polish_static=PASS')
          PY
      - name: Validate v143 real-life feedback layer
        if: steps.candidate.outputs.mode == 'legacy'
        run: |
          node --check wip35-v143-life-real.js
          node --check wip35-v143-feedback-polish.js
          node --check wip35-v143-ownership.js
          node --check .github/scripts/lts_v143_browser_smoke.js
          python - <<'PY'
          from pathlib import Path
          html=Path('wip35-v143-candidate.html').read_text(encoding='utf-8')
          js=Path('wip35-v143-life-real.js').read_text(encoding='utf-8')
          fb=Path('wip35-v143-feedback-polish.js').read_text(encoding='utf-8')
          own=Path('wip35-v143-ownership.js').read_text(encoding='utf-8')
          required_html=['wip35-v142-candidate.html?v143-parent','wip35-v143-life-real.js?v143-life-real-v1','wip35-v143-feedback-polish.js?v143-feedback-polish-v2','wip35-v143-ownership.js?v143-ownership-v1']
          required_js=['LTS_V143_LIFE_REAL','Disponível se também acionar o FGTS','Sem uma ação de liquidez','Liquidez detalhada','lts_browser_expense_drilldown_v1','Cartão × mês','Consolidado pela classificação do LTS','lts_browser_wealth_detail_v1','Simular antecipação','lts_browser_vesting_scenario_v1','CIPÓ 396 · histórico completo','Volvo XC40 · financiamento Bradesco']
          required_fb=['classification-evidence-recurrence-generic-decision-cockpit-v2','Sua vida financeira, em uma tela.','Fatura vencida / a confirmar','Sem uma ação de liquidez, o caixa cruza zero','Ponto de gestão de liquidez, não falta patrimonial comprovada.','procura genericamente séries','mediana é evidência, não valor projetado']
          required_own=['redirect-inherited-owners-v2','__lts_v142_dashboard_fn','__lts_v142_dashboard_nav','__lts_v142_planning_fn','__LTS_V142_PLANNING_RENDERER','__lts_v142_wealth_fn']
          missing=[x for x in required_html if x not in html]+[x for x in required_js if x not in js]+[x for x in required_fb if x not in fb]+[x for x in required_own if x not in own]
          assert not missing, 'v143 markers missing: '+repr(missing)
          hardcoded="['Condomínio - O Parque','IPTU - O Parque','Benjamin - Educação','Adiantamento Quinzenal']"
          assert hardcoded not in fb, 'recurrence UI still hardcodes example series'
          assert 'insert into' not in js.lower() and 'delete from' not in js.lower() and 'update public.' not in js.lower(), 'browser layer contains direct SQL write'
          print('v143_life_real_static=PASS')
          PY
      - name: Audit inherited button wiring contracts
        if: steps.candidate.outputs.mode == 'legacy'
        run: node .github/scripts/lts_button_contract_audit.js
      - name: Install headless browser
        if: steps.candidate.outputs.mode == 'legacy'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run local v142 fallback browser smoke
        if: steps.candidate.outputs.mode == 'legacy'
        run: |
          python3 -m http.server 8765 >/tmp/lts-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node .github/scripts/lts_candidate_browser_smoke.js
      - name: Run v143 runtime and navigation smoke
        if: steps.candidate.outputs.mode == 'legacy'
        run: |
          python3 -m http.server 8766 >/tmp/lts-http-v143.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          sed 's/8765/8766/g' .github/scripts/lts_v143_browser_smoke.js >/tmp/lts_v143_browser_smoke.js
          NODE_PATH="$PWD/node_modules" node /tmp/lts_v143_browser_smoke.js
      - name: Upload smoke evidence
        if: always() && steps.candidate.outputs.mode == 'legacy'
        uses: actions/upload-artifact@v4
        with:
          name: wip35-v143-candidate-smoke
          path: |
            candidate-smoke-result.txt
            candidate-browser-smoke-result.json
            v143-browser-smoke-result.json
            button-contract-audit-result.json
          if-no-files-found: error
