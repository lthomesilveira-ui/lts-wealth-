name: LTS candidate smoke
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'wip35-v137-candidate.html'
      - 'wip35-v138-candidate.html'
      - 'wip35-v138-cockpits.js'
      - 'wip35-v139-candidate.html'
      - '.github/scripts/lts_candidate_smoke.py'
      - '.github/workflows/candidate-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and validate isolated candidate
        run: python .github/scripts/lts_candidate_smoke.py
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wip35-v139-candidate-smoke
          path: candidate-smoke-result.txt
          if-no-files-found: error
