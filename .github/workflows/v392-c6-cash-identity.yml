name: V392 C6 forecast cash identity
on:
  pull_request:
    paths: ['backend/patches/v392/**','backend/qa/lts_v392_ci_sql.py','backend/qa/fixtures/v392*','.github/workflows/v392-c6-cash-identity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 backend/qa/lts_v392_ci_sql.py > /tmp/v392-native.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/v392-native.sql
