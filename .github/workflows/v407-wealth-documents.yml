name: V407 partial wealth and document review
on:
  pull_request:
    paths: ['releases/v407/**','mobile/current.json','.github/scripts/*v407*','.github/scripts/*v408*','.github/workflows/v407-wealth-documents.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      LTS_MOBILE_RELEASE: v436
      LTS_FLOW_RELEASE: v415
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v407_release_contract.cjs
      - run: node --test .github/scripts/lts_v408_cipo_model_test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v407-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v407_wealth_browser.cjs
      - run: node .github/scripts/lts_v407_document_review_browser.cjs
      - run: node .github/scripts/lts_v408_cipo_source_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v407-wealth-document-browser-evidence
          path: |
            qa/v407/
            qa/v407-documents/
            qa/v407-cipo/
