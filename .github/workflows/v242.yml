name: V242 cash flow, editing and professional UI
on:
  push:
    branches: ['work/v242-flow-usability']
  pull_request:
    paths: ['releases/v242/**', '.github/scripts/**', '.github/workflows/v242.yml', 'backend/patches/*v242*']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      LTS_RELEASE: v242
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node .github/scripts/lts_v225_static_gate.js
      - run: node .github/scripts/lts_v229_flow_gate.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Verify baked Chromium without downloading dependencies
        timeout-minutes: 2
        run: node .github/scripts/lts_v299_chromium_environment.cjs
      - name: Serve application and wait for readiness
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v242-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - name: Cash flow loader, edits and daily chart
        run: node .github/scripts/lts_v242_flow_ux_gate.js
      - name: Startup recovery, failures and bank refresh
        if: success() || failure()
        run: node .github/scripts/lts_v229_startup_gate.js
      - name: Source-backed historical positions
        if: success() || failure()
        run: node .github/scripts/lts_v238_history_gate.js
      - name: Historical cycles and columns
        if: success() || failure()
        run: node .github/scripts/lts_v237_history_audit_gate.js
      - name: Cash balances, navigation and invalidation
        if: success() || failure()
        run: node .github/scripts/lts_v236_balance_gate.js
      - name: Cards and document review
        if: success() || failure()
        run: node .github/scripts/lts_v233_document_gate.js
      - name: Classification and preserved card flows
        if: success() || failure()
        run: node .github/scripts/lts_v229_cards_gate.js
      - name: Source signs and classification
        if: success() || failure()
        run: node .github/scripts/lts_v234_source_gate.js
      - name: Historical inventory
        if: success() || failure()
        run: node .github/scripts/lts_v235_inventory_gate.js
      - name: Expense detail
        if: success() || failure()
        run: node .github/scripts/lts_v231_expense_drilldown_gate.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v242-browser-regression
          path: qa/
