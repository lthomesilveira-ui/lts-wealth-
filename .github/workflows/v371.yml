name: V371 confirmed billing-calendar coverage
on:
  pull_request:
    paths: ['releases/v371/**','.github/scripts/*v371*','.github/workflows/v371.yml','backend/patches/v371/**','backend/qa/*v371*','backend/qa/fixtures/v371/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v371_release_contract.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v371-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v371_browser.cjs
      - run: LTS_RELEASE=v371 node .github/scripts/lts_v342_month_rollover_contract.cjs
      - run: LTS_RELEASE=v371 node .github/scripts/lts_v342_month_rollover_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v371-homologation-browser
          path: qa/v371/

  native-calendar-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v371_ci_sql.py > /tmp/v371.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/v371.sql > /tmp/v371-results.log
      - if: failure()
        run: tail -c 8000 /tmp/v371-results.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v371-native-calendar-coverage
          path: /tmp/v371-results.log
