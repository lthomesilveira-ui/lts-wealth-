name: V312 complete card review and learning
on:
  pull_request:
    paths: ['releases/v312/**','backend/patches/v312/**','backend/qa/*v312*','.github/scripts/*v312*','.github/workflows/v312.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  card-learning:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      LTS_RELEASE: v312
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v312_release_contract.cjs
      - run: python3 backend/qa/lts_v312_ci.py
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Serve application and await readiness
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v312-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v312_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v312-native-learning-and-browser-evidence
          path: qa/v312/
