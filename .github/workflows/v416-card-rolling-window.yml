name: V416 card rolling window
on:
  pull_request:
    paths:
      - 'backend/qa/v416*'
      - 'backend/patches/v416/**'
      - 'supabase/migrations/*v416_card_rolling_window.sql'
      - '.github/workflows/v416-card-rolling-window.yml'
permissions:
  contents: read
jobs:
  native-postgres17:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGOPTIONS: '-c timezone=America/Sao_Paulo'
    steps:
      - uses: actions/checkout@v4
      - name: Verify installed predecessor, rolling window and scopes
        run: |
          set -euo pipefail
          createdb v416_test
          python3 backend/tools/projection_policy_v412/test_sql.py > /tmp/v416-base.sql
          psql -X -d v416_test -v ON_ERROR_STOP=1 -f /tmp/v416-base.sql
          psql -X -d v416_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261105211649_v413_bootstrap_projection_performance.sql
          psql -X -d v416_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261106232410_v416_card_rolling_window.sql
          psql -X -d v416_test -v ON_ERROR_STOP=1 -f backend/patches/v416/scope_adapter.sql
          psql -X -d v416_test -v ON_ERROR_STOP=1 -f backend/patches/v416/integrate_scopes.sql
          psql -X -d v416_test -v ON_ERROR_STOP=1 -c 'SELECT qa_v412.install_test_adapters();'
          sed 's/"source_kind":"card_invoice"/"source_kind":"card_invoice","history_window_months":3/g' backend/qa/v416_card_rolling_window_checks.sql > /tmp/v416-rolling-checks.sql
          psql -X -d v416_test -v ON_ERROR_STOP=1 -f /tmp/v416-rolling-checks.sql
          psql -X -d v416_test -v ON_ERROR_STOP=1 -f backend/qa/v416_scope_adapter_checks.sql
          psql -X -d v416_test -v ON_ERROR_STOP=1 -Atc "SELECT jsonb_build_object('checks',count(*),'pass',bool_and(pass),'timezone',current_setting('TimeZone'),'runtime',version()) FROM qa_v412.results" > v416-native-result.json
      - name: Retain reviewed source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v416-reviewed-source
          path: |
            supabase/migrations/20261106232410_v416_card_rolling_window.sql
            backend/qa/v416*checks.sql
            backend/patches/v416/
            v416-native-result.json
          if-no-files-found: error
          retention-days: 14
