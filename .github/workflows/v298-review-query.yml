name: V298 review query semantics
on:
  pull_request:
    paths: ['backend/patches/v298/**', 'backend/qa/lts_v298*', '.github/workflows/v298-review-query.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-identity-and-multiplicity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identity, duplicate, month, NULL and whole-record preservation cases
        env:
          PGPASSWORD: fixture-only
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f backend/qa/lts_v298_semantics.sql
