name: V304 posted own transfer
on:
  push:
    paths: ['backend/patches/v304/**', 'backend/qa/lts_v304*', '.github/workflows/v304.yml']
  pull_request:
    paths: ['backend/patches/v304/**', 'backend/qa/lts_v304*', '.github/workflows/v304.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-evidence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Define synthetic roles
        run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - name: Reject unsafe evidence
        run: python3 backend/qa/lts_v304_ci_sql.py | psql -v ON_ERROR_STOP=1
