name: LTS v158 native-core recovery
on:
  push:
    branches: [v158-native-core-auth-mobile-recovery, main]
    paths:
      - 'wip35-v158-candidate.html'
      - '.github/workflows/v158-native-core.yml'
      - 'homologacao-current.json'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('wip35-v158-candidate.html').read_text(encoding='utf-8')
          assert 'wip35-v151-candidate.html?v158-native-core' in s
          assert 'index.html?v158-native-core' not in s
          assert 'shadow_dashboard:false' in s
          assert 'native_data_owner:true' in s
          assert 'native_route_owner:true' in s
          assert 'authentication_required_in_this_browser_context' in s
          assert 'mobile_nav_single_row:true' in s
          assert 'document.write' not in s
          assert 'setInterval(' not in s
          assert 'new MutationObserver' not in s
          for bad in ['Dinheiro em contas</label>','Contas + curto prazo</label>','RSUs vested</label>']:
              assert bad not in s, 'v158 must not own a synthetic financial dashboard'
          print('v158_static=PASS')
          PY
      - name: Install Playwright WebKit
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps webkit chromium >/dev/null
      - name: Serve
        run: python3 -m http.server 8000 >/tmp/lts-v158-http.log 2>&1 &
      - name: WebKit iPhone unauthenticated truthfulness gate
        run: |
          node <<'NODE'
          const { webkit }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/wip35-v158-candidate.html',{waitUntil:'domcontentloaded',timeout:25000});
            await page.waitForSelector('#core',{state:'attached',timeout:5000});
            await page.waitForFunction(()=>window.__LTS_V158_STATUS?.pass===true,null,{timeout:16000});
            const out=await page.evaluate(()=>({status:window.__LTS_V158_STATUS,frames:document.querySelectorAll('iframe').length,syntheticKpis:document.querySelectorAll('.kpi,.kp').length,sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,src:document.getElementById('core')?.getAttribute('src')}));
            if(out.frames!==1)throw new Error('expected one native core frame '+JSON.stringify(out));
            if(out.syntheticKpis!==0)throw new Error('top-level synthetic financial UI detected '+JSON.stringify(out));
            if(out.sw>out.cw+4)throw new Error('top-level overflow '+JSON.stringify(out));
            if(out.src!=='wip35-v151-candidate.html?v158-native-core')throw new Error('wrong native core target '+JSON.stringify(out));
            if(!['authentication_required_in_this_browser_context','core_ready'].includes(out.status.auth_state))throw new Error('invalid auth state '+JSON.stringify(out));
            await page.screenshot({path:'v158-webkit-mobile.png',fullPage:true});
            fs.writeFileSync('v158-webkit.json',JSON.stringify({pass:true,authenticated:false,...out,errors},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Chromium desktop native-core smoke
        run: |
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1312,height:1199}});
            await page.goto('http://127.0.0.1:8000/wip35-v158-candidate.html',{waitUntil:'domcontentloaded',timeout:25000});
            await page.waitForFunction(()=>window.__LTS_V158_STATUS?.pass===true,null,{timeout:16000});
            const out=await page.evaluate(()=>({frames:document.querySelectorAll('iframe').length,sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,status:window.__LTS_V158_STATUS,src:document.getElementById('core')?.getAttribute('src')}));
            if(out.frames!==1||out.sw>out.cw+4||out.src!=='wip35-v151-candidate.html?v158-native-core')throw new Error(JSON.stringify(out));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wip35-v158-native-core
          path: |
            v158-webkit-mobile.png
            v158-webkit.json
          if-no-files-found: warn