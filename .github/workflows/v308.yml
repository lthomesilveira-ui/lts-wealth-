name: V308 compact projection review
on:
  pull_request:
    paths: ['releases/v308/**', '.github/scripts/lts_v308*', '.github/workflows/v308.yml', 'docs/V308_REVIEW_LAYOUT.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-and-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve release assets and financial contracts
        run: |
          node .github/scripts/lts_v308_release_contract.cjs
          node .github/scripts/lts_v272_payment_contract.cjs releases/v308/lts-v226-card-composition.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Serve application
        run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v308-http.log 2>&1 &
      - name: Verify compact Actions and preserved interactions
        run: node .github/scripts/lts_v308_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v308-homologation-evidence
          path: qa/v308/
