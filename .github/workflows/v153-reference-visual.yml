name: LTS v153 reference visual parity
on:
  push:
    branches: [main, v153-reference-visual-parity, v153-reference-contract-fidelity]
    paths:
      - 'wip35-v153-candidate.html'
      - 'homologacao-current.json'
      - '.github/workflows/v153-reference-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static candidate contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('wip35-v153-candidate.html')
          s=p.read_text(encoding='utf-8')
          req=['Sua posição hoje','Disponível D+3','Compromissos próximos','Evolução do caixa','Patrimônio e posição financeira','O que exige minha atenção','Gestão inteligente do seu patrimônio','visualFixture','wip35-v151-candidate.html?v153-parent']
          missing=[x for x in req if x not in s]
          assert not missing, missing
          assert 'index.html' not in s
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          assert m
          Path('/tmp/v153-inline.js').write_text(m.group(1),encoding='utf-8')
          print('v153_static=PASS')
          PY
          node --check /tmp/v153-inline.js
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render desktop and mobile evidence
        run: |
          python3 -m http.server 8783 >/tmp/v153-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat >/tmp/v153-visual.js <<'JS'
          const { chromium }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const out={pass:true,views:{},mobile_navigation:null};
            let failure=null;
            for(const spec of [{name:'desktop',viewport:{width:1536,height:864},fullPage:false},{name:'mobile',viewport:{width:390,height:844},fullPage:true}]){
              const page=await browser.newPage({viewport:spec.viewport});
              try{
                await page.goto('http://127.0.0.1:8783/wip35-v153-candidate.html?visualFixture=1',{waitUntil:'domcontentloaded',timeout:20000});
                await page.waitForSelector('.kpis .kpi',{state:'visible',timeout:5000});
                const geom=await page.evaluate(()=>{
                  const box=s=>{const r=document.querySelector(s)?.getBoundingClientRect();return r?{x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom}:null};
                  return {sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,topbar:box('.topbar'),dashboard:box('.dashboard'),title:box('.section-title'),kpis:[...document.querySelectorAll('.kpi')].map(x=>{const r=x.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom}}),attention:box('.attention'),nav:[...document.querySelectorAll('#mainNav button')].map(x=>x.textContent.trim())};
                });
                out.views[spec.name]=geom;
                if(geom.sw>geom.cw+8) throw Error(spec.name+' horizontal overflow '+JSON.stringify(geom));
                if(geom.nav.length!==6) throw Error(spec.name+' nav count '+geom.nav.length);
                if(spec.name==='desktop'){
                  if(Math.abs(geom.topbar.height-72)>2) throw Error('desktop topbar geometry '+JSON.stringify(geom.topbar));
                  if(geom.kpis.length!==5||geom.kpis.some(k=>Math.abs(k.height-86)>3)) throw Error('desktop KPI geometry '+JSON.stringify(geom.kpis));
                  const y0=geom.kpis[0].y;if(geom.kpis.some(k=>Math.abs(k.y-y0)>2)) throw Error('desktop KPI alignment');
                  if(geom.attention.bottom>860) throw Error('desktop model does not fit viewport attention.bottom='+geom.attention.bottom);
                }
                if(spec.name==='mobile'){
                  const flow=page.getByRole('button',{name:'Fluxo Diário'});const home=page.getByRole('button',{name:'Dashboard'});
                  await flow.click();
                  await page.waitForFunction(()=>getComputedStyle(document.getElementById('routeFrame')).display!=='none'&&getComputedStyle(document.getElementById('dashboard')).display==='none',null,{timeout:3000});
                  const headerVisible=await page.locator('.topbar').isVisible();
                  await home.click();
                  await page.waitForFunction(()=>getComputedStyle(document.getElementById('dashboard')).display!=='none'&&getComputedStyle(document.getElementById('routeFrame')).display==='none',null,{timeout:3000});
                  const dashboardVisible=await page.locator('.section-title').isVisible();
                  if(!headerVisible||!dashboardVisible)throw Error('mobile outer navigation did not recover Dashboard from Flow');
                  out.mobile_navigation={flow_visible:true,header_persistent:headerVisible,dashboard_return:true};
                }
              }catch(e){failure=failure||e;out.pass=false;out.error=String(e.stack||e)}
              finally{try{await page.screenshot({path:`v153-${spec.name}.png`,fullPage:spec.fullPage})}catch(e){}await page.close()}
            }
            fs.writeFileSync('v153-reference-visual-result.json',JSON.stringify(out,null,2));
            await browser.close();
            console.log(JSON.stringify(out));
            if(failure)throw failure;
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/v153-visual.js
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wip35-v153-reference-visual
          path: |
            v153-desktop.png
            v153-mobile.png
            v153-reference-visual-result.json
          if-no-files-found: error
