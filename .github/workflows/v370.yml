name: V370 billing-cycle transition
on:
  pull_request:
    paths: ['backend/patches/v370/**','backend/qa/lts_v370*','backend/qa/fixtures/v370/**','.github/workflows/v370.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v370-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-cycle-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v370_ci_sql.py > /tmp/v370.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/v370.sql > /tmp/v370-results.log
      - if: failure()
        run: tail -c 8000 /tmp/v370-results.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v370-native-cycle-transition
          path: /tmp/v370-results.log
