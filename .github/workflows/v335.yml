name: V335 coordinated guarded reads
on:
  pull_request:
    paths: ['releases/v335/**','.github/scripts/*v335*','.github/scripts/lts_v333_browser.cjs','.github/workflows/v335.yml','docs/V335_COORDINATED_READS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission-and-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LTS_RELEASE: v335
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v335_release_contract.cjs
      - run: node .github/scripts/lts_v335_transport_contract.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Serve application
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v335-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v333_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v335-admission-and-browser-evidence
          path: qa/v335/
