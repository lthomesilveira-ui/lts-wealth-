name: V225 QA staging on protected deployment branch
on:
  pull_request:
    paths: ['qa/v225/**', '.github/workflows/v225-qa-staging.yml']
  push:
    branches: [main]
    paths: ['qa/v225/**', '.github/workflows/v225-qa-staging.yml']
permissions:
  contents: read
concurrency:
  group: v225-qa-staging
  cancel-in-progress: false
jobs:
  preservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve the complete selected app
        run: git diff --exit-code 7b1bb0e849613fb643a79ae0d52ffeded46ff318 -- . ':!qa/v225' ':!.github/workflows/v225-qa-staging.yml'
      - name: Verify exact tested assets and historical evidence
        run: |
          test "$(git rev-parse HEAD:qa/v225)" = "7e6d490c2df587fef41ff8e1e7f030f109ae306c"
          node <<'JS'
          const fs=require('fs'),c=require('crypto'),a=require('assert');
          const m=JSON.parse(fs.readFileSync('qa/v225/manifest.json'));
          const hash=p=>c.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          for(const [p,h] of Object.entries(m.files))a.equal(hash('qa/v225/'+p),h,p);
          for(const [p,h] of Object.entries(m.protected))a.equal(hash(p),h,p);
          console.log('PASS: 53 tested assets, 19 historical assets, selected app unchanged');
          JS
  deploy:
    if: github.event_name == 'push'
    needs: preservation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Record QA location
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Current app preserved. QA at ${PAGE_URL}qa/v225/app.html"
