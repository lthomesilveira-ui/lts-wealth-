name: V354 documented income adjustment without physical expense removal
on:
  pull_request:
    paths: ['backend/patches/v354/**','backend/qa/*v354*','backend/qa/fixtures/v354*','.github/workflows/v354.yml','docs/V354_DOCUMENTED_INCOME_ADJUSTMENT.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v354_ci_sql.py > /tmp/lts-v354.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/lts-v354.sql > /tmp/lts-v354-result.log
      - if: failure()
        run: tail -c 8000 /tmp/lts-v354-result.log || true
      - run: tail -2 /tmp/lts-v354-result.log
