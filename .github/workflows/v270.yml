name: V270 category presentation and regression
on:
  pull_request:
    paths: ['releases/v270/**', 'backend/qa/lts_v270*', '.github/scripts/lts_v270*', '.github/workflows/v270.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LTS_RELEASE: v270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node backend/qa/lts_v270_category_display.js
      - name: Check candidate and protected hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.'); base=root/'releases/v270'; m=json.loads((base/'manifest.json').read_text())
          for n,h in m['files'].items(): assert hashlib.sha256((base/n).read_bytes()).hexdigest()==h,n
          for n,h in m['protected'].items(): assert hashlib.sha256((root/n).read_bytes()).hexdigest()==h,n
          print('Candidate manifest and all protected assets verified')
          PY
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v270-http.log 2>&1 &
      - name: Category UI and card/expense regression
        run: node .github/scripts/lts_v270_category_browser.js
      - name: Flow period navigation
        if: success() || failure()
        run: node .github/scripts/lts_flow_navigation_gate.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v270-category-evidence
          path: qa/
