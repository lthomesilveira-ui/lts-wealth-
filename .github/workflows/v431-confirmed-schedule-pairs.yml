name: V431 confirmed schedule pairs
on:
  pull_request:
    paths: ['backend/patches/v431/**','backend/qa/lts_v431*','backend/qa/fixtures/v431/**','.github/workflows/v431-confirmed-schedule-pairs.yml']
permissions:
  contents: read
jobs:
  native-pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify confirmed ownership, unique credits and financial source changes
        run: psql -X -v ON_ERROR_STOP=1 -At -f backend/qa/lts_v431_schedule_pairs.sql

