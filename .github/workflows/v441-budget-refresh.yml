name: V441 budget and queued refresh
on:
  pull_request:
    paths: ['releases/v441/**','backend/tools/wealth_budget_v441/**','backend/patches/v441/**','backend/qa/v441/**','.github/scripts/lts_v441*','.github/workflows/v441-budget-refresh.yml','mobile/current.json']
permissions:
  contents: read
jobs:
  rendered:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      LTS_MOBILE_RELEASE: v442
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable build, controller and real transport
        run: |
          python3 backend/tools/wealth_budget_v441/build.py --check
          node .github/scripts/lts_v441_release_contract.cjs
          node .github/scripts/lts_v441_refresh_test.cjs
          node .github/scripts/lts_v441_transport_test.cjs
          node .github/scripts/lts_v441_model_test.cjs
          npm ci --prefix backend/qa/v441 --ignore-scripts
          node backend/qa/v441/test.mjs
      - name: Render desktop and mobile in Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/v441-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
          node .github/scripts/lts_v441_historical_browser.cjs
      - name: Current deployment gates
        run: python3 backend/tools/report_presentation_v417/read_only_gates.py > qa/v441/current-static-gates.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v441-validation
          retention-days: 14
          path: qa/v441/
