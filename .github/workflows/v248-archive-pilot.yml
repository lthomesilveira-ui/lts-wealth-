name: V248 offline audit archive pilot
on:
  push:
    branches: [work/v248-observation-archive-pilot]
  pull_request:
    paths:
      - backend/tools/lts_observation_archive_v248.py
      - backend/tools/lts_observation_snapshot_v248.py
      - backend/tools/observation_export_v248.sql
      - backend/tools/observation_historical_export_v248.sql
      - backend/tools/observation_dictionary_transport_v248.sql
      - backend/tools/README_v248.md
      - backend/qa/test_lts_observation_archive_v248.py
      - backend/qa/test_lts_observation_snapshot_v248.py
      - .github/workflows/v248-archive-pilot.yml
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Lossless archive and failure guards
        run: python3 -m unittest discover -s backend/qa -p 'test_lts_observation_*v248.py' -v
      - name: Preserve current backend and frozen frontend gates
        run: |
          node backend/qa/lts_v246_source_gate.js
          node backend/qa/lts_v245_source_gate.js
