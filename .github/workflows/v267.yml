name: V267 prepared reader plans and preserved V264 interface
on:
  push:
    branches: ['codex/v267-reader-plans']
  pull_request:
    paths: ['backend/patches/*v267*', 'backend/qa/*v267*', '.github/workflows/v267.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LTS_RELEASE: v264
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node backend/qa/lts_v267_source_gate.js
      - run: node .github/scripts/lts_v225_static_gate.js
      - run: node .github/scripts/lts_v260_detail_gate.js
      - run: node .github/scripts/lts_v264_invoice_stamp_gate.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 8
      - run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v267-http.log 2>&1 &
      - name: Preserved card documents and source dates
        run: node .github/scripts/lts_v233_document_gate.js
      - name: Preserved card detail and classification paths
        if: success() || failure()
        run: node .github/scripts/lts_v229_cards_gate.js
      - name: Preserved daily cash and period selection
        if: success() || failure()
        run: node .github/scripts/lts_v245_regression_gate.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v267-preserved-v264-regression
          path: qa/
