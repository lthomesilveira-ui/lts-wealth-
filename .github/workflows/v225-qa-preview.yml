name: V225 isolated authenticated QA preview

on:
  push:
    branches: ['work/v225-consolidated-recovery']
    paths: ['.github/workflows/v225-qa-preview.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preserved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tested candidate and unchanged current app
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "7b1bb0e849613fb643a79ae0d52ffeded46ff318"
          git diff --exit-code 86f87edb1268cce58e0454d74999033edb62651e -- releases/v225 frozen-v181 index.html homologacao.html
          node .github/scripts/lts_v225_static_gate.js
      - name: Compose current app plus isolated QA path
        run: |
          mkdir _site
          git archive 7b1bb0e849613fb643a79ae0d52ffeded46ff318 | tar -x -C _site
          mkdir -p _site/qa/v225
          cp -a releases/v225/. _site/qa/v225/
          diff -q index.html _site/index.html
          diff -q homologacao.html _site/homologacao.html
      - name: Configure existing Pages
        uses: actions/configure-pages@v5
      - name: Upload current app and isolated preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record QA location
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Current app preserved. QA: ${PAGE_URL}qa/v225/app.html"
