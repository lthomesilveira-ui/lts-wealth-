name: Synthetic schedule transaction QA (PostgreSQL 16)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/p07-schedule/**'
      - '.github/workflows/p07-postgres16.yml'
      - 'releases/v271/index.html'
permissions:
  contents: read
jobs:
  financial-postgres16:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: qa-only
      P07_QA_ALLOW_DISPOSABLE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: tests/p07-schedule
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frozen package before dependencies
        run: python test_static.py
      - name: Install PostgreSQL test client only
        run: python -m pip install --requirement requirements.txt
      - name: Execute financial DO blocks in disposable database
        shell: bash
        run: |
          set -euo pipefail
          python test_postgres.py 2>&1 | tee postgres16-result.txt
      - name: Upload financial synthetic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-postgres16-result
          path: tests/p07-schedule/postgres16-result.txt
          if-no-files-found: ignore
  documentary-postgres16:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: qa-only
      P07_QA_ALLOW_DISPOSABLE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: tests/p07-schedule
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check documentary sources and actual release renderer offline
        run: |
          python test_static.py
          python documentary_position_gate.py --ui-source ../../releases/v271/index.html
      - name: Install PostgreSQL test client only
        run: python -m pip install --requirement requirements.txt
      - name: Execute documentary reader and actual renderer contract
        shell: bash
        run: |
          set -euo pipefail
          python documentary_position_gate.py --postgres --ui-source ../../releases/v271/index.html 2>&1 | tee documentary-postgres16-result.txt
      - name: Upload documentary synthetic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-postgres16-result
          path: tests/p07-schedule/documentary-postgres16-result.txt
          if-no-files-found: ignore
