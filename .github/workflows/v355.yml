name: V355 canonical unsettled card obligations
on:
  pull_request:
    paths: ['backend/patches/v355/**','backend/qa/*v355*','backend/qa/fixtures/v355*','.github/scripts/*v355*','.github/workflows/v355.yml','docs/V355_CANONICAL_CARD_OBLIGATIONS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v355_ci_sql.py > /tmp/lts-v355.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/lts-v355.sql > /tmp/lts-v355-result.log
      - if: failure()
        run: tail -c 8000 /tmp/lts-v355-result.log || true
      - run: |
          python3 - <<'PY'
          import json,pathlib
          rows=[json.loads(x)for x in pathlib.Path('/tmp/lts-v355-result.log').read_text().splitlines()if x.startswith('{')]
          rows=[x for x in rows if x.get('version')==355]
          assert len(rows)==1 and rows[0]['pass'] and rows[0]['invalid_source_cases']==12
          p=pathlib.Path('qa/v355/native-card-projection.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(rows[0]))
          print('V355 actual reader bodies and twelve invalid source cases passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v355-native-card-projection
          path: qa/v355/native-card-projection.json
  browser-contract:
    needs: native-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: v355-native-card-projection
          path: qa/v355/
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v355-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v355_card_obligation_browser.cjs
      - run: LTS_RELEASE=v353 node .github/scripts/lts_v342_month_rollover_browser.cjs
      - run: LTS_RELEASE=v353 node .github/scripts/lts_v333_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v355-card-obligation-browser
          path: qa/v355/
