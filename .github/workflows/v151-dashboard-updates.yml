name: LTS v151 Dashboard updates cockpit
on:
  push:
    branches: [v151-dashboard-updates-cockpit, main]
    paths:
      - 'wip35-v153-candidate.html'
      - '.github/workflows/v153-reference-visual.yml'
      - 'wip35-v151-candidate.html'
      - 'wip35-v151-dashboard-updates.js'
      - 'wip35-v151-ledger-search.js'
      - 'wip35-v151-reference-fidelity.js'
      - '.github/scripts/lts_v151_dashboard_updates_smoke.js'
      - '.github/workflows/v151-dashboard-updates.yml'
      - 'wip35-v150-candidate.html'
      - 'wip35-v150-recomposition.js'
      - 'wip35-v146-candidate.html'
      - 'wip35-v146-updates-navigation.js'
      - 'wip35-v148-classification-lifecycle.js'
      - 'wip35-v149-document-interpretation-review.js'
      - 'homologacao-current.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v151 architecture and guardrails
        run: |
          node --check wip35-v151-dashboard-updates.js
          node --check wip35-v151-ledger-search.js
          node --check wip35-v151-reference-fidelity.js
          node --check .github/scripts/lts_v151_dashboard_updates_smoke.js
          python - <<'PY'
          from pathlib import Path
          import subprocess
          html=Path('wip35-v151-candidate.html').read_text()
          js=Path('wip35-v151-dashboard-updates.js').read_text()
          ledger=Path('wip35-v151-ledger-search.js').read_text()
          reference=Path('wip35-v151-reference-fidelity.js').read_text()
          v146=Path('wip35-v146-candidate.html').read_text()
          allv=html+'\n'+js+'\n'+ledger+'\n'+reference
          required=[
            'wip35-v150-candidate.html?v151-parent',
            'wip35-v151-dashboard-updates.js?v151-dashboard-updates-v1',
            'wip35-v151-ledger-search.js?v151-ledger-search-v1',
            'wip35-v151-reference-fidelity.js?v151-reference-fidelity-v1',
            'dashboard-updates-cockpit-v1',
            'ledger-search-export-v1',
            'reference-fidelity-v1',
            'WIP35-v151 · Homologação',
            'CANDIDATA v151 · validação interna',
            'Sua vida financeira, em uma tela.',
            'Total contas correntes',
            'Cofrinho',
            'FGTS',
            'Compromissos próximos',
            'Evolução do caixa',
            'Patrimônio e posição financeira',
            'O que exige minha atenção',
            'Estabelecimento já identificado',
            'LTS ainda investigando',
            'Encontrar lançamentos',
            'lts_browser_transactions_v1',
            'lts_browser_expense_drilldown_v1',
            'lts_browser_planning_bridge_executive_v1',
            'Primeiro saldo negativo',
            'sem estimar aportes futuros',
            '2013-10-10',
            'Exportar para Excel (CSV)',
            'server_side:true',
            'writer_added:false',
            'financial_writer_changed:false',
            'classification_inference:false',
            'classification_writer_added:false',
            'navigation_owner_changed:false',
            'permanent_polling:false'
          ]
          missing=[x for x in required if x not in allv]
          assert not missing, missing
          assert 'v146-feedback-safe-loader-v1' in v146
          assert 'app-document-not-ready' in v146
          assert 'setInterval(' not in allv
          assert 'lts_browser_apply_reviewed_input_v1' not in js+ledger+reference
          assert 'lts_browser_semantic_feedback_v1' not in js+ledger+reference
          assert 'lts_browser_flow_v4' not in ledger+reference
          protected=subprocess.check_output(['git','rev-parse','HEAD:index.html'],text=True).strip()
          assert protected=='a130eafe5f7ee5b7f60a95b5ff988669d0c401d9'
          print('v151_static=PASS')
          PY
      - name: Audit inherited button contracts
        run: node .github/scripts/lts_button_contract_audit.js
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Re-run inherited parser/static gate
        run: python .github/scripts/lts_candidate_smoke.py
      - name: Re-run inherited v146 navigation gate
        run: |
          python3 -m http.server 8772 >/tmp/lts-v146-v151.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node .github/scripts/lts_v146_updates_navigation_smoke.js
      - name: Re-run inherited v147 document association gate
        run: |
          python3 -m http.server 8773 >/tmp/lts-v147-v151.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node .github/scripts/lts_v147_document_association_smoke.js
      - name: Re-run inherited v148 classification lifecycle gate
        run: |
          python3 -m http.server 8774 >/tmp/lts-v148-v151.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node .github/scripts/lts_v148_classification_lifecycle_smoke.js
      - name: Re-run inherited v149 document interpretation gate
        run: |
          python3 -m http.server 8775 >/tmp/lts-v149-v151.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node .github/scripts/lts_v149_document_interpretation_review_smoke.js
      - name: Re-run v150 contract gate
        run: |
          python3 -m http.server 8776 >/tmp/lts-v150-v151.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node .github/scripts/lts_v150_recomposition_smoke.js
      - name: Run v151 desktop/mobile reference + cockpit + ledger search gate
        run: |
          python3 -m http.server 8777 >/tmp/lts-v151.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node .github/scripts/lts_v151_dashboard_updates_smoke.js
      - name: Upload v151 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wip35-v151-dashboard-updates-cockpit
          path: |
            v151-dashboard-updates-smoke-result.json
            v150-recomposition-smoke-result.json
            v149-document-interpretation-review-smoke-result.json
            v148-classification-lifecycle-smoke-result.json
            v147-document-association-smoke-result.json
            v146-updates-navigation-smoke-result.json
            candidate-smoke-result.txt
            button-contract-audit-result.json
          if-no-files-found: warn
