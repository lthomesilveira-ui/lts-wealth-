name: V468 specific recurring card coverage
on:
  pull_request:
    paths: ['backend/tools/card_subscriptions_v468/**','.github/workflows/card-subscriptions-v468.yml','.github/scripts/lts_v468_subscription_model.cjs']
permissions:
  contents: read
jobs:
  native-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      PGTZ: America/Sao_Paulo
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify deterministic source and immutable predecessor
        run: |
          python3 backend/tools/card_subscriptions_v468/build.py
          git diff --exit-code -- backend/tools/card_subscriptions_v468
      - name: Native monthly annual and no-double-counting contracts
        run: python3 backend/tools/card_subscriptions_v468/test_native.py
      - name: Existing published consumer contract
        run: node .github/scripts/lts_v468_subscription_model.cjs

