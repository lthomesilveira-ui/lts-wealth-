name: V488 verified dashboard year preparation
on:
  pull_request:
    paths: ['backend/tools/dashboard_year_v488/**','.github/workflows/v488-dashboard-year.yml']
permissions:
  contents: read
jobs:
  native-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      PGTZ: America/Sao_Paulo
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 backend/tools/dashboard_year_v488/test_native.py
