name: LTS v155 real data navigation
on:
  push:
    branches: [v155-real-data-navigation-fix, main]
    paths:
      - 'wip35-v155-candidate.html'
      - '.github/workflows/v155-real-data-navigation.yml'
      - 'homologacao-current.json'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('wip35-v155-candidate.html').read_text()
          for x in ['all_route_retry:true','false_zero_guard:true','d3_component_recovery:true','dado mensal não carregado','ROUTES=[','Fluxo Diário','Despesas','Patrimônio','Cartões','Atualizações']:
              assert x in s, x
          assert 'index.html' not in '\n'.join([p.as_posix() for p in Path('.').glob('index.html.__v155*')])
          PY
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve
        run: python3 -m http.server 8000 >/tmp/lts-v155-http.log 2>&1 &
      - name: Browser functional gate
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for (const vp of [{name:'desktop',width:1312,height:1199},{name:'mobile',width:390,height:844}]) {
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              await page.goto('http://127.0.0.1:8000/wip35-v155-candidate.html?runtimeFixture=1',{waitUntil:'load'});
              await page.waitForTimeout(5000);
              const app=page.frames().find(f=>f.url().includes('wip35-v154-candidate.html'));
              if(!app) throw new Error(vp.name+': v154 visual frame missing');
              const kpi=app.locator('.kpi').filter({hasText:'Disponível D+3'}).locator('strong');
              const d3=(await kpi.textContent())||'';
              if(!d3.includes('40.000')) throw new Error(vp.name+': D+3 component recovery failed: '+d3);
              const expenses=app.locator('.kpi').filter({hasText:'Despesas (mês)'});
              const expText=(await expenses.textContent())||'';
              if(expText.includes('R$ 0,00')||!expText.includes('dado mensal não carregado')) throw new Error(vp.name+': false-zero guard failed: '+expText);
              const actions=(await app.locator('.kpi').filter({hasText:'Ações pendentes'}).textContent())||'';
              if(!actions.includes('23 atualizações em fila')) throw new Error(vp.name+': update count evidence missing: '+actions);
              const selector=vp.name==='mobile'?'#mobileNav [data-route]':'#sideNav [data-route]';
              for(const dest of ['Fluxo Diário','Despesas','Patrimônio','Cartões','Atualizações','Dashboard']){
                const button=app.locator(selector).filter({hasText:dest}).first();
                await button.click();
                await page.waitForTimeout(850);
                const state=await page.evaluate(()=>window.__LTS_V155_ROUTE_STATE||null);
                if(dest==='Dashboard'){
                  if(!(await app.locator('#dashboard').isVisible())) throw new Error(vp.name+': Dashboard did not return');
                } else {
                  if(!(await app.locator('#routeFrame').isVisible())) throw new Error(vp.name+': route frame hidden for '+dest);
                  if(!state||state.dest!==dest||state.ok!==true) throw new Error(vp.name+': route failed '+dest+' '+JSON.stringify(state));
                }
              }
              const dims=await app.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
              if(dims.sw>dims.cw+2) throw new Error(vp.name+': horizontal overflow '+JSON.stringify(dims));
              await page.screenshot({path:`v155-${vp.name}.png`,fullPage:true});
              await page.close();
            }
            require('fs').writeFileSync('v155-result.json',JSON.stringify({pass:true,routes:6,false_zero_guard:true,d3_component_recovery:true,authenticated_e2e:false},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: wip35-v155-functional-gate
          path: |
            v155-desktop.png
            v155-mobile.png
            v155-result.json
