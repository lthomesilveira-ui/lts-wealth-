name: V281 reviewed payment presentation
on:
  pull_request:
    paths: ['releases/v281/**', '.github/scripts/lts_v281*', '.github/workflows/v281.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LTS_RELEASE: v281
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v281_release_contract.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p qa
      - run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/v281-http.log 2>&1 &
      - run: node .github/scripts/lts_v281_payment_fullstack.js
      - run: node .github/scripts/lts_v281_boot_browser.js
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v281-payment-evidence
          path: qa/
