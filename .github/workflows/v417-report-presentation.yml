name: V417 report presentation
on:
  pull_request:
    paths:
      - 'backend/tools/report_presentation_v417/**'
      - 'releases/v417/**'
      - 'mobile/current.json'
      - '.github/workflows/pages.yml'
      - '.github/scripts/lts_v417_verify_published.cjs'
      - '.github/workflows/v417-report-presentation.yml'
permissions:
  contents: read
jobs:
  rendered-acceptance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      V417_EVIDENCE: v417-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify immutable historical UI and current protected gates
        run: |
          mkdir -p v417-evidence
          python backend/tools/report_presentation_v417/build.py
          python backend/tools/report_presentation_v417/build.py
          node backend/tools/report_presentation_v417/test.cjs > v417-evidence/unit-result.json
          python backend/tools/report_presentation_v417/render_test.py
          python backend/tools/report_presentation_v417/read_only_gates.py > v417-evidence/prior-release-gates.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v417-reviewed-candidate
          retention-days: 14
          include-hidden-files: true
          path: |
            v417-evidence/
            releases/v417/
