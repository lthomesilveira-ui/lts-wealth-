name: V375 reviewed Aeternum receipt identity
on:
  pull_request:
    paths: ['backend/patches/v375/**','backend/qa/*v375*','backend/qa/fixtures/v375/**','.github/workflows/v375.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-receipt-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v375_ci_sql.py > /tmp/v375.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/v375.sql > /tmp/v375-results.log
      - if: failure()
        run: tail -c 9000 /tmp/v375-results.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v375-native-receipt-coverage
          path: /tmp/v375-results.log
