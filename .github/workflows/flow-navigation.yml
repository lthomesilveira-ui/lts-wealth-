name: Flow selected period navigation
on:
  push:
    branches: ['codex/flow-selected-period-navigation']
  pull_request:
    paths: ['.github/scripts/lts_flow_navigation_gate.js', '.github/workflows/flow-navigation.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LTS_RELEASE: v269
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-flow-navigation-http.log 2>&1 &
      - run: node .github/scripts/lts_flow_navigation_gate.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-navigation-evidence
          path: qa/
