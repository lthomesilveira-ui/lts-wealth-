name: LTS browser smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validate and stage WIP35-v88
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, urllib.request, re
          url='https://tadhkamnwtsbdozwkyut.supabase.co/rest/v1/lts_public_ui_shell?version=eq.wip35-v88&select=html'
          k='sb_publishable__p3SAbpThUIKtDr7A4llPw_AVkOaNkm'
          req=urllib.request.Request(url,headers={'apikey':k,'Authorization':'Bearer '+k})
          data=json.load(urllib.request.urlopen(req,timeout=30)); h=data[0]['html']
          open('/tmp/shell.html','w',encoding='utf-8').write(h)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.I|re.S)
          for i,s in enumerate(scripts): open(f'/tmp/script-{i}.js','w',encoding='utf-8').write(s)
          PY
          : > smoke-result.txt
          echo 'version=wip35-v88' >> smoke-result.txt
          ok=1
          for f in /tmp/script-*.js; do node --check "$f" >> smoke-result.txt 2>&1; rc=$?; echo "exit=$rc" >> smoke-result.txt; [ $rc -ne 0 ] && ok=0; done
          grep -q 'WIP35-v88 · Fluxo canônico' /tmp/shell.html || { echo 'stamp=missing' >> smoke-result.txt; ok=0; }
          grep -q "const BUILD='WIP35-v88 · Browser RPC v1 · Flow canonical table'" /tmp/shell.html || { echo 'internal_stamp=missing' >> smoke-result.txt; ok=0; }
          [ "$(grep -o 'function fluxo()' /tmp/shell.html | wc -l)" -eq 1 ] || { echo 'single_fluxo_function=failed' >> smoke-result.txt; ok=0; }
          grep -q 'class="fx87-mesa"' /tmp/shell.html || { echo 'single_table=missing' >> smoke-result.txt; ok=0; }
          grep -q 'class="fx87-scroll"' /tmp/shell.html || { echo 'single_scroll=missing' >> smoke-result.txt; ok=0; }
          grep -q "document.querySelector('.fx87-scroll')||document.querySelector('.mscroll')" /tmp/shell.html || { echo 'expand_scroll_handler=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Saldo c/ D0/D1' /tmp/shell.html || { echo 'd01_balance=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Saldo c/ RSU' /tmp/shell.html || { echo 'rsu_balance=missing' >> smoke-result.txt; ok=0; }
          grep -q 'FGTS <small>restrito</small>' /tmp/shell.html || { echo 'fgts_header=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Saldo total' /tmp/shell.html || { echo 'total_balance=missing' >> smoke-result.txt; ok=0; }
          grep -q 'fx87-details-title">Histórico / movimentos' /tmp/shell.html || { echo 'expandable_history=missing' >> smoke-result.txt; ok=0; }
          grep -q 'function cardSettlementInline' /tmp/shell.html || { echo 'invoice_inline=missing' >> smoke-result.txt; ok=0; }
          if grep -q 'Histórico bancário' /tmp/shell.html; then echo 'split_historical=present' >> smoke-result.txt; ok=0; else echo 'split_historical=absent' >> smoke-result.txt; fi
          if grep -q 'Hoje e projeção de caixa' /tmp/shell.html; then echo 'split_future=present' >> smoke-result.txt; ok=0; else echo 'split_future=absent' >> smoke-result.txt; fi
          if grep -q 'Liquidez D+30</div>' /tmp/shell.html; then echo 'old_d30=present' >> smoke-result.txt; ok=0; else echo 'old_d30=absent' >> smoke-result.txt; fi
          if grep -q 'cdn.jsdelivr.net' /tmp/shell.html; then echo 'cdn=present' >> smoke-result.txt; ok=0; else echo 'cdn=absent' >> smoke-result.txt; fi
          if [ $ok -eq 1 ]; then cp /tmp/shell.html index.html; echo 'publish=ready' >> smoke-result.txt; else echo 'publish=blocked' >> smoke-result.txt; fi
          cat smoke-result.txt
      - name: Commit validated shell and result
        run: |
          git config user.name 'lts-smoke-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add smoke-result.txt index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish validated WIP35-v88'
          git push
