name: LTS browser smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validate and stage WIP35-v76
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, urllib.request, re
          url='https://tadhkamnwtsbdozwkyut.supabase.co/rest/v1/lts_public_ui_shell?version=eq.wip35-v76&select=html'
          k='sb_publishable__p3SAbpThUIKtDr7A4llPw_AVkOaNkm'
          req=urllib.request.Request(url,headers={'apikey':k,'Authorization':'Bearer '+k})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          h=data[0]['html']
          open('/tmp/shell.html','w',encoding='utf-8').write(h)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.I|re.S)
          for i,s in enumerate(scripts): open(f'/tmp/script-{i}.js','w',encoding='utf-8').write(s)
          print('shell bytes',len(h),'inline scripts',len(scripts))
          PY
          : > smoke-result.txt
          echo "version=wip35-v76" >> smoke-result.txt
          ok=1
          for f in /tmp/script-*.js; do
            echo "=== $f ===" >> smoke-result.txt
            node --check "$f" >> smoke-result.txt 2>&1
            rc=$?
            echo "exit=$rc" >> smoke-result.txt
            [ $rc -ne 0 ] && ok=0
          done
          if grep -q "cdn.jsdelivr.net" /tmp/shell.html; then echo 'cdn=present' >> smoke-result.txt; ok=0; else echo 'cdn=absent' >> smoke-result.txt; fi
          grep -q 'Histórico / movimentos' /tmp/shell.html || { echo 'history_column=missing' >> smoke-result.txt; ok=0; }
          grep -q 'grid-template-columns:130px 360px' /tmp/shell.html || { echo 'flow_compact_grid=missing' >> smoke-result.txt; ok=0; }
          grep -q 'class="mscroll cashscroll"' /tmp/shell.html || { echo 'single_table_scroll=missing' >> smoke-result.txt; ok=0; }
          grep -q 'flowbar flowfilters' /tmp/shell.html || { echo 'wrapped_filters=missing' >> smoke-result.txt; ok=0; }
          grep -q 'WIP35-v76 · Fluxo auditado' /tmp/shell.html || { echo 'visible_build_stamp=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Disponível total' /tmp/shell.html || { echo 'available_total=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Abrir fatura' /tmp/shell.html || { echo 'invoice_drilldown=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Por categoria' /tmp/shell.html || { echo 'invoice_category_summary=missing' >> smoke-result.txt; ok=0; }
          if grep -q 'Leitura de caixa:' /tmp/shell.html; then echo 'yellow_notice=present' >> smoke-result.txt; ok=0; else echo 'yellow_notice=absent' >> smoke-result.txt; fi
          if grep -q 'Realizado</span>' /tmp/shell.html; then echo 'realized_badge=present' >> smoke-result.txt; ok=0; else echo 'realized_badge=absent' >> smoke-result.txt; fi
          if grep -q 'Pós-âncora</span>' /tmp/shell.html; then echo 'post_anchor_badge=present' >> smoke-result.txt; ok=0; else echo 'post_anchor_badge=absent' >> smoke-result.txt; fi
          if grep -q "basis:'relative'" /tmp/shell.html; then echo 'relative_balance_ui=present' >> smoke-result.txt; ok=0; else echo 'relative_balance_ui=absent' >> smoke-result.txt; fi
          if grep -q '<div>RSUs futuras</div>' /tmp/shell.html; then echo 'future_rsu_flow_column=present' >> smoke-result.txt; ok=0; else echo 'future_rsu_flow_column=absent' >> smoke-result.txt; fi
          if grep -q '<div>FGTS</div>' /tmp/shell.html; then echo 'fgts_flow_column=present' >> smoke-result.txt; ok=0; else echo 'fgts_flow_column=absent' >> smoke-result.txt; fi
          if [ $ok -eq 1 ]; then cp /tmp/shell.html index.html; echo 'publish=ready' >> smoke-result.txt; else echo 'publish=blocked' >> smoke-result.txt; fi
          cat smoke-result.txt
      - name: Commit validated shell and result
        run: |
          git config user.name 'lts-smoke-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add smoke-result.txt index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish validated WIP35-v76'
          git push
