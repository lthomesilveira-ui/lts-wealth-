name: LTS browser smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/lts_smoke.py'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Wealth candidate shell
        id: validate
        run: python .github/scripts/lts_smoke.py
      - name: Persist failed smoke diagnostics
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          git config user.name 'lts-smoke-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add smoke-result.txt
          if ! git diff --cached --quiet; then
            VERSION=$(head -n 1 smoke-result.txt | cut -d= -f2)
            git commit -m "Record blocked ${VERSION} smoke"
            git pull --rebase origin main
            git push
          fi
      - name: Commit validated shell and result
        if: success()
        run: |
          git config user.name 'lts-smoke-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add smoke-result.txt index.html
          if ! git diff --cached --quiet; then
            VERSION=$(head -n 1 smoke-result.txt | cut -d= -f2)
            git commit -m "Publish validated ${VERSION}"
            git pull --rebase origin main
            git push
          fi
      - name: Deploy validated main
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
