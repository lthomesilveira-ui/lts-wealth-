name: LTS browser smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validate and stage WIP35-v86
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, urllib.request, re
          url='https://tadhkamnwtsbdozwkyut.supabase.co/rest/v1/lts_public_ui_shell?version=eq.wip35-v86&select=html'
          k='sb_publishable__p3SAbpThUIKtDr7A4llPw_AVkOaNkm'
          req=urllib.request.Request(url,headers={'apikey':k,'Authorization':'Bearer '+k})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          h=data[0]['html']
          open('/tmp/shell.html','w',encoding='utf-8').write(h)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.I|re.S)
          for i,s in enumerate(scripts): open(f'/tmp/script-{i}.js','w',encoding='utf-8').write(s)
          PY
          : > smoke-result.txt
          echo 'version=wip35-v86' >> smoke-result.txt
          ok=1
          for f in /tmp/script-*.js; do node --check "$f" >> smoke-result.txt 2>&1; rc=$?; echo "exit=$rc" >> smoke-result.txt; [ $rc -ne 0 ] && ok=0; done
          grep -q 'WIP35-v86 · Fluxo auditado' /tmp/shell.html || { echo 'stamp=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Histórico bancário' /tmp/shell.html || { echo 'historical_section=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Hoje e projeção de caixa' /tmp/shell.html || { echo 'current_future_section=missing' >> smoke-result.txt; ok=0; }
          grep -q 'flow-v86-visual' /tmp/shell.html || { echo 'visual_css=missing' >> smoke-result.txt; ok=0; }
          grep -q '.flow-bank-row{grid-template-columns:132px repeat(4,minmax(145px,1fr));width:100%}' /tmp/shell.html || { echo 'historical_full_width=missing' >> smoke-result.txt; ok=0; }
          grep -q '.flow-cover-row{grid-template-columns:132px 126px 105px 105px 126px repeat(3,minmax(180px,1fr));min-width:1120px}' /tmp/shell.html || { echo 'coverage_grouped_grid=missing' >> smoke-result.txt; ok=0; }
          grep -q 'flow-cover-balance' /tmp/shell.html || { echo 'balance_step=missing' >> smoke-result.txt; ok=0; }
          grep -q 'flowdetails-title' /tmp/shell.html || { echo 'expandable_history_panel=missing' >> smoke-result.txt; ok=0; }
          grep -q 'function cardSettlementInline' /tmp/shell.html || { echo 'inline_invoice_function=missing' >> smoke-result.txt; ok=0; }
          grep -q "e.source!=='economic_withholding'" /tmp/shell.html || { echo 'withholding_cash_filter=missing' >> smoke-result.txt; ok=0; }
          grep -q '!e.internal_transfer' /tmp/shell.html || { echo 'internal_transfer_filter=missing' >> smoke-result.txt; ok=0; }
          if grep -q 'Liquidez D+30</div>' /tmp/shell.html; then echo 'old_d30_header=present' >> smoke-result.txt; ok=0; else echo 'old_d30_header=absent' >> smoke-result.txt; fi
          if grep -q 'cdn.jsdelivr.net' /tmp/shell.html; then echo 'cdn=present' >> smoke-result.txt; ok=0; else echo 'cdn=absent' >> smoke-result.txt; fi
          if [ $ok -eq 1 ]; then cp /tmp/shell.html index.html; echo 'publish=ready' >> smoke-result.txt; else echo 'publish=blocked' >> smoke-result.txt; fi
          cat smoke-result.txt
      - name: Commit validated shell and result
        run: |
          git config user.name 'lts-smoke-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add smoke-result.txt index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish validated WIP35-v86'
          git push
