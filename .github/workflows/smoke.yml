name: LTS browser smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published shell and syntax-check
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, urllib.request, re
          url='https://tadhkamnwtsbdozwkyut.supabase.co/rest/v1/lts_public_ui_shell?version=eq.wip35-v67&select=html'
          k='sb_publishable__p3SAbpThUIKtDr7A4llPw_AVkOaNkm'
          req=urllib.request.Request(url,headers={'apikey':k,'Authorization':'Bearer '+k})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          h=data[0]['html']
          open('/tmp/shell.html','w',encoding='utf-8').write(h)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.I|re.S)
          for i,s in enumerate(scripts): open(f'/tmp/script-{i}.js','w',encoding='utf-8').write(s)
          print('shell bytes',len(h),'inline scripts',len(scripts))
          PY
          : > smoke-result.txt
          echo "version=wip35-v67" >> smoke-result.txt
          for f in /tmp/script-*.js; do
            echo "=== $f ===" >> smoke-result.txt
            node --check "$f" >> smoke-result.txt 2>&1
            echo "exit=$?" >> smoke-result.txt
          done
          if grep -q "cdn.jsdelivr.net" /tmp/shell.html; then echo 'cdn=present' >> smoke-result.txt; else echo 'cdn=absent' >> smoke-result.txt; fi
          cat smoke-result.txt
      - name: Commit smoke result
        run: |
          git config user.name 'lts-smoke-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add smoke-result.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record LTS smoke result'
          git push
