name: LTS browser smoke QA
on:
  push:
    branches: [qa/wip35-v125-smoke]
    paths:
      - '.github/lts_smoke_manifest.json'
      - '.github/scripts/lts_smoke_engine.py'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Wealth candidate shell
        run: python .github/scripts/lts_smoke_engine.py
