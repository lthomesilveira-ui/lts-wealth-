name: LTS browser smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validate and stage WIP35-v89
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, urllib.request, re
          url='https://tadhkamnwtsbdozwkyut.supabase.co/rest/v1/lts_public_ui_shell?version=eq.wip35-v89&select=html'
          k='sb_publishable__p3SAbpThUIKtDr7A4llPw_AVkOaNkm'
          req=urllib.request.Request(url,headers={'apikey':k,'Authorization':'Bearer '+k})
          data=json.load(urllib.request.urlopen(req,timeout=30)); h=data[0]['html']
          open('/tmp/shell.html','w',encoding='utf-8').write(h)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.I|re.S)
          for i,s in enumerate(scripts): open(f'/tmp/script-{i}.js','w',encoding='utf-8').write(s)
          print('shell bytes',len(h),'inline scripts',len(scripts))
          PY
          : > smoke-result.txt
          echo 'version=wip35-v89' >> smoke-result.txt
          ok=1
          for f in /tmp/script-*.js; do node --check "$f" >> smoke-result.txt 2>&1; rc=$?; echo "exit=$rc" >> smoke-result.txt; [ $rc -ne 0 ] && ok=0; done
          grep -q 'WIP35-v89 · Fluxo UX' /tmp/shell.html || { echo 'stamp=missing' >> smoke-result.txt; ok=0; }
          grep -q "const BUILD='WIP35-v89 · Browser RPC v1 · Flow UX + card review'" /tmp/shell.html || { echo 'internal_stamp=missing' >> smoke-result.txt; ok=0; }
          [ "$(grep -o 'function fluxo()' /tmp/shell.html | wc -l)" -eq 1 ] || { echo 'single_fluxo_function=failed' >> smoke-result.txt; ok=0; }
          [ "$(grep -o 'function cardSettlementInline(day)' /tmp/shell.html | wc -l)" -eq 1 ] || { echo 'single_cardinline_function=failed' >> smoke-result.txt; ok=0; }
          [ "$(grep -o 'function atualizacoes()' /tmp/shell.html | wc -l)" -eq 1 ] || { echo 'single_updates_function=failed' >> smoke-result.txt; ok=0; }
          grep -q 'flow-v89-ux' /tmp/shell.html || { echo 'ux_css=missing' >> smoke-result.txt; ok=0; }
          grep -q '.fx87-head{position:sticky!important;top:0!important' /tmp/shell.html || { echo 'sticky_header=missing' >> smoke-result.txt; ok=0; }
          grep -q '.fx89-detail-entry{grid-column:3' /tmp/shell.html || { echo 'detail_entry_alignment=missing' >> smoke-result.txt; ok=0; }
          grep -q '.fx89-detail-exit{grid-column:4' /tmp/shell.html || { echo 'detail_exit_alignment=missing' >> smoke-result.txt; ok=0; }
          grep -q 'if(!CARDDETAILFULL)' /tmp/shell.html || { echo 'compact_invoice_default=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Acessar fatura completa' /tmp/shell.html || { echo 'full_invoice_action=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Revisar classificação' /tmp/shell.html || { echo 'classification_action=missing' >> smoke-result.txt; ok=0; }
          grep -q 'Classificação de faturas' /tmp/shell.html || { echo 'updates_classification_queue=missing' >> smoke-result.txt; ok=0; }
          grep -q 'cardclass-save' /tmp/shell.html || { echo 'classification_save_handler=missing' >> smoke-result.txt; ok=0; }
          grep -q "document.querySelector('.fx87-scroll')||document.querySelector('.mscroll')" /tmp/shell.html || { echo 'scroll_preserve=missing' >> smoke-result.txt; ok=0; }
          if grep -q 'Histórico bancário' /tmp/shell.html; then echo 'split_historical=present' >> smoke-result.txt; ok=0; else echo 'split_historical=absent' >> smoke-result.txt; fi
          if grep -q 'Hoje e projeção de caixa' /tmp/shell.html; then echo 'split_future=present' >> smoke-result.txt; ok=0; else echo 'split_future=absent' >> smoke-result.txt; fi
          if grep -q 'Liquidez D+30</div>' /tmp/shell.html; then echo 'old_d30=present' >> smoke-result.txt; ok=0; else echo 'old_d30=absent' >> smoke-result.txt; fi
          if grep -q 'cdn.jsdelivr.net' /tmp/shell.html; then echo 'cdn=present' >> smoke-result.txt; ok=0; else echo 'cdn=absent' >> smoke-result.txt; fi
          if [ $ok -eq 1 ]; then cp /tmp/shell.html index.html; echo 'publish=ready' >> smoke-result.txt; else echo 'publish=blocked' >> smoke-result.txt; fi
          cat smoke-result.txt
      - name: Commit validated shell and result
        run: |
          git config user.name 'lts-smoke-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add smoke-result.txt index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish validated WIP35-v89'
          git push
