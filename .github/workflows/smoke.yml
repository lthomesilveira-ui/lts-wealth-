name: LTS browser smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical Health surface
        run: |
          test -s health/index.html
          test -s health/app.js
          test -s health/styles.css
          node --check health/app.js
          grep -q './styles.css' health/index.html
          grep -q './app.js' health/index.html
          grep -q 'health_workout_sets' health/app.js
          grep -q "status:'uploaded'" health/app.js
          grep -q 'nutrition_date' health/app.js
          grep -q 'apple_health' health/app.js
          grep -q 'polar' health/app.js
          ! grep -q "status:'received'" health/app.js
      - name: Validate candidate shell
        id: validate
        run: python .github/scripts/lts_smoke.py
      - name: Persist failed smoke diagnostics
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          git config user.name 'lts-smoke-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add smoke-result.txt
          if ! git diff --cached --quiet; then
            VERSION=$(head -n 1 smoke-result.txt | cut -d= -f2)
            git commit -m "Record blocked ${VERSION} smoke"
            git push
          fi
      - name: Commit validated shell and result
        if: success()
        run: |
          git config user.name 'lts-smoke-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add smoke-result.txt index.html
          if ! git diff --cached --quiet; then
            VERSION=$(head -n 1 smoke-result.txt | cut -d= -f2)
            git commit -m "Publish validated ${VERSION}"
            git push
          fi
      - name: Deploy validated main
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
