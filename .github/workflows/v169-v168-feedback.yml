name: V169 V168 feedback closure

on:
  workflow_dispatch:
  push:
    branches:
      - work/v169-v168-feedback-20260916
      - main
    paths:
      - 'wip35-v169-candidate.html'
      - 'lts-v168-feedback-package.js'
      - 'lts-v169-v168-feedback-closure.js'
      - 'lts-v169-v168-feedback-closure.css'
      - 'supabase/canonical_v169_v168_feedback_2026_09_16.sql'
      - 'supabase/canonical_v169_flow_audit_contract_fix_2026_09_16.sql'
      - '.github/scripts/lts_v169_v168_feedback_contract.js'
      - '.github/scripts/lts_v169_v168_feedback_gate.js'
      - '.github/workflows/v169-v168-feedback.yml'

permissions:
  contents: read

jobs:
  contract-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V169 static contracts
        run: |
          node --check lts-v169-v168-feedback-closure.js
          node --check .github/scripts/lts_v169_v168_feedback_contract.js
          node --check .github/scripts/lts_v169_v168_feedback_gate.js
          node .github/scripts/lts_v169_v168_feedback_contract.js
      - name: Install isolated browser dependency
        run: |
          npm install --no-save playwright@1.55.0
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Validate V169 in desktop and mobile viewports
        run: |
          python3 -m http.server 8781 >/tmp/lts-v169-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 180s node .github/scripts/lts_v169_v168_feedback_gate.js
      - name: Re-run protected Flow and invoice contracts
        run: |
          python .github/scripts/lts_integrated_flow_gate.py
          python .github/scripts/lts_flow_bank_scope_gate.py
          python .github/scripts/lts_invoice_reading_order_gate.py
          python .github/scripts/lts_flow_documentary_rollforward_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v169-v168-feedback-closure
          path: |
            v169-v168-feedback-result.json
            v169-*.png
            integrated-flow-result.json
            integrated-*.png
            bank-scope-result.json
            bank-scope-*.png
            invoice-reading-order-result.json
            invoice-order-*.png
            flow-documentary-rollforward-result.json
          if-no-files-found: warn
