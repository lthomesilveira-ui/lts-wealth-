name: V293 confirmed schedule and contract reconciliation
on:
  pull_request:
    paths: ['releases/v293/**', 'backend/patches/v293/**', 'backend/operations/**', 'backend/qa/lts_v293*', '.github/scripts/lts_v293*', '.github/workflows/v293.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-and-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve published assets and classification contracts
        run: |
          node .github/scripts/lts_v293_release_contract.cjs
          node .github/scripts/lts_v272_payment_contract.cjs releases/v293/lts-v226-card-composition.js
          python3 backend/qa/lts_v269_classification_contract.py
          node backend/qa/lts_v290_future_import.test.mjs
          node backend/qa/lts_v249_card_normalization.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Serve candidate application
        run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v292-http.log 2>&1 &
      - name: Review editors and six screens across three viewports
        run: node .github/scripts/lts_v293_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v293-homologation-evidence
          path: qa/v293/
