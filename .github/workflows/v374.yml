name: V374 original documentary cycle groups
on:
  pull_request:
    paths: ['releases/v374/**','.github/scripts/*v374*','.github/workflows/v374.yml','backend/patches/v374/**','backend/qa/*v374*','backend/qa/fixtures/v374/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v374_release_contract.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v374-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v374_browser.cjs
      - run: LTS_QA_DIR=qa/v374-workbook LTS_RELEASE=v374 node .github/scripts/lts_v346_composition_browser.cjs
      - run: node .github/scripts/lts_v374_pdf_browser.cjs
      - run: LTS_RELEASE=v374 node .github/scripts/lts_v342_month_rollover_contract.cjs
      - run: LTS_RELEASE=v374 node .github/scripts/lts_v342_month_rollover_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v374-homologation-browser
          path: |
            qa/v374/
            qa/v374-pdf/
            qa/v374-workbook/

  native-documentary-cycles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v374_ci_sql.py > /tmp/v374.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/v374.sql > /tmp/v374-results.log
      - if: failure()
        run: tail -c 8000 /tmp/v374-results.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v374-native-documentary-cycles
          path: /tmp/v374-results.log
