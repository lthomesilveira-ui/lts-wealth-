name: Canonical V157+ product recovery gate

on:
  push:
    branches: [canonical-v157plus-product-recovery]
    paths:
      - canonical-app.html
      - canonical-dashboard-fidelity.css
      - canonical-liquidity.js
      - canonical-liquidity-core.js
      - canonical-flow-v157.js
      - canonical-product-v157.js
      - canonical-presentation-v157.js
      - canonical-capabilities-v161.js
      - canonical-reviewed-input-v112.js
      - supabase/canonical_flow_horizon_and_slice_guard_2026_09_08.sql
      - .github/scripts/lts_canonical_v157plus_browser_gate.js
      - .github/workflows/canonical-v157plus-product-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static product contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('canonical-app.html').read_text()
          loader=Path('canonical-liquidity.js').read_text()
          core=Path('canonical-liquidity-core.js').read_text()
          flow=Path('canonical-flow-v157.js').read_text()
          product=Path('canonical-product-v157.js').read_text()
          presentation=Path('canonical-presentation-v157.js').read_text()
          capabilities=Path('canonical-capabilities-v161.js').read_text()
          reviewed_input=Path('canonical-reviewed-input-v112.js').read_text()
          flow_horizon=Path('supabase/canonical_flow_horizon_and_slice_guard_2026_09_08.sql').read_text()
          gate=Path('.github/scripts/lts_canonical_v157plus_browser_gate.js').read_text()
          assert '<iframe' not in app
          assert 'document.write' not in app
          assert 'canonical-product-v157.js' in loader
          assert 'canonical-flow-v157.js?v=20260909-flow23' in loader
          assert 'canonical-presentation-v157.js' in loader
          assert 'canonical-capabilities-v161.js' in loader
          assert 'canonical-capabilities-v161.js?v=20260909-reports21' in loader
          assert 'canonical-reviewed-input-v112.js?v=20260908-ux19' in loader
          assert 'canonical-flow-v150.js' not in loader
          for x in ['canonical-dashboard-fidelity.css?v=20260910-dashboard24','canonical-liquidity.js?v=20260910-dashboard24','single-owner-history-nature-context-v1','Quanto você gasta — e para quem é cada gasto.','reference-layered-liquidity-commitments-v3','approved-1312x1199-single-screen-v1','executive-cockpit-readable-density-v1','executive-readable-breakpoints-v1','today-commitments-direction-v1','fact-before-asof-projection-after-asof-v1','current-base-scheduled-rsu-restricted-fgts-v1','layered-fact-projection-v2','product-commitments-plus-card-due','v151-first-negative-management-separation-v1','Primeiro caixa negativo','Ponto de gestão','canonical-route-session-continuity-v1','classification-first-guided-document-intake-v1','lts_browser_register_document_v2','v149-evidence-review-readonly-canonical-v1','lts_browser_document_review_queue_v1','updatesOtherActions','data-dashboard-reload','data-mg-shortcut','Receitas','Relatórios','Configurações']:
              assert x in app, x
          for x in ['LTS v1.24','canonical-liquidity-core.js?v=20260908-ux19','UPDATES_CONTRACT','DOCUMENT_REVIEW_CONTRACT','DASHBOARD_DENSITY_CONTRACT','PLANNING_DECISION_CONTRACT','DASHBOARD_VISUAL_CONTRACT','DASHBOARD_RESPONSIVE_CONTRACT','executive-cockpit-readable-density-v1','executive-readable-breakpoints-v1','user-facing-product-language-v1','safe-errors-accessible-controls-readable-mobile-v1','evidence-backed-executive-report-v1']:
              assert x in loader, x
          for rpc in ['lts_browser_liquidity_movement_options_v1','lts_browser_preview_liquidity_movement_v1','lts_browser_apply_liquidity_movement_v1']:
              assert rpc in core, rpc
          for x in ['lts_browser_flow_v8','lts_browser_card_settlement_detail_v2','LTS v1.23','v150-validated-flow-plus-v157-liquidity-v1','historical-opening-from-close-and-net-v1','historical-closed-date-label-close-only-v1','projection-edit-postpone-duplicate-split-cancel-v1','today-marker-without-row-band-v1','future-through-2029-plus-d30-v1','mobile-layer-disclosure-open-closed-invoice-actions-v1','Histórico / período','Histórico / movimentos','Editar','Postergar','Duplicar','Dividir / substituir','Cancelar previsão','inline-card-settlement-v150','Fatura aberta','Fatura fechada','RSUs futuras','Cash Awards futuros','lts_browser_flow_event_editor_v1','lts_browser_flow_mutate_v1']:
              assert x in flow, x
          assert '.fv-table tr.today td{background:#fffaf0}' not in flow
          for x in ['1500','p_to + 30','all_src','requested-period-plus-30-days-v1','future Flow cache could not cover requested range']:
              assert x in flow_horizon, x
          for x in ['Dinheiro em contas','Contas + curto prazo','RSUs vested','FGTS','Despesas (mês)','Evolução da Liquidez','Quanto você gastou — e como isso evoluiu.','Mês a mês','Ano a ano','Cobertura do histórico','Quanto você tem, quanto deve e quanto é seu.','Conferência de fatura, não análise de gasto.']:
              assert x in product, x
          assert "const ROUTES=['Patrimônio','Cartões']" in product
          for x in ['presentation-polish-v2','safe-errors-accessible-controls-readable-mobile-v1','__LTS_V157_PRESENTATION_STATUS','__LTS_V157_POLISH_STATUS']:
              assert x in presentation, x
          for x in ['LTS v1.21','__LTS_CANONICAL_CAPABILITIES_STATUS','session-persisted-management-pane-v1','evidence-backed-executive-report-v1','Relatório executivo','Hoje e curto prazo','Caixa projetado · quando agir','Evolução das despesas','Qualidade, controle e rastreabilidade','data-mg-shortcut','Planejamento','Entradas & compromissos','Recorrências','Simulações','Conciliação','Relatórios','Backup & restauração','Configurações & integrações','Financiamentos','Documentos']:
              assert x in capabilities, x
          for x in ['LTS v1.19','review-before-explicit-apply-v1','Lançamento por texto','lts_browser_apply_reviewed_input_v1','Nada foi gravado.','requires_explicit_confirmation']:
              assert x in reviewed_input, x
          for x in ['lts-canonical-definition-of-done-receipt-v1','route_session_continuity','document_intake','AUTOMATED_GATE_PASS_REAL_E2E_OPEN']:
              assert x in gate, x
          for s in [loader,core,flow,product,presentation,capabilities,reviewed_input]:
              assert 'MutationObserver' not in s
              assert 'setInterval(' not in s
          print('static V157+ product contract ok')
          PY
          node --check canonical-liquidity.js
          node --check canonical-liquidity-core.js
          node --check canonical-flow-v157.js
          node --check canonical-product-v157.js
          node --check canonical-presentation-v157.js
          node --check canonical-capabilities-v161.js
          node --check canonical-reviewed-input-v112.js
          node --check .github/scripts/lts_canonical_v157plus_browser_gate.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Browser product contract
        run: node .github/scripts/lts_canonical_v157plus_browser_gate.js
      - name: Upload V157+ recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v157plus-product-recovery
          if-no-files-found: warn
          path: |
            canonical-app.html
            canonical-dashboard-fidelity.css
            canonical-liquidity.js
            canonical-liquidity-core.js
            canonical-flow-v157.js
            canonical-product-v157.js
            canonical-presentation-v157.js
            canonical-capabilities-v161.js
            canonical-reviewed-input-v112.js
            canonical-definition-of-done-receipt.json
            canonical-*.png
