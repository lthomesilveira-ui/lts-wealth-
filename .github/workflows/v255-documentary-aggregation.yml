name: V255 documentary aggregation validation
on:
  push:
    branches: [work/v255-documentary-daily-aggregation]
  pull_request:
    paths:
      - backend/patches/*v255*
      - backend/qa/*v255*
      - .github/workflows/v255-documentary-aggregation.yml
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preserve frozen sources and guarded documentary rules
        run: |
          node backend/qa/lts_v245_source_gate.js
          node backend/qa/lts_v246_source_gate.js
          node backend/qa/lts_v255_source_gate.js
