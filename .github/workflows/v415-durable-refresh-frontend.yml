name: V415 durable refresh interface
on:
  pull_request:
    paths: ['lts-v415-product-refresh.js','releases/v415/**','mobile/current.json','.github/scripts/*v415*','.github/workflows/v415-durable-refresh-frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      LTS_MOBILE_RELEASE: v440
      LTS_FLOW_RELEASE: v415
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v415_release_contract.cjs
      - run: node --test .github/scripts/lts_v415_refresh_test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v415-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v415_refresh_current_entry.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v415-durable-refresh-browser-evidence
          path: qa/v415-refresh/
