name: Synthetic Open Finance timestamp QA (PostgreSQL 16)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/p16-freshness/**'
      - '.github/workflows/p16-postgres16.yml'
permissions:
  contents: read
jobs:
  freshness-postgres16:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: qa-only
      P16_QA_ALLOW_DISPOSABLE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: tests/p16-freshness
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check additive contract
        run: python test_static.py
      - name: Install synthetic database test client
        run: python -m pip install --requirement requirements.txt
      - name: Test timestamp contract in disposable database
        shell: bash
        run: |
          set -euo pipefail
          python test_postgres.py 2>&1 | tee postgres16-result.txt
      - name: Upload synthetic test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p16-freshness-postgres16
          path: tests/p16-freshness/postgres16-result.txt
          if-no-files-found: ignore
