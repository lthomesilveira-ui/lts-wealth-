name: V451 complete reader recovery
on:
  pull_request:
    paths: ['releases/v451/**','backend/tools/complete_reader_recovery_v451/**','.github/scripts/lts_v451*','.github/workflows/v451-complete-reader-recovery.yml','mobile/current.json']
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      LTS_MOBILE_RELEASE: v484
      LTS_FLOW_RELEASE: v442
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable financial content and bounded read recovery
        run: |
          python3 backend/tools/complete_reader_recovery_v451/build.py --check
          node .github/scripts/lts_v451_release_contract.cjs
          node --test .github/scripts/lts_v449_refresh_test.cjs .github/scripts/lts_v451_clock_test.cjs .github/scripts/lts_v451_transport_test.cjs
      - name: Authenticated-flow fixtures in mobile and desktop Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/v451-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
          node .github/scripts/lts_v451_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v451-complete-reader-recovery
          retention-days: 14
          path: qa/v451/
