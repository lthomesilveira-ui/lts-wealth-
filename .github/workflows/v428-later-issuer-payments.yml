name: V428 reviewed cycle survives later issuer payments
on:
  pull_request:
    paths: ['backend/patches/v428/**','backend/qa/lts_v428*','backend/qa/fixtures/v428/**','.github/workflows/v428-later-issuer-payments.yml']
permissions:
  contents: read
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact reviewed readers and cycle identity
        run: |
          python3 backend/qa/lts_v428_ci_sql.py > /tmp/lts-v428.sql
          psql -X -v ON_ERROR_STOP=1 -At -f /tmp/lts-v428.sql > /tmp/lts-v428-result.log
          tail -n 1 /tmp/lts-v428-result.log
      - if: failure()
        run: tail -c 12000 /tmp/lts-v428-result.log || true
