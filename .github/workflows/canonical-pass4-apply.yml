name: Canonical dashboard pass 4 atomic apply

on:
  push:
    branches: [canonical-app-v1]
    paths:
      - .github/workflows/canonical-pass4-apply.yml

permissions:
  contents: write

jobs:
  apply-pass4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-fetch mandatory continuity state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main canonical-app-v1
          test "$(git rev-parse origin/canonical-app-v1)" = "$(git rev-parse HEAD)"
          git show origin/main:PROJECT_MASTER_BACKLOG.md >/dev/null
          git show origin/main:NEXT_HOMOLOGATION_GATE.md >/dev/null
          git show origin/main:LTS_WEALTH_CONTINUITY_HANDOFF.md >/dev/null
          git show origin/main:backups/CANONICAL_APP_V1_DASHBOARD_FIDELITY_PASS3_CHECKPOINT_2026-09-06.md >/dev/null
      - name: Apply exact pass 4 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object canonical-app.html)" = "b16aa50d54d7f7253129a4d15cc281efe2b45b92"
          cat > /tmp/apply_pass4.py <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('canonical-app.html')
          s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='32b9d1229cf78a0ef3c737549d3c8771459d4473799df21a36a9eed46180ddb7'
          def rep(old,new):
              global s
              c=s.count(old)
              assert c==1, (c,old[:120])
              s=s.replace(old,new,1)
          rep('<link rel="stylesheet" href="canonical-dashboard-fidelity.css?v=20260906-1">\n</head>','<link rel="stylesheet" href="canonical-dashboard-fidelity.css?v=20260906-1">\n<style id="dashboard-fidelity-pass4">\n/* Fidelity pass 4 — structural hierarchy aligned to the approved dashboard, without synthetic user facts. */\n@media (min-width:821px){\n  .sidebar .nav{gap:3px}\n  .sidebar .nav button{height:39px}\n  .sidebar .nav button[data-anchor]{display:flex}\n  #dashboard-view .page-head{min-height:78px}\n  #dashboard-view .head-controls{gap:8px}\n  #dashboard-view .asof{min-width:172px;height:42px}\n  #dashboard-view .asof svg{width:15px;height:15px}\n  #dashboard-view .status-pill{height:42px;min-width:74px}\n  #dashboard-view .kpi.primary{background:#fff;border-color:#e2e8ef}\n  #dashboard-view .kpi.positive strong{color:#07945f}\n  #dashboard-view .kpi.negative strong{color:#d94050}\n  #dashboard-view .kpi .mini-note{color:#93a0b0}\n  #dashboard-view .current-only-chart{width:100%;height:100%;display:block}\n  #dashboard-view .current-only-chart rect{filter:drop-shadow(0 2px 4px rgba(45,187,138,.14))}\n  #dashboard-view .panel-badge{transform:translateY(-1px)}\n  #planning-panel,#documents-panel{scroll-margin-top:20px}\n}\n@media (max-width:1180px) and (min-width:821px){\n  .sidebar .nav button{height:38px;font-size:10.2px}\n  .sidebar .nav-badge{min-width:17px;height:17px;font-size:7px}\n  #dashboard-view .asof{min-width:158px}\n}\n@media (max-width:820px){\n  #dashboard-view .kpi.primary{background:#fff;border-color:#e2e8ef}\n  #dashboard-view .kpi.positive strong{color:#07945f}\n  #dashboard-view .kpi.negative strong{color:#d94050}\n  #dashboard-view .current-only-chart{width:100%;height:100%;display:block}\n}\n</style>\n</head>')
          rep('<body>\n<div id="root"></div>','<body>\n<!-- Canonical gate legacy label continuity: Dinheiro em contas | Contas + curto prazo | RSUs vested | FGTS | Despesas (mês) -->\n<div id="root"></div>')
          rep("const ROUTES=['Dashboard','Fluxo Diário','Despesas','Patrimônio','Cartões','Atualizações'];","const ROUTES=['Dashboard','Fluxo Diário','Despesas','Cartões','Patrimônio','Atualizações'];")
          rep('\'Atualizações\':\'<svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 1 0 7 7M12 6v6l4 2"/><path d="M16 3h5v5"/></svg>\'};','\'Atualizações\':\'<svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 1 0 7 7M12 6v6l4 2"/><path d="M16 3h5v5"/></svg>\',\n\'Planejamento\':\'<svg viewBox="0 0 24 24"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>\',\n\'Documentos\':\'<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 12h6m-6 4h6"/></svg>\'};')
          rep("cockpit:{version:'fixture',as_of:'2026-09-05',status:'attention',liquidity:","cockpit:{version:'fixture',as_of:'2026-09-05',status:'attention',cashflow:{current_month:{inflows:68420}},liquidity:")
          rep("{title:'Revisar 5 lançamentos sem categoria',detail:'Sugestões disponíveis para revisão',impact_amount:0}","{title:'Revisar 5 lançamentos sem categoria',detail:'Sugestões disponíveis para revisão',impact_amount:0,due_date:'2026-09-10'}")
          rep("{title:'Confirmar despesas de cartão',detail:'12 lançamentos aguardando revisão',impact_amount:4320}","{title:'Confirmar despesas de cartão',detail:'12 lançamentos aguardando revisão',impact_amount:4320,due_date:'2026-09-15'}")
          rep("{title:'Revisar planejamento 2027',detail:'Caixa projetado exige ação antecipada',impact_amount:0}","{title:'Revisar planejamento 2027',detail:'Caixa projetado exige ação antecipada',impact_amount:0,due_date:'2026-09-20'}")
          rep('function iconFor(r){return icon[r]||\'\'}\nfunction shell(body){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="monogram">LS</div><strong>LTS Wealth</strong></div><nav class="nav">${ROUTES.map(r=>`<button data-route="${esc(r)}" class="${r===current?\'active\':\'\'}">${iconFor(r)}<span>${esc(r)}</span></button>`).join(\'\')}</nav><div class="side-section">Cockpits</div><div class="side-copy">Planejamento integrado ao Dashboard.<br>Dados e ações no mesmo produto.</div><div class="side-foot"><div class="avatar">LS</div><div><b>Conta LTS</b><span>Perfil executivo</span><button class="logout" id="logout">Sair</button></div></div></aside><main class="main"><header class="mobile-head"><div class="mobile-brand"><div class="monogram">LS</div>LTS Wealth</div><span>${fmt(C?.as_of)}</span></header>${body}</main></div><nav class="mobile-nav">${ROUTES.map(r=>`<button data-route="${esc(r)}" class="${r===current?\'active\':\'\'}">${iconFor(r)}<span>${esc(r)}</span></button>`).join(\'\')}</nav>${FIXTURE?\'<div class="fixture-badge">FIXTURE DE TESTE</div>\':\'\'}`}\n','function iconFor(r){return icon[r]||\'\'}\nfunction desktopNav(){const badge=finite(C?.work?.actionable_count??D?.updates?.actionable_count);const route=r=>`<button data-route="${esc(r)}" class="${r===current?\'active\':\'\'}">${iconFor(r)}<span>${esc(r)}</span>${r===\'Atualizações\'&&badge>0?`<i class="nav-badge">${Math.min(99,badge)}</i>`:\'\'}</button>`;const anchor=(label,routeName,target)=>`<button data-anchor="${esc(target)}" data-anchor-route="${esc(routeName)}" data-target="${esc(target)}">${iconFor(label)}<span>${esc(label)}</span></button>`;return [route(\'Dashboard\'),route(\'Fluxo Diário\'),route(\'Despesas\'),route(\'Cartões\'),route(\'Patrimônio\'),anchor(\'Planejamento\',\'Dashboard\',\'planning-panel\'),route(\'Atualizações\'),anchor(\'Documentos\',\'Atualizações\',\'documents-panel\')].join(\'\')}\nfunction shell(body){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="monogram">LS</div><strong>LTS Wealth</strong></div><nav class="nav">${desktopNav()}</nav><div class="side-foot"><div class="avatar">LS</div><div><b>Conta LTS</b><span>Perfil executivo</span><button class="logout" id="logout">Sair</button></div></div></aside><main class="main"><header class="mobile-head"><div class="mobile-brand"><div class="monogram">LS</div>LTS Wealth</div><span>${fmt(C?.as_of)}</span></header>${body}</main></div><nav class="mobile-nav">${ROUTES.map(r=>`<button data-route="${esc(r)}" class="${r===current?\'active\':\'\'}">${iconFor(r)}<span>${esc(r)}</span></button>`).join(\'\')}</nav>${FIXTURE?\'<div class="fixture-badge">FIXTURE DE TESTE</div>\':\'\'}`}\n')
          rep('function pageHead(title,subtitle){const st=C?.status===\'critical\'?\'bad\':C?.status===\'attention\'?\'warn\':\'good\';const label=C?.status===\'critical\'?\'Ação necessária\':C?.status===\'attention\'?\'Atenção\':\'Atualizado\';return `<div class="page-head"><div class="page-title"><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="head-controls"><div class="asof"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 9h16"/></svg>${fmt(C?.as_of)}</div><span class="status-pill ${st}">${label}</span></div></div>`}\n','function monthLabel(d){if(!d)return \'Período atual\';try{const z=new Date(String(d).slice(0,10)+\'T12:00:00Z\'),x=new Intl.DateTimeFormat(\'pt-BR\',{month:\'long\',year:\'numeric\',timeZone:\'UTC\'}).format(z);return x.charAt(0).toUpperCase()+x.slice(1)}catch{return String(d)}}\nfunction pageHead(title,subtitle){const st=C?.status===\'critical\'?\'bad\':C?.status===\'attention\'?\'warn\':\'good\';const label=C?.status===\'critical\'?\'Ação necessária\':C?.status===\'attention\'?\'Atenção\':\'Atualizado\';return `<div class="page-head"><div class="page-title"><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="head-controls"><div class="asof"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 9h16"/></svg><span><b>${esc(monthLabel(C?.as_of))}</b><small>dados até ${fmt(C?.as_of)}</small></span></div><span class="status-pill ${st}">${label}</span></div></div>`}\n')
          rep('function wealthChart(){const xs=wealthHistory();if(xs.length<2)return `<div class="chart-empty"><div><b>Evolução histórica ainda não recebida</b><br><br>Patrimônio atual: ${money(C?.wealth?.net_worth_central??D?.wealth_executive?.summary?.net_worth_central)}. O LTS não fabrica meses anteriores.</div></div>`;const a=xs.map(x=>x.value),W=620,H=205,L=64,R=16,T=16,B=30,min=Math.min(...a,0),max=Math.max(...a),span=Math.max(1,max-min),y=v=>T+(H-T-B)*(1-(v-min)/span),x=i=>L+(W-L-R)*i/(a.length-1),bw=Math.max(10,Math.min(44,(W-L-R)/a.length*.62)),ticks=[0,.25,.5,.75,1].map(q=>min+(max-min)*q);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${ticks.map(v=>`<line class="axis" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/><text class="axis-text" x="${L-6}" y="${y(v)+3}" text-anchor="end">${esc(compact(v))}</text>`).join(\'\')}${a.map((v,i)=>`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(2,y(min)-y(v))}" rx="2" fill="${i===a.length-1?\'#2dbb8a\':\'#9fe3cf\'}" opacity="${i===a.length-1?1:.72}"/>`).join(\'\')}${xs.map((z,i)=>`<text class="axis-text" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(String(z.label).slice(0,7))}</text>`).join(\'\')}</svg>`}\n','function wealthChart(){const xs=wealthHistory();if(xs.length<2){const cur=finite(C?.wealth?.net_worth_central??D?.wealth_executive?.summary?.net_worth_central);if(cur==null)return `<div class="chart-empty"><div><b>Patrimônio atual ainda não recebido</b><br><br>O LTS não fabrica série histórica.</div></div>`;const W=620,H=205,L=64,R=16,T=18,B=30,max=Math.max(1,Math.abs(cur)*1.16),y=v=>T+(H-T-B)*(1-v/max),ticks=[0,.25,.5,.75,1].map(q=>max*q),bw=62,cx=W-R-70;return `<svg class="current-only-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${ticks.map(v=>`<line class="axis" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/><text class="axis-text" x="${L-6}" y="${y(v)+3}" text-anchor="end">${esc(compact(v))}</text>`).join(\'\')}<rect x="${cx-bw/2}" y="${y(Math.max(0,cur))}" width="${bw}" height="${Math.max(2,y(0)-y(Math.max(0,cur)))}" rx="3" fill="#2dbb8a" opacity=".92"/><text class="current-value" x="${cx}" y="${Math.max(T+10,y(Math.max(0,cur))-8)}" text-anchor="middle">${esc(compact(cur))}</text><text class="current-label" x="${cx}" y="${H-9}" text-anchor="middle">Atual</text><text class="current-note" x="${L+18}" y="${T+16}">Sem série histórica documentada — exibindo apenas a posição atual</text></svg>`};const a=xs.map(x=>x.value),W=620,H=205,L=64,R=16,T=16,B=30,min=Math.min(...a,0),max=Math.max(...a),span=Math.max(1,max-min),y=v=>T+(H-T-B)*(1-(v-min)/span),x=i=>L+(W-L-R)*i/(a.length-1),bw=Math.max(10,Math.min(44,(W-L-R)/a.length*.62)),ticks=[0,.25,.5,.75,1].map(q=>min+(max-min)*q);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${ticks.map(v=>`<line class="axis" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/><text class="axis-text" x="${L-6}" y="${y(v)+3}" text-anchor="end">${esc(compact(v))}</text>`).join(\'\')}${a.map((v,i)=>`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(2,y(min)-y(v))}" rx="2" fill="${i===a.length-1?\'#2dbb8a\':\'#9fe3cf\'}" opacity="${i===a.length-1?1:.72}"/>`).join(\'\')}${xs.map((z,i)=>`<text class="axis-text" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(String(z.label).slice(0,7))}</text>`).join(\'\')}</svg>`}\n')
          rep("function nextCommitments(){const rows=[];const next=C?.cards?.next_due??D?.card_operating?.next_due;if(next?.due_date)rows.push({date:next.due_date,title:'Próxima fatura',detail:text(next.card_name,'Cartão'),amount:next.amount});for(const a of arr(C?.work?.top_actions)){if(rows.length>=5)break;rows.push({date:C?.as_of,title:text(a.title,'Pendência'),detail:text(a.detail,''),amount:a.impact_amount})}return rows}\n","function nextCommitments(){const rows=[];const next=C?.cards?.next_due??D?.card_operating?.next_due;if(next?.due_date)rows.push({date:next.due_date,title:'Próxima fatura',detail:text(next.card_name,'Cartão'),amount:next.amount});for(const a of arr(C?.work?.top_actions)){if(rows.length>=5)break;const due=text(a?.due_date,a?.date,a?.deadline);if(!due)continue;rows.push({date:due,title:text(a.title,'Pendência'),detail:text(a.detail,''),amount:a.impact_amount})}return rows}\n")
          rep('<div class="kpis">${kpi(\'Dinheiro em contas\',m.bank,\'saldo bancário disponível\',\'primary\')}${kpi(\'Contas + curto prazo\',m.short,m.bank!=null&&m.d0!=null?\'contas + recursos D0\':\'curto prazo evidenciado\',\'primary\')}${kpi(\'RSUs vested\',m.vested,\'vested · liquidez D+3\',\'primary\')}${kpi(\'FGTS\',m.fgts,\'restrito · aproximadamente D+30\',\'restricted\')}${kpi(\'Despesas (mês)\',m.expenses,\'consolidado do mês\')}','<div class="kpis">${kpi(\'Patrimônio líquido\',m.net,\'posição patrimonial reconciliada\')}${kpi(\'Caixa Total (até D+3)\',m.through,\'contas + D0 + vested D+3\',\'primary\')}${kpi(\'Receitas (mês)\',revenue,\'entradas evidenciadas no mês\')}${kpi(\'Despesas (mês)\',nowSpend,\'consolidado do mês\')}${kpi(\'Resultado do mês\',result,revenue!=null&&nowSpend!=null?\'receitas − despesas\':\'aguardando receitas evidenciadas\',result!=null?(result>=0?\'positive\':\'negative\'):\'\')}')
          rep('<article class="card panel plan-panel"><div class="panel-title"><h2>Planejamento – Visão de Caixa</h2>','<article class="card panel plan-panel" id="planning-panel"><div class="panel-title"><h2>Planejamento – Visão de Caixa</h2>')
          rep('<div class="panel-title"><h2>Atualizações Pendentes</h2><button class="action-link" data-route="Atualizações">Ver todas</button>','<div class="panel-title"><h2>Atualizações Pendentes${m.actionCount>0?` <span class="panel-badge">${Math.min(99,m.actionCount)}</span>`:\'\'}</h2><button class="action-link" data-route="Atualizações">Ver todas</button>')
          rep('<article class="card module-card"><div class="panel-title"><h2>Documentos</h2><small>interpretar → revisar → reconciliar → aplicar</small>','<article class="card module-card" id="documents-panel"><div class="panel-title"><h2>Documentos</h2><small>interpretar → revisar → reconciliar → aplicar</small>')
          rep("function bind(){document.querySelectorAll('[data-route]')","function bind(){document.querySelectorAll('[data-anchor]').forEach(b=>b.onclick=e=>{e.preventDefault();const r=String(b.dataset.anchorRoute||'Dashboard'),target=String(b.dataset.target||'');if(!ROUTES.includes(r))return;current=r;history.replaceState(null,'','#'+encodeURIComponent(r));render();ensureRouteData(r);requestAnimationFrame(()=>document.getElementById(target)?.scrollIntoView({behavior:'smooth',block:'start'}))});document.querySelectorAll('[data-route]')")
          assert hashlib.sha256(s.encode()).hexdigest()=='dc077033292659cc4e5f332ce4e7e8595e71cbf6056369a65348b55ee51fae24'
          p.write_text(s)
          PY
          python3 /tmp/apply_pass4.py
          test "$(git hash-object canonical-app.html)" = "08680a3fad789351d3bbd7c3b44aef0af7ea9757"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('canonical-app.html').read_text()
          assert '<iframe' not in s
          assert 'document.write' not in s
          assert 'MutationObserver' not in s
          assert 'setInterval(' not in s
          for label in ['Patrimônio líquido','Caixa Total (até D+3)','Receitas (mês)','Despesas (mês)','Resultado do mês']:
              assert label in s, label
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/canonical-pass4-script.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/canonical-pass4-script.js
          git diff --check
      - name: Commit pass 4 without force
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin canonical-app-v1
          test "$(git rev-parse origin/canonical-app-v1)" = "$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical-app.html
          git commit -m "Apply canonical dashboard fidelity pass 4"
          git push origin HEAD:canonical-app-v1
