name: V343 documentary inflows excluded from spending
on:
  pull_request:
    paths: ['backend/patches/v343/**','backend/qa/*v343*','backend/qa/fixtures/v343*','.github/workflows/v343.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-nonspend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v343_ci_sql.py > /tmp/lts-v343.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/lts-v343.sql > /tmp/lts-v343-result.log
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(s)for s in Path('/tmp/lts-v343-result.log').read_text().splitlines()if s.startswith('{')]
          assert len(rows)==1 and rows[0]['pass'] and rows[0]['version']==343
          assert rows[0]['rejection_cases']==27
          assert all(v is True for k,v in rows[0].items()if k not in ['version','rejection_cases'])
          print(json.dumps(rows[0]))
          PY
