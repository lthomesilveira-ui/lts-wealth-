name: V174 V173 deep expense audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/v174-v173-user-review-20260918
    paths:
      - 'wip35-v174-candidate.html'
      - 'lts-v174-v173-review.js'
      - 'lts-v174-v173-review.css'
      - 'supabase/migrations/20260918152137_v174_expense_deep_audit_readers.sql'
      - 'backups/V174_*'
      - '.github/scripts/lts_v174_v173_review_contract.js'
      - '.github/scripts/lts_v174_v173_review_gate.js'
      - '.github/workflows/v174-v173-review.yml'

permissions:
  contents: read

jobs:
  contract-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V174 static contracts
        run: |
          node --check lts-v174-v173-review.js
          node --check .github/scripts/lts_v174_v173_review_contract.js
          node --check .github/scripts/lts_v174_v173_review_gate.js
          node .github/scripts/lts_v174_v173_review_contract.js
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.55.0
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Validate V174 desktop and mobile
        run: |
          python3 -m http.server 8784 >/tmp/lts-v174-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 240s node .github/scripts/lts_v174_v173_review_gate.js
      - name: Re-run protected contracts
        run: |
          node .github/scripts/lts_v173_v172_feedback_contract.js
          node .github/scripts/lts_v172_v171_review_contract.js
          node .github/scripts/lts_v171_v170_review_contract.js
          node .github/scripts/lts_v170_v169_review_contract.js
          python .github/scripts/lts_integrated_flow_gate.py
          python .github/scripts/lts_flow_bank_scope_gate.py
          python .github/scripts/lts_invoice_reading_order_gate.py
          python .github/scripts/lts_flow_documentary_rollforward_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v174-v173-deep-expense-audit
          path: |
            v174-v173-review-result.json
            v174-*.png
            integrated-flow-result.json
            integrated-*.png
            bank-scope-result.json
            bank-scope-*.png
            invoice-reading-order-result.json
            invoice-order-*.png
            flow-documentary-rollforward-result.json
          if-no-files-found: warn
