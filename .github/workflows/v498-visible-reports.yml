name: V498 visible reports and invoice details
on:
  pull_request:
    paths:
      - 'releases/v498/**'
      - 'mobile/current.json'
      - '.github/scripts/lts_v497_expense_navigation.cjs'
      - '.github/scripts/lts_v498_visible_reports.cjs'
      - '.github/workflows/v498-visible-reports.yml'
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      LTS_EXPENSE_NAV_RELEASE: v498
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          node .github/scripts/lts_v497_expense_navigation.cjs
          node .github/scripts/lts_v498_visible_reports.cjs
