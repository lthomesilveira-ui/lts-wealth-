name: PostgreSQL 17 synthetic classifications
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/classifications/**'
jobs:
  synthetic-classifications:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wealth_synthetic_classifications
          POSTGRES_USER: wealth_synthetic_classifications
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealth_synthetic_classifications -d wealth_synthetic_classifications"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Static allowlist and artifact checks
        run: python tests/classifications/validate_static.py
      - name: Execute synthetic PostgreSQL envelope and marker
        run: python tests/classifications/run_postgres17.py --allow-fresh-synthetic-postgres17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-classifications-postgres17
          path: tests/classifications/results/
          if-no-files-found: warn
