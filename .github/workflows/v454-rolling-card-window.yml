name: V454 rolling card spending window
on:
  pull_request:
    paths: ['releases/v454/**','backend/tools/rolling_card_window_v454/**','.github/scripts/lts_v454_browser.cjs','.github/workflows/v454-rolling-card-window.yml']
permissions:
  contents: read
jobs:
  rolling-window:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend/qa/v442 --ignore-scripts
      - run: python3 backend/tools/rolling_card_window_v454/build.py --check
      - run: node backend/tools/rolling_card_window_v454/test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium webkit
      - name: Full application in desktop and mobile, November and December
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/v454-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
          node .github/scripts/lts_v454_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v454-rolling-card-window
          retention-days: 14
          path: qa/v454/
