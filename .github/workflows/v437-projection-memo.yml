name: V437 statement projection memo
on:
  pull_request:
    paths:
      - 'backend/qa/fixtures/v437/**'
      - 'backend/qa/fixtures/v438/**'
      - 'backend/tools/projection_memo_v437/**'
      - 'supabase/migrations/*_v437_statement_projection_memo.sql'
      - 'supabase/migrations/*_v438_guarded_projection_read.sql'
      - '.github/workflows/v437-projection-memo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
    steps:
      - uses: actions/checkout@v4
      - name: Compose exact migration and synthetic boundaries
        run: python3 backend/tools/projection_memo_v437/test_v438_sql.py > /tmp/v437.sql
      - name: Verify exact JSON, invalidation and unchanged access
        run: |
          createdb v437_memo
          psql -X -d v437_memo -v ON_ERROR_STOP=1 -At -f /tmp/v437.sql > /tmp/v437.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v437-synthetic-postgres17-proof
          path: /tmp/v437.log
