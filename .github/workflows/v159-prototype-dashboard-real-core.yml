name: LTS v159 prototype dashboard real core
on:
  push:
    branches: [v159-prototype-dashboard-real-core, main]
    paths:
      - 'wip35-v159-candidate.html'
      - '.github/workflows/v159-prototype-dashboard-real-core.yml'
      - 'homologacao-current.json'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Static contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('wip35-v159-candidate.html').read_text(encoding='utf-8')
          for x in ['wip35-v156-candidate.html?','v159-prototype-dashboard-real-core-v4','visual_baseline:\'v156\'','data_state_precedes_legacy_login:true','query_forwarded:true','auth_truthful:true','mobile_nav_six_fixed:true','synthetic_financial_values_added:false','v159-auth-mode','repeat(6,minmax(0,1fr))','.candidate-badge{display:none!important}']:
              assert x in s, x
          assert "setInterval(" not in s
          assert "new MutationObserver" not in s
          assert "index.html?v158-native-core" not in s
          print('v159_static=PASS')
          PY
      - name: Install Playwright browsers
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Serve
        run: python3 -m http.server 8000 >/tmp/lts-v159-http.log 2>&1 &
      - name: Prototype Dashboard + six-route gate
        run: |
          node <<'NODE'
          const { chromium, webkit }=require('playwright');
          const fs=require('fs');
          async function run(browserType,name,width,height){
            const browser=await browserType.launch({headless:true});
            const page=await browser.newPage({viewport:{width,height}});
            await page.goto('http://127.0.0.1:8000/wip35-v159-candidate.html?runtimeFixture=1&visualFixture=1',{waitUntil:'domcontentloaded',timeout:25000});
            await page.waitForFunction(()=>window.__LTS_V159_STATUS?.visual_baseline==='v156',null,{timeout:12000});
            const host=page.frameLocator('#prototype');
            await host.locator('.kpis .kpi').first().waitFor({state:'visible',timeout:18000});
            await page.waitForFunction(()=>document.getElementById('prototype')?.contentWindow?.__LTS_V156_DATA_STATE?.patchCount>=1,null,{timeout:18000});
            await page.waitForFunction(()=>window.__LTS_V159_STATUS?.state==='app'&&window.__LTS_V159_STATUS?.dataReady===true,null,{timeout:12000});
            const labels=await host.locator('.kpi label').allTextContents();
            for(const x of ['Dinheiro em contas','Contas + curto prazo','RSUs vested','FGTS','Despesas (mês)']) if(!labels.includes(x)) throw new Error(name+': missing KPI '+x+' '+JSON.stringify(labels));
            const title=await page.title();if(!/v159/i.test(title)) throw new Error(name+': wrong title '+title);
            const outerBadge=await page.locator('#v159Badge').textContent();if(!/v159/i.test(outerBadge||'')) throw new Error(name+': outer badge '+outerBadge);
            const selector=width<=820?'#mobileNav [data-route]':'#sideNav [data-route]';
            const routes=[];
            for(const dest of ['Fluxo Diário','Despesas','Patrimônio','Cartões','Atualizações','Dashboard']){
              const b=host.locator(selector).filter({hasText:dest}).first();
              await b.click();await page.waitForTimeout(950);
              const routeState=await page.evaluate(()=>document.getElementById('prototype')?.contentWindow?.__LTS_V156_ROUTE_STATE||null);
              if(!routeState||routeState.dest!==dest||routeState.ok!==true) throw new Error(name+': route '+dest+' failed '+JSON.stringify(routeState));
              routes.push({dest,state:routeState});
            }
            const dims=await page.evaluate(()=>{const f=document.getElementById('prototype'),d=f.contentDocument,ib=d.querySelector('.candidate-badge');return {outer:{sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth},inner:{sw:d.documentElement.scrollWidth,cw:d.documentElement.clientWidth,nav:[...d.querySelectorAll('#mobileNav [data-route]')].map(x=>{const r=x.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width,t:x.textContent.trim()}}),legacyBadgeDisplay:ib?getComputedStyle(ib).display:null,authMode:d.body.classList.contains('v159-auth-mode'),kpis:d.querySelectorAll('.kpi').length},status:{version:window.__LTS_V159_STATUS.version,state:window.__LTS_V159_STATUS.state,dataReady:window.__LTS_V159_STATUS.dataReady}}});
            if(dims.outer.sw>dims.outer.cw+4||dims.inner.sw>dims.inner.cw+4) throw new Error(name+': overflow '+JSON.stringify(dims));
            if(dims.status.state!=='app'||dims.status.dataReady!==true||dims.inner.authMode) throw new Error(name+': prototype masked '+JSON.stringify(dims));
            if(width<=820){if(dims.inner.nav.length!==6) throw new Error(name+': nav count '+dims.inner.nav.length);for(const n of dims.inner.nav){if(n.l<-1||n.r>width+1||n.w<40) throw new Error(name+': clipped nav '+JSON.stringify(n));}}
            if(dims.inner.legacyBadgeDisplay!=='none') throw new Error(name+': legacy badge visible '+JSON.stringify(dims.inner));
            if(dims.inner.kpis!==5) throw new Error(name+': KPI count '+dims.inner.kpis);
            await page.screenshot({path:`v159-${name}.png`,fullPage:true});
            await browser.close();return {labels,routes,dims};
          }
          (async()=>{
            const result={authenticated_e2e:false};
            result.desktop=await run(chromium,'desktop',1312,1199);
            result.iphone=await run(webkit,'iphone',390,844);
            fs.writeFileSync('v159-result.json',JSON.stringify(result,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Unauthenticated truthfulness smoke
        run: |
          node <<'NODE'
          const { webkit }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('http://127.0.0.1:8000/wip35-v159-candidate.html',{waitUntil:'domcontentloaded',timeout:25000});
            await page.waitForFunction(()=>window.__LTS_V159_STATUS,null,{timeout:12000});
            await page.waitForTimeout(10000);
            const out=await page.evaluate(()=>{const f=document.getElementById('prototype'),d=f?.contentDocument;return {status:{version:window.__LTS_V159_STATUS?.version,state:window.__LTS_V159_STATUS?.state,checks:window.__LTS_V159_STATUS?.checks,dataReady:window.__LTS_V159_STATUS?.dataReady,synthetic:window.__LTS_V159_STATUS?.synthetic_financial_values_added,authTruth:window.__LTS_V159_STATUS?.auth_truthful},authMode:!!d?.body.classList.contains('v159-auth-mode'),dashVisible:!!d?.getElementById('dashboard')&&getComputedStyle(d.getElementById('dashboard')).display!=='none',frameVisible:!!d?.getElementById('routeFrame')&&getComputedStyle(d.getElementById('routeFrame')).display!=='none',outerOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,innerOverflow:d?d.documentElement.scrollWidth-d.documentElement.clientWidth:null}});
            if(out.outerOverflow>4||(out.innerOverflow!=null&&out.innerOverflow>4)) throw new Error('unauth overflow '+JSON.stringify(out));
            if(out.status.state==='login'&&(!out.authMode||out.dashVisible||!out.frameVisible)) throw new Error('login truthfulness failed '+JSON.stringify(out));
            if(out.status.synthetic!==false||out.status.authTruth!==true) throw new Error('truth contract '+JSON.stringify(out));
            fs.writeFileSync('v159-no-fixture.json',JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wip35-v159-prototype-dashboard-real-core
          path: |
            v159-desktop.png
            v159-iphone.png
            v159-result.json
            v159-no-fixture.json
          if-no-files-found: warn