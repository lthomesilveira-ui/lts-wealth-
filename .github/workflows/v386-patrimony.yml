name: V386 patrimony evidence and excluded asset regression
on:
  pull_request:
    paths: ['releases/v390/**','releases/v389/**','releases/v386/**','mobile/current.json','backend/patches/v386/**','backend/tools/patrimony_v386/**','.github/scripts/*v386*','.github/workflows/v386-patrimony.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f backend/tools/patrimony_v386/fixture.sql
      - run: psql -v ON_ERROR_STOP=1 -f backend/tools/patrimony_v386/reader_v3_original.sql
      - run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT set_config('lts.fixture_owner','00000000-0000-4000-8000-000000000001',false);CREATE TABLE public.fixture_reader_before AS SELECT public.lts_browser_wealth_detail_v3() payload;"
          psql -v ON_ERROR_STOP=1 -f backend/patches/v386/patrimony_evidence.sql
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE public.fixture_reader_after AS SELECT md5(pg_get_functiondef('public.lts_browser_wealth_detail_v3()'::regprocedure)) definition_hash;"
          psql -v ON_ERROR_STOP=1 -f backend/patches/v386/patrimony_evidence.sql
      - run: psql -v ON_ERROR_STOP=1 -f backend/tools/patrimony_v386/verify.sql
  browser-evidence:
    needs: native-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      LTS_MOBILE_RELEASE: v390
      LTS_FLOW_RELEASE: v390
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v386_release_contract.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v386-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v386_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v390-patrimony-evidence
          path: qa/v386/
