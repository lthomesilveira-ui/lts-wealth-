name: V403 source writes and backup exclusion
on:
  pull_request:
    paths: ['backend/patches/v403/**','backend/tools/write_policy_v403/**','.github/workflows/v403-write-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      PGTZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - name: Prepare real V401 and V402 predecessors with synthetic financial sources
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/tools/cofrinho_v381/fixture.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v381/cofrinho_documented_redemptions.sql
          psql -v ON_ERROR_STOP=1 -f backend/tools/dated_d01_v399/fixture.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v399/dated_cofrinho_flow.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v399/batched_d0_positions.sql
          psql -v ON_ERROR_STOP=1 -f backend/tools/daily_cofrinho_v402/fixture.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v402/daily_cofrinho.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v402/batched_daily_cofrinho.sql
          python3 backend/tools/write_policy_v403/setup.py > /tmp/v403-fixture.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/v403-fixture.sql
      - name: Apply and replay guarded source-write and scheduler corrections
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/patches/v403/write_policy.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v403/backup_exclusion.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v403/write_policy.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v403/backup_exclusion.sql
      - name: Verify source conservation, exact retries and daily Cofrinho cohorts
        run: psql -v ON_ERROR_STOP=1 -f backend/tools/write_policy_v403/verify.sql | tee v403-native-proof.txt
      - name: Verify exclusion with independent concurrent database sessions
        run: python3 backend/tools/write_policy_v403/concurrency.py | tee v403-concurrency-proof.json
      - name: Restore synthetic source history and new run metadata in an independent database
        run: |
          pg_dump --no-owner --no-privileges --format=custom --file=/tmp/v403.dump postgres
          createdb v403_restore
          pg_restore --no-owner --no-privileges --dbname=v403_restore /tmp/v403.dump
          python3 backend/tools/write_policy_v403/restore_verify.py | tee v403-restore-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v403-write-backup-proof
          path: |
            v403-native-proof.txt
            v403-concurrency-proof.json
            v403-restore-proof.json
