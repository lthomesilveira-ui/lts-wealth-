name: V353 expense hierarchy and signed totals
on:
  pull_request:
    paths: ['releases/v353/**','backend/patches/v353/**','backend/qa/*v353*','backend/qa/fixtures/v353*','.github/scripts/*v353*','.github/workflows/v353.yml','docs/V353_EXPENSE_PRESENTATION.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v353_ci_sql.py > /tmp/lts-v353.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/lts-v353.sql > /tmp/lts-v353-result.log
      - if: failure()
        run: tail -c 8000 /tmp/lts-v353-result.log || true
      - run: tail -2 /tmp/lts-v353-result.log
  presentation-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/lts_v353_model_contract.cjs
      - run: node .github/scripts/lts_v353_release_contract.cjs
