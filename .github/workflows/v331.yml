name: V331 original workbook provenance and existing UI regression
on:
  pull_request:
    paths: ['backend/patches/v331/**','.github/workflows/v331.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-classification-and-ui:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      LTS_RELEASE: v312
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v312_release_contract.cjs
      - name: Existing PostgreSQL classification regression
        run: python3 backend/qa/lts_v327_ci.py
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Serve preserved application
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v331-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - name: Existing V312 desktop and mobile regression
        run: node .github/scripts/lts_v327_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v331-preserved-classification-and-interface
          path: qa/v327/
