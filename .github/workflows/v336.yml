name: V336 original workbook transfer identity
on:
  pull_request:
    paths: ['backend/patches/v336/**','backend/qa/*v336*','backend/qa/fixtures/v336*','.github/workflows/v336.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-history:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: python3 backend/qa/lts_v336_match_test.py
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v336_ci_sql.py | psql -v ON_ERROR_STOP=1
