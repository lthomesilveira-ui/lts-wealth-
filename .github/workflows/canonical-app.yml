name: Canonical app gate

on:
  push:
    branches: [canonical-app-v1]
    paths:
      - canonical-app.html
      - canonical-liquidity.js
      - canonical-liquidity-core.js
      - canonical-flow-v157.js
      - canonical-product-v157.js
      - canonical-presentation-v157.js
      - canonical-capabilities-v161.js
      - canonical-dashboard-fidelity.css
      - .github/scripts/lts_canonical_v157plus_browser_gate.js
      - .github/workflows/canonical-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Static contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('canonical-app.html').read_text()
          l=Path('canonical-liquidity.js').read_text()
          c=Path('canonical-liquidity-core.js').read_text()
          f=Path('canonical-flow-v157.js').read_text()
          p=Path('canonical-product-v157.js').read_text()
          v=Path('canonical-presentation-v157.js').read_text()
          g=Path('canonical-capabilities-v161.js').read_text()
          d=Path('canonical-dashboard-fidelity.css').read_text()
          gate=Path('.github/scripts/lts_canonical_v157plus_browser_gate.js').read_text()
          assert '<iframe' not in s
          assert 'document.write' not in s
          assert 'MutationObserver' not in s
          assert 'setInterval(' not in s
          assert 'canonical-liquidity.js?v=' in s
          assert 'canonical-dashboard-fidelity.css?v=20260908-dashboard-layers11' in s
          assert 'canonical-liquidity.js?v=20260908-dashboard-layers11' in s
          assert 'single-owner-history-nature-context-v1' in s
          assert 'Quanto você gasta — e para quem é cada gasto.' in s
          assert 'reference-layered-liquidity-commitments-v3' in s
          assert 'fact-before-asof-projection-after-asof-v1' in s
          assert 'current-base-scheduled-rsu-restricted-fgts-v1' in s
          assert 'layered-fact-projection-v2' in s
          assert 'product-commitments-plus-card-due' in s
          assert 'canonical-route-session-continuity-v1' in s
          assert 'data-dashboard-reload' in s
          for module in ['canonical-liquidity-core.js','canonical-flow-v157.js','canonical-product-v157.js','canonical-presentation-v157.js','canonical-capabilities-v161.js?v=20260908-continuity7']:
              assert module in l, module
          assert 'canonical-flow-v150.js' not in l
          assert "const ROUTES=['Patrimônio','Cartões']" in p
          assert len(d) > 1000
          assert '#dashboard-view .grid-main' in d
          assert '#dashboard-view .rank-row.clickable' in d
          for module in [l,c,f,p,v,g]:
              assert 'MutationObserver' not in module
              assert 'setInterval(' not in module
          for r in ['Dashboard','Fluxo Diário','Despesas','Patrimônio','Cartões','Atualizações']:
              assert r in s
          for rpc in [
              'lts_browser_product_v1','lts_browser_dashboard_cockpit_v1',
              'lts_browser_transactions_v1','lts_browser_expense_context_lens_v1',
              'lts_browser_wealth_detail_v1','lts_browser_card_history_coverage_v1',
              'lts_browser_document_lifecycle_v1','lts_browser_semantic_feedback_v1'
          ]:
              assert rpc in s, rpc
          for rpc in [
              'lts_browser_liquidity_movement_options_v1',
              'lts_browser_preview_liquidity_movement_v1',
              'lts_browser_apply_liquidity_movement_v1'
          ]:
              assert rpc in c, rpc
          for marker in ['lts_browser_flow_v8','lts_browser_card_settlement_detail_v2','LTS v1.9','v150-validated-flow-plus-v157-liquidity-v1','Histórico / período','Movimentos do dia','Dividir / substituir','inline-card-settlement-v150','RSUs futuras','Cash Awards futuros','lts_browser_flow_event_editor_v1','lts_browser_flow_mutate_v1']:
              assert marker in f, marker
          for marker in ['Dinheiro em contas','Contas + curto prazo','RSUs vested','FGTS','Despesas (mês)','Evolução da Liquidez','Quanto você gastou — e como isso evoluiu.','Mês a mês','Ano a ano','Cobertura do histórico','Quanto você tem, quanto deve e quanto é seu.','Conferência de fatura, não análise de gasto.']:
              assert marker in p, marker
          for marker in ['presentation-polish-v1','__LTS_V157_PRESENTATION_STATUS','__LTS_V157_POLISH_STATUS']:
              assert marker in v, marker
          for marker in ['LTS v1.6 · Central de Gestão','__LTS_CANONICAL_CAPABILITIES_STATUS','session-persisted-management-pane-v1','Planejamento','Entradas & compromissos','Recorrências','Simulações','Conciliação','Relatórios','Backup & restauração','Configurações & integrações','Financiamentos','Documentos']:
              assert marker in g, marker
          for marker in ['lts-canonical-definition-of-done-receipt-v1','route_session_continuity','AUTOMATED_GATE_PASS_REAL_E2E_OPEN']:
              assert marker in gate, marker
          for label in [
              'Dinheiro em contas','Contas + curto prazo','RSUs vested','FGTS','Despesas (mês)',
              'Evolução da Liquidez','Distribuição do Patrimônio','Posição por Banco',
              'Fluxo de Caixa','Principais Despesas','Próximos Compromissos','Planejamento – Visão de Caixa',
              'Atualizações Pendentes','Encontrar lançamentos','Exportar para Excel (CSV)',
              'Classificações que realmente precisam de decisão','Documentos','Natureza × contexto','CIPÓ 396'
          ]:
              assert label in s, label
          for label in ['Aplicar / resgatar','Efeito econômico: R$ 0,00','Confirmar movimentação']:
              assert label in c, label
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/canonical-script.js').write_text('\n'.join(scripts))
          print('static contract ok')
          PY
          node --check /tmp/canonical-script.js
          node --check canonical-liquidity.js
          node --check canonical-liquidity-core.js
          node --check canonical-flow-v157.js
          node --check canonical-product-v157.js
          node --check canonical-presentation-v157.js
          node --check canonical-capabilities-v161.js
          node --check .github/scripts/lts_canonical_v157plus_browser_gate.js
      - name: Browser contract
        run: node .github/scripts/lts_canonical_v157plus_browser_gate.js
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-app-gate
          if-no-files-found: warn
          path: |
            canonical-app.html
            canonical-liquidity.js
            canonical-liquidity-core.js
            canonical-flow-v157.js
            canonical-product-v157.js
            canonical-presentation-v157.js
            canonical-dashboard-fidelity.css
            canonical-definition-of-done-receipt.json
            canonical-*.png
