name: Canonical app gate

on:
  push:
    branches: [canonical-app-v1]
    paths:
      - canonical-app.html
      - .github/workflows/canonical-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Static contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('canonical-app.html').read_text()
          assert '<iframe' not in s
          assert 'document.write' not in s
          assert 'MutationObserver' not in s
          assert 'setInterval(' not in s
          for r in ['Dashboard','Fluxo Diário','Despesas','Patrimônio','Cartões','Atualizações']:
              assert r in s
          for rpc in [
              'lts_browser_product_v1','lts_browser_dashboard_cockpit_v1',
              'lts_browser_transactions_v1','lts_browser_expense_context_lens_v1',
              'lts_browser_wealth_detail_v1','lts_browser_card_history_coverage_v1',
              'lts_browser_document_lifecycle_v1','lts_browser_semantic_feedback_v1'
          ]:
              assert rpc in s, rpc
          for label in [
              'Dinheiro em contas','Contas + curto prazo','RSUs vested','FGTS','Despesas (mês)',
              'Evolução do Patrimônio Líquido','Distribuição do Patrimônio','Posição por Banco',
              'Fluxo de Caixa','Principais Despesas','Próximos Compromissos','Planejamento – Visão de Caixa',
              'Atualizações Pendentes','Encontrar lançamentos','Exportar para Excel (CSV)',
              'Classificações que realmente precisam de decisão','Documentos','Natureza × contexto','CIPÓ 396'
          ]:
              assert label in s, label
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/canonical-script.js').write_text('\n'.join(scripts))
          print('static contract ok')
          PY
          node --check /tmp/canonical-script.js
      - name: Browser contract
        run: |
          cat > .canonical-test.cjs <<'JS'
          const {chromium, webkit}=require('playwright');
          const {spawn}=require('child_process');
          const server=spawn('python3',['-m','http.server','4173','--bind','127.0.0.1'],{stdio:'inherit'});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const routes=['Dashboard','Fluxo Diário','Despesas','Patrimônio','Cartões','Atualizações'];
          const navFor=(page,route,mobile)=>mobile?page.locator('.mobile-nav [data-route="'+route+'"]'):page.locator('.sidebar [data-route="'+route+'"]');
          async function route(page,route,mobile){
            await navFor(page,route,mobile).click();
            await page.waitForTimeout(100);
            const title=(await page.locator('.page-title h1').textContent())?.trim();
            if(title!==route)throw new Error('route '+route+' got '+title);
          }
          async function run(browserType,name,viewport,shot){
            const mobile=viewport.width<=820;
            const browser=await browserType.launch({headless:true});
            const page=await browser.newPage({viewport});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/canonical-app.html?fixture=1',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__LTS_CANONICAL_STATUS?.ready===true);
            const st=await page.evaluate(()=>window.__LTS_CANONICAL_STATUS);
            if(st.iframe_count!==0)throw new Error(name+': iframe detected');
            if(!st.fixture||!st.data_ready)throw new Error(name+': fixture not ready');
            for(const flag of ['server_search','classification_lifecycle','expense_context_lens','wealth_detail','card_coverage','document_lifecycle']){
              if(st[flag]!==true)throw new Error(name+': capability flag '+flag+' missing');
            }
            const kpis=await page.locator('.kpi strong').allTextContents();
            if(kpis.length!==5||kpis.some(x=>!x.trim()||x.trim()==='—'))throw new Error(name+': KPI gate '+JSON.stringify(kpis));
            await page.screenshot({path:shot,fullPage:true});

            await route(page,'Fluxo Diário',mobile);
            if(await page.locator('.table tbody tr').count()<5)throw new Error(name+': flow rows missing');
            await page.locator('#flowAccount').selectOption({label:'Itaú'});
            if(await page.locator('.table tbody tr').count()<5)throw new Error(name+': bank flow switch failed');

            await route(page,'Despesas',mobile);
            await page.waitForFunction(()=>document.body.textContent.includes('Natureza × contexto'));
            if(await page.locator('.lens-row').count()<2)throw new Error(name+': expense lens missing');
            await page.locator('[data-lens-kind="nature"]').first().click();
            if(await page.locator('.drill-card').count()!==1)throw new Error(name+': expense drilldown missing');
            await page.locator('#expensePeriod').selectOption('2013');
            await page.waitForFunction(()=>document.querySelector('#expensePeriod')?.value==='2013');

            await route(page,'Patrimônio',mobile);
            if(await page.getByText('Patrimônio líquido',{exact:true}).count()!==1)throw new Error(name+': wealth summary missing');
            if(await page.getByText('FGTS',{exact:true}).count()<1)throw new Error(name+': wealth FGTS missing');

            await route(page,'Cartões',mobile);
            if(await page.getByText('Faturas abertas',{exact:true}).count()!==1)throw new Error(name+': cards summary missing');
            if(await page.getByText('Próximo vencimento',{exact:true}).count()!==1)throw new Error(name+': cards due missing');

            await route(page,'Atualizações',mobile);
            if(await page.locator('.class-row').count()<3)throw new Error(name+': classification queue missing');
            if(await page.locator('.class-save:not([disabled])').count()!==0)throw new Error(name+': fixture writer unexpectedly enabled');
            const term=page.locator('#ledgerTerm');
            await term.fill('Mastercard');
            await page.waitForFunction(()=>document.querySelector('#ledgerMeta')?.textContent?.includes('1 lançamento'));
            if(await page.locator('.search-result').count()!==1)throw new Error(name+': transaction search result missing');
            if(await page.locator('#ledgerExport').isDisabled())throw new Error(name+': CSV export not enabled after result');
            if(await page.getByText('Documentos',{exact:true}).count()<1)throw new Error(name+': documents area missing');
            if(!mobile)await page.screenshot({path:'canonical-updates.png',fullPage:true});

            await route(page,'Dashboard',mobile);
            const metrics=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,iframes:document.querySelectorAll('iframe').length,nav:[...document.querySelectorAll('.mobile-nav button')].map(b=>{const r=b.getBoundingClientRect();return {l:r.left,r:r.right,w:r.width}})}));
            if(metrics.sw>metrics.cw+1)throw new Error(name+': horizontal overflow '+JSON.stringify(metrics));
            if(metrics.iframes!==0)throw new Error(name+': iframe after nav');
            if(mobile){
              if(metrics.nav.length!==6)throw new Error(name+': mobile nav count');
              if(metrics.nav.some(r=>r.l<-.5||r.r>viewport.width+.5||r.w<=0))throw new Error(name+': clipped mobile nav '+JSON.stringify(metrics.nav));
            }
            if(pageErrors.length)throw new Error(name+': page errors '+pageErrors.join(' | '));

            await page.goto('http://127.0.0.1:4173/canonical-app.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(500);
            const login=await page.locator('#loginForm').count();
            const fakeDashboard=await page.locator('#dashboard-view').count();
            const fixtureBadge=await page.getByText('FIXTURE DE TESTE',{exact:true}).count();
            if(login!==1||fakeDashboard!==0||fixtureBadge!==0)throw new Error(name+': unauthenticated truth failed');
            await browser.close();
          }
          (async()=>{try{
            await sleep(700);
            await run(chromium,'chromium-desktop',{width:1312,height:1199},'canonical-desktop.png');
            await run(webkit,'webkit-mobile',{width:390,height:844},'canonical-mobile.png');
            console.log('canonical functional browser gate ok');
          }finally{server.kill('SIGTERM')}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .canonical-test.cjs
          rm -f .canonical-test.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-app-gate
          if-no-files-found: warn
          path: |
            canonical-app.html
            canonical-desktop.png
            canonical-mobile.png
            canonical-updates.png
