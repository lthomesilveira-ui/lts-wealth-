name: P05 presentation fullstack visual
on:
  pull_request:
    paths:
      - 'wealth-p05-presentation-20261016/public/**'
      - '.github/scripts/lts_p05_presentation_fullstack.js'
      - '.github/workflows/p05-presentation-fullstack.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LTS_RELEASE: v280
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p qa
      - run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/p05-http.log 2>&1 &
      - run: node .github/scripts/lts_p05_presentation_fullstack.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p05-presentation-fullstack
          path: qa/
