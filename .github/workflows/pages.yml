          LTS_RELEASE=v274 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v275 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v276 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v277 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v278 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v279 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v280 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v281 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v282 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v283 node .github/scripts/lts_v225_static_gate.js
          node .github/scripts/lts_v283_release_contract.cjs
          LTS_RELEASE=v284 node .github/scripts/lts_v225_static_gate.js
          node .github/scripts/lts_v284_release_contract.cjs
          LTS_RELEASE=v285 node .github/scripts/lts_v225_static_gate.js
          node .github/scripts/lts_v285_release_contract.cjs
          node .github/scripts/lts_v290_release_contract.cjs
          node .github/scripts/lts_v291_release_contract.cjs
          node .github/scripts/lts_v293_release_contract.cjs
          node .github/scripts/lts_v295_release_contract.cjs
          node .github/scripts/lts_v296_release_contract.cjs
          node .github/scripts/lts_v308_release_contract.cjs
          node .github/scripts/lts_v309_release_contract.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published V309 and preserved releases
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const results=[];
          const releases=['v309','v308','v296','v295','v242','v244','v245','v257','v258','v259','v260','v261','v262','v264','v268','v269','v270','v271','v272','v273','v274','v275','v276','v277','v278','v279','v280','v281','v282','v283','v284','v285','v290','v291','v293'];
          for(const release of releases){
          const rawManifest=fs.readFileSync('releases/'+release+'/manifest.json');
          const manifest=JSON.parse(rawManifest);
          const base='https://lthomesilveira-ui.github.io/lts-wealth-/releases/'+release+'/';
          const entries=Object.entries(manifest.files).concat([['manifest.json',crypto.createHash('sha256').update(rawManifest).digest('hex')]]);
          if(release==='v285'){
            assert.equal(manifest.release,'v285','Published target release identity');
            assert.equal(manifest.version,'v285','Published target version identity');
            assert.equal(Object.keys(manifest.files).length,66,'V285 must declare 66 non-manifest files');
            assert.equal(entries.length,67,'V285 must verify all 67 assets including manifest.json');
            assert.equal(new Set(entries.map(([name])=>name)).size,67,'V285 verification entries must be unique');
          }
          for(let offset=0;offset<entries.length;offset+=6){
            results.push(...await Promise.all(entries.slice(offset,offset+6).map(async([name,expected])=>{
              let error;
              for(let attempt=0;attempt<4;attempt++){
                try{
                  const response=await fetch(base+name+'?verify='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(15000)});
                  assert(response.ok,name+' HTTP '+response.status);
                  const actual=crypto.createHash('sha256').update(Buffer.from(await response.arrayBuffer())).digest('hex');
                  assert.equal(actual,expected,name+' served SHA256 differs');
                  return {release,name,sha256:actual,pass:true};
                }catch(e){error=e;if(attempt<3)await new Promise(resolve=>setTimeout(resolve,5000));}
              }
              throw error;
            })));
          }
          }
          assert.equal(results.filter(result=>result.release==='v285').length,67,'V285 verification must complete for all 67 assets');
          assert.equal(results.filter(result=>result.release==='v291').length,70,'V291 must verify all 70 assets');
          assert.equal(results.filter(result=>result.release==='v290').length,70,'V290 must remain byte-identical');
          assert.equal(results.filter(result=>result.release==='v293').length,70,'V293 must verify all 70 assets');
          assert.equal(results.filter(result=>result.release==='v295').length,70,'V295 must verify all 70 assets');
          assert.equal(results.filter(result=>result.release==='v296').length,71,'V296 must verify all 71 assets');
          assert.equal(results.filter(result=>result.release==='v308').length,72,'V308 must verify all 72 assets');
          assert.equal(results.filter(result=>result.release==='v309').length,72,'V309 must verify all 72 assets');
          fs.writeFileSync('v309-published-verification.json',JSON.stringify({pass:true,head:process.env.GITHUB_SHA,url:'https://lthomesilveira-ui.github.io/lts-wealth-/releases/v309/app.html',releases,count:results.length,assets:results},null,2));
          console.log('Published V309 and preserved earlier release assets verified:',results.length);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: v309-published-verification
          path: v309-published-verification.json


