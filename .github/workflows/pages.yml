name: Deploy LTS Wealth to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['releases/v225/**', 'releases/v225-1/**', 'releases/v226/**', 'releases/v226-1/**', 'releases/v226-2/**', 'releases/v227/**', 'releases/v227-1/**', 'releases/v227-2/**', 'releases/v228/**', 'releases/v229/**', 'releases/v229-1/**', 'releases/v230/**', 'releases/v233/**', 'releases/v234/**', 'releases/v235/**', 'releases/v236/**', 'releases/v237/**', 'releases/v238/**', 'releases/v239/**', 'releases/v240/**', 'releases/v241/**', 'releases/v242/**', 'releases/v244/**', 'releases/v245/**', 'releases/v257/**', 'releases/v258/**', 'releases/v259/**', 'wip35-v225-candidate.html', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
      - name: Verify release assets and protected history
        run: |
          node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v225-1 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v226 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v226-1 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v226-2 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v227 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v227-1 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v227-2 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v228 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v229 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v229-1 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v230 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v231 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v232 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v233 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v234 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v235 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v236 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v237 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v238 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v239 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v240 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v241 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v242 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v244 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v245 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v257 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v258 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v259 node .github/scripts/lts_v225_static_gate.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published V259 and preserved releases
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const results=[];
          const releases=['v242','v244','v245','v257','v258','v259'];
          for(const release of releases){
          const rawManifest=fs.readFileSync('releases/'+release+'/manifest.json');
          const manifest=JSON.parse(rawManifest);
          const base='https://lthomesilveira-ui.github.io/lts-wealth-/releases/'+release+'/';
          const entries=Object.entries(manifest.files).concat([['manifest.json',crypto.createHash('sha256').update(rawManifest).digest('hex')]]);
          for(let offset=0;offset<entries.length;offset+=6){
            results.push(...await Promise.all(entries.slice(offset,offset+6).map(async([name,expected])=>{
              let error;
              for(let attempt=0;attempt<4;attempt++){
                try{
                  const response=await fetch(base+name+'?verify='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(15000)});
                  assert(response.ok,name+' HTTP '+response.status);
                  const actual=crypto.createHash('sha256').update(Buffer.from(await response.arrayBuffer())).digest('hex');
                  assert.equal(actual,expected,name+' served SHA256 differs');
                  return {release,name,sha256:actual,pass:true};
                }catch(e){error=e;if(attempt<3)await new Promise(resolve=>setTimeout(resolve,5000));}
              }
              throw error;
            })));
          }
          }
          fs.writeFileSync('v259-published-verification.json',JSON.stringify({pass:true,head:process.env.GITHUB_SHA,url:'https://lthomesilveira-ui.github.io/lts-wealth-/releases/v259/app.html',releases,count:results.length,assets:results},null,2));
          console.log('Published V259 and frozen V258/V257/V245/V244/V242 assets verified:',results.length);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: v259-published-verification
          path: v259-published-verification.json
