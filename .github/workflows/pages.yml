name: Deploy LTS Wealth to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['releases/v225/**', 'releases/v225-1/**', 'releases/v226/**', 'releases/v226-1/**', 'releases/v226-2/**', 'wip35-v225-candidate.html', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
      - name: Verify release assets and protected history
        run: |
          node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v225-1 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v226 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v226-1 node .github/scripts/lts_v225_static_gate.js
          LTS_RELEASE=v226-2 node .github/scripts/lts_v225_static_gate.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
