name: V446 review recovery after refresh
on:
  pull_request:
    paths: ['releases/v446/**','backend/tools/review_resume_v446/**','.github/scripts/lts_v446*','.github/workflows/v446-review-resume.yml','mobile/current.json']
permissions:
  contents: read
jobs:
  review-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      LTS_MOBILE_RELEASE: v458
      LTS_FLOW_RELEASE: v442
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable read-only recovery and inherited opening contracts
        run: |
          python3 backend/tools/review_resume_v446/build.py --check
          node .github/scripts/lts_v446_release_contract.cjs
          node --test .github/scripts/lts_v445_opening_test.cjs .github/scripts/lts_v444_transport_test.cjs .github/scripts/lts_v444_refresh_test.cjs
      - name: Cancel active classification readers and recover from the real ready event
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/v446-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
          node .github/scripts/lts_v446_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v446-review-resume
          retention-days: 14
          path: qa/v446/
