name: V183 isolated historical reader
on:
  pull_request:
    paths:
      - 'wip35-v183-candidate.html'
      - 'lts-v183-expense-history-candidate.js'
      - 'lts-v183-historical-balance-guard.js'
      - 'lts-history-coverage-policy.js'
      - 'test-history-coverage.cjs'
      - 'test-v183-period-ownership.cjs'
      - 'test-v183-monthly-detail.cjs'
      - 'lts-v183-search-completeness.js'
      - 'test-v183-search-completeness.cjs'
      - 'lts-v183-exact-flow-navigation.js'
      - 'test-v183-exact-flow-navigation.cjs'
      - 'lts-v183-flow-period-state.js'
      - 'test-v183-flow-period-state.cjs'
      - 'test-v183-monthly-window.cjs'
      - 'supabase/migrations/*v183_monthly_window*.sql'
      - 'test-v183-historical-source-lookup.cjs'
      - 'test-v183-bank-evidence-freshness.cjs'
      - 'supabase/migrations/*v183_bank_evidence_freshness*.sql'
      - 'supabase/migrations/*v183_historical_source_lookup*.sql'
      - 'lts-v183-v182-feedback-safe.js'
      - 'lts-v183-card-period-candidate.js'
      - 'lts-v183-wealth-debt-integrity.js'
      - 'lts-v183-income-review.js'
      - 'test-v183-income-review.cjs'
      - 'test-v183-income-review.sql'
      - 'supabase/migrations/20260923223926_v183_exact_income_category.sql'
      - 'audit_original_daily_balances.py'
      - 'reconcile_historical_scope.py'
      - 'test_reconcile_historical_scope.py'
      - '.github/workflows/v183-historical-read.yml'
permissions:
  contents: read
jobs:
  candidate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify syntax, isolation and completeness guard
        run: |
          node test-history-coverage.cjs
          node --test test-v183-period-ownership.cjs
          node --test test-v183-monthly-detail.cjs
          node --test test-v183-search-completeness.cjs
          node --test test-v183-exact-flow-navigation.cjs
          node --test test-v183-flow-period-state.cjs
          node --test test-v183-monthly-window.cjs
          node --test test-v183-historical-source-lookup.cjs
          node --test test-v183-bank-evidence-freshness.cjs
          node --test test-v183-income-review.cjs
          python3 -B -m unittest test_reconcile_historical_scope.py
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const candidate=fs.readFileSync('wip35-v183-candidate.html','utf8');
          const runtime=fs.readFileSync('lts-v183-expense-history-candidate.js','utf8');
          assert.match(candidate,/V183 · Homologação/);
          assert.match(candidate,/lts-v183-expense-history-candidate\.js/);
          assert.match(candidate,/lts-v183-v182-feedback-safe\.js/);
          assert.doesNotThrow(()=>new Function(runtime));
          assert.match(runtime,/function verifyPart/);
          assert.match(runtime,/halfYearChunks/);
          assert.match(runtime,/Nenhum total parcial será exibido/);
          assert.equal(crypto.createHash('sha256').update(fs.readFileSync('index.html')).digest('hex'),'cca36731258680cc15a73fbad61c90ddf803358b741fd3ef58fefe5419eb688b');
          const manifest=JSON.parse(fs.readFileSync('homologacao-current.json','utf8'));
          assert.equal(manifest.version,'wip35-v181');
          JS
