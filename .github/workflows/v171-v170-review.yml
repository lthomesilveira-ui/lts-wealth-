name: V171 V170 user-review closure

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/v171-v170-user-review-20260917
      - main
    paths:
      - 'wip35-v171-candidate.html'
      - 'homologacao-current.json'
      - 'lts-v171-v170-review.js'
      - 'lts-v171-v170-review.css'
      - 'supabase/migrations/20260917*_v171_*.sql'
      - '.github/scripts/lts_v171_v170_review_contract.js'
      - '.github/scripts/lts_v171_v170_review_gate.js'
      - '.github/workflows/v171-v170-review.yml'

permissions:
  contents: read

jobs:
  contract-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
      options: --init --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V171 static contracts
        run: |
          node --check lts-v171-v170-review.js
          node --check .github/scripts/lts_v171_v170_review_contract.js
          node --check .github/scripts/lts_v171_v170_review_gate.js
          node .github/scripts/lts_v171_v170_review_contract.js
      - name: Install isolated browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Verify Node and Python Chromium and WebKit
        timeout-minutes: 2
        run: node .github/scripts/lts_v299_browser_environment.cjs
      - name: Validate V171 in desktop and mobile viewports
        run: |
          python3 -m http.server 8781 >/tmp/lts-v171-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 180s node .github/scripts/lts_v171_v170_review_gate.js
      - name: Re-run V170 and protected Flow contracts
        run: |
          node .github/scripts/lts_v170_v169_review_contract.js
          python .github/scripts/lts_integrated_flow_gate.py
          python .github/scripts/lts_flow_bank_scope_gate.py
          python .github/scripts/lts_invoice_reading_order_gate.py
          python .github/scripts/lts_flow_documentary_rollforward_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v171-v170-user-review
          path: |
            v171-v170-review-result.json
            v299-browser-environment-result.json
            v171-*.png
            integrated-flow-result.json
            integrated-*.png
            bank-scope-result.json
            bank-scope-*.png
            invoice-reading-order-result.json
            invoice-order-*.png
            flow-documentary-rollforward-result.json
          if-no-files-found: warn
