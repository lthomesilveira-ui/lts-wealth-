name: V368 private-session review closure
on:
  pull_request:
    paths: ['releases/v368/**','.github/scripts/*v368*','.github/workflows/v368.yml','backend/patches/v369/**','backend/qa/*v369*','backend/qa/fixtures/v369*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v368_release_contract.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v368-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v368_browser.cjs
      - run: LTS_RELEASE=v368 node .github/scripts/lts_v342_month_rollover_contract.cjs
      - run: LTS_RELEASE=v368 node .github/scripts/lts_v342_month_rollover_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v368-homologation-browser
          path: qa/v368/

  native-identity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v369_ci_sql.py > /tmp/lts-v369.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/lts-v369.sql > /tmp/lts-v369-result.log
      - if: failure()
        run: tail -c 6000 /tmp/lts-v369-result.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v369-native-identities
          path: /tmp/lts-v369-result.log
