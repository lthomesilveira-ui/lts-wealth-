name: V378 installed mobile layout
on:
  pull_request:
    paths: ['mobile/**','releases/v378/**','.github/scripts/*v378*','.github/workflows/v378.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v378-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v378_mobile_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v378-mobile-layout
          path: qa/v378/
