name: V404 FGTS documentary position
on:
  pull_request:
    paths: ['releases/v407/**','releases/v404/**','mobile/current.json','.github/fixtures/fgts-dashboard/**','.github/scripts/fgts*.cjs','.github/scripts/*v404*','.github/workflows/fgts-dashboard-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      LTS_MOBILE_RELEASE: v440
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: node .github/scripts/fgts_dashboard_browser.cjs
      - name: Rebuild the isolated candidate and verify committed V404
        run: |
          node .github/scripts/fgts_candidate_build.cjs
          cmp qa/fgts-v404-candidate/lts-v384-startup-1.js releases/v404/lts-v384-startup-1.js
          node --check releases/v404/lts-v384-startup-1.js
          node .github/scripts/lts_v402_release_contract.cjs
          node .github/scripts/lts_v404_release_contract.cjs
      - name: Start synthetic-only local fixture server
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/fgts-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - name: Verify the mobile launcher and full application with fictional RPC responses
        run: node .github/scripts/fgts_candidate_app.cjs
      - name: Recheck immutable releases and current mobile entry
        run: |
          node .github/scripts/lts_v402_release_contract.cjs
          node .github/scripts/lts_v404_release_contract.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v404-fgts-synthetic-browser-proof
          path: |
            qa/fgts-dashboard/
            qa/v407/
