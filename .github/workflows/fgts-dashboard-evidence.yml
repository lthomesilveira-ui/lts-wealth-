name: FGTS dashboard evidence candidate
on:
  pull_request:
    paths: ['.github/fixtures/fgts-dashboard/**','.github/scripts/fgts_dashboard_browser.cjs','.github/workflows/fgts-dashboard-evidence.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: node .github/scripts/fgts_dashboard_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgts-dashboard-synthetic-proof
          path: qa/fgts-dashboard/
