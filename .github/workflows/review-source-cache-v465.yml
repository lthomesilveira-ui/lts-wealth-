name: V465 exact review source cache
on:
  pull_request:
    paths: ['backend/tools/review_source_cache_v465/**','.github/workflows/review-source-cache-v465.yml']
permissions:
  contents: read
jobs:
  native-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      PGTZ: America/Sao_Paulo
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact deterministic source guard package
        run: |
          python3 backend/tools/review_source_cache_v465/build.py
          git diff --exit-code -- backend/tools/review_source_cache_v465
      - name: Native equality, invalidation, schema, privilege and concurrency cases
        run: python3 backend/tools/review_source_cache_v465/test_native.py
