name: LTS v156 performance liquidity
on:
  push:
    branches: [v156-performance-liquidity-dashboard, main]
    paths:
      - 'wip35-v156-candidate.html'
      - '.github/workflows/v156-performance-liquidity.yml'
      - 'homologacao-current.json'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Static contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('wip35-v156-candidate.html').read_text(encoding='utf-8')
          for x in ['no_permanent_polling:true','mutation_observer:false','intervals:0','bounded_source_poll:true','liquidity_first:true','scaled_chart:true','wealth_secondary:true','Dinheiro em contas','Contas + curto prazo','RSUs vested','FGTS','Evolução da Liquidez']:
              assert x in s, x
          assert "setInterval(" not in s
          assert "new MutationObserver" not in s
          assert "window.__LTS_V156_POLL_COUNT" in s
          print('v156_static=PASS')
          PY
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve
        run: python3 -m http.server 8000 >/tmp/lts-v156-http.log 2>&1 &
      - name: Browser performance and dashboard gate
        run: |
          node <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const result={pass:true,authenticated_e2e:false,views:{}};
            for(const vp of [{name:'desktop',width:1312,height:1199},{name:'mobile',width:390,height:844}]){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              await page.goto('http://127.0.0.1:8000/wip35-v156-candidate.html?runtimeFixture=1&visualFixture=1',{waitUntil:'domcontentloaded',timeout:20000});
              await page.waitForFunction(()=>window.__LTS_V156_STATUS?.liquidity_first===true,null,{timeout:8000});
              await page.waitForSelector('.kpis .kpi',{state:'visible',timeout:8000});
              await page.waitForFunction(()=>window.__LTS_V156_DATA_STATE?.patchCount>=1,null,{timeout:8000});
              const labels=await page.locator('.kpi label').allTextContents();
              for(const x of ['Dinheiro em contas','Contas + curto prazo','RSUs vested','FGTS','Despesas (mês)']) if(!labels.includes(x)) throw new Error(vp.name+': missing KPI '+x+' '+JSON.stringify(labels));
              const status=await page.evaluate(()=>window.__LTS_V156_STATUS);
              if(!status.no_permanent_polling||status.mutation_observer!==false||status.intervals!==0) throw new Error(vp.name+': perf contract '+JSON.stringify(status));
              const initial=await page.evaluate(()=>({nodes:document.querySelectorAll('*').length,patches:window.__LTS_V156_DATA_STATE?.patchCount||0,polls:window.__LTS_V156_POLL_COUNT||0}));
              await page.waitForTimeout(12000);
              const after=await page.evaluate(()=>({nodes:document.querySelectorAll('*').length,patches:window.__LTS_V156_DATA_STATE?.patchCount||0,polls:window.__LTS_V156_POLL_COUNT||0,title:document.title,chart:!!document.querySelector('.scaled-chart svg'),wealth:!!document.querySelector('.wealth-row')}));
              if(after.patches>initial.patches+1) throw new Error(vp.name+': repeated dashboard patching '+JSON.stringify({initial,after}));
              if(Math.abs(after.nodes-initial.nodes)>25) throw new Error(vp.name+': DOM churn '+JSON.stringify({initial,after}));
              if(after.polls>30) throw new Error(vp.name+': source poll not bounded '+after.polls);
              if(!after.chart||!after.wealth) throw new Error(vp.name+': dashboard composition missing '+JSON.stringify(after));
              const selector=vp.name==='mobile'?'#mobileNav [data-route]':'#sideNav [data-route]';
              const routes=[];
              for(const dest of ['Fluxo Diário','Despesas','Patrimônio','Cartões','Atualizações','Dashboard']){
                const b=page.locator(selector).filter({hasText:dest}).first();
                await b.click();await page.waitForTimeout(950);
                const state=await page.evaluate(()=>window.__LTS_V156_ROUTE_STATE||null);
                if(!state||state.dest!==dest||state.ok!==true) throw new Error(vp.name+': route '+dest+' failed '+JSON.stringify(state));
                routes.push({dest,state});
              }
              const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,kpis:document.querySelectorAll('.kpi').length}));
              if(dims.sw>dims.cw+8) throw new Error(vp.name+': overflow '+JSON.stringify(dims));
              if(dims.kpis!==5) throw new Error(vp.name+': KPI count '+dims.kpis);
              await page.screenshot({path:`v156-${vp.name}.png`,fullPage:true});
              result.views[vp.name]={initial,after,routes,dims,labels};
              await page.close();
            }
            fs.writeFileSync('v156-result.json',JSON.stringify(result,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: No-fixture boot and responsiveness smoke
        run: |
          node <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const out={pass:true,authenticated:false};
            await page.goto('http://127.0.0.1:8000/wip35-v156-candidate.html',{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForSelector('#mobileNav [data-route]',{state:'visible',timeout:10000});
            await page.waitForTimeout(12000);
            out.status=await page.evaluate(()=>window.__LTS_V156_STATUS||null);
            out.polls=await page.evaluate(()=>window.__LTS_V156_POLL_COUNT||0);
            out.responsive=await page.evaluate(()=>new Promise(r=>setTimeout(()=>r('ok'),25)));
            if(out.responsive!=='ok'||out.polls>30) throw new Error('no-fixture responsiveness failed '+JSON.stringify(out));
            const b=page.locator('#mobileNav [data-route]').filter({hasText:'Fluxo Diário'}).first();await b.click();await page.waitForTimeout(1200);
            out.route=await page.evaluate(()=>window.__LTS_V156_ROUTE_STATE||null);
            if(!out.route||out.route.dest!=='Fluxo Diário'||out.route.ok!==true) throw new Error('no-fixture route failed '+JSON.stringify(out.route));
            fs.writeFileSync('v156-no-fixture.json',JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wip35-v156-performance-liquidity
          path: |
            v156-desktop.png
            v156-mobile.png
            v156-result.json
            v156-no-fixture.json
          if-no-files-found: warn
