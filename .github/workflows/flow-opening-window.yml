name: Default Flow opening
on:
  pull_request:
    paths:
      - 'releases/v495/**'
      - 'releases/v494/**'
      - '.github/scripts/historical-consolidated-cash.cjs'
      - 'mobile/current.json'
      - 'supabase/migrations/*_prepare_default_flow_opening.sql'
      - '.github/scripts/flow-opening-window.cjs'
      - '.github/workflows/flow-opening-window.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      LTS_FLOW_OPENING_RELEASE: v496
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/flow-opening-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
          node .github/scripts/historical-consolidated-cash.cjs
          node .github/scripts/flow-opening-window.cjs
