name: V231 expense source and detail reliability
on:
  push:
    branches: ['work/v232-expense-completion']
  pull_request:
    paths: ['releases/v231/**', 'releases/v229-1/**', 'releases/v229/**', '.github/scripts/lts_v229*', '.github/workflows/v231.yml', '.github/scripts/lts_v231*', 'supabase/migrations/*_v232_*.sql', 'supabase/tests/v232*', 'supabase/migrations/*_v230_*.sql', 'supabase/tests/v230*', 'supabase/migrations/*_v231_*.sql', 'supabase/tests/v231*']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LTS_RELEASE: v231
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bounded reads and session isolation
        run: node .github/scripts/lts_v229_transport_gate.js
      - name: Sequential Flow reads and bounded transient recovery
        run: node .github/scripts/lts_v229_flow_gate.js
      - name: Open Finance authentication and bank-specific failure handling
        run: node .github/scripts/lts_v226_open_finance_gate.mjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Immutable resources and historical preservation
        run: node .github/scripts/lts_v225_static_gate.js
      - name: Start isolated test server
        run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v226-http.log 2>&1 &
      - name: Current cash and confirmed bank refresh
        run: mkdir -p qa && node .github/scripts/lts_v229_startup_gate.js
      - name: Desktop and mobile card details, classification, totals and preserved workflows
        if: success() || failure()
        run: node .github/scripts/lts_v229_cards_gate.js
      - name: RSU availability arithmetic and feedback coverage
        if: success() || failure()
        run: node .github/scripts/lts_v229_reliability_gate.js
      - name: Complete expense details, history, classification and mobile legibility
        if: success() || failure()
        run: node .github/scripts/lts_v231_expense_drilldown_gate.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v231-controlled-regression
          path: qa/
