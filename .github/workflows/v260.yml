name: V260 coverage deficits and invoice source dates
on:
  push:
    branches: ['codex/v260-coverage-invoice']
  pull_request:
    paths: ['releases/v260/**', 'backend/patches/*v260*', 'backend/qa/*v260*', '.github/scripts/lts_v*', '.github/workflows/v260.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      LTS_RELEASE: v260
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node backend/qa/lts_v245_source_gate.js
      - run: node .github/scripts/lts_v260_detail_gate.js
      - run: node .github/scripts/lts_v225_static_gate.js
      - run: node .github/scripts/lts_v229_flow_gate.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Verify baked Chromium without downloading dependencies
        timeout-minutes: 2
        run: |
          node <<'NODE'
          const fs = require('node:fs'), assert = require('node:assert/strict');
          const {chromium} = require('playwright');
          assert.equal(require('playwright/package.json').version, '1.58.2');
          assert.ok(chromium.executablePath().startsWith('/ms-playwright/'));
          (async () => {
            const browser = await chromium.launch({headless: true});
            try {
              const page = await browser.newPage();
              await page.setContent('<title>LTS CI smoke</title><p>Ambiente de teste</p>');
              assert.equal(await page.title(), 'LTS CI smoke');
              assert.equal(await page.locator('p').isVisible(), true);
              fs.mkdirSync('qa', {recursive: true});
              fs.writeFileSync('qa/v299-browser-environment.json', JSON.stringify({
                pass: true, scope: 'offline-browser-environment-only',
                image: 'mcr.microsoft.com/playwright:v1.58.2-noble',
                package_version: '1.58.2', browser: browser.version(),
                executable: chromium.executablePath()
              }, null, 2));
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v245-http.log 2>&1 &
      - name: Year selection, daily chart, loading and editing
        run: node .github/scripts/lts_v245_regression_gate.js
      - name: Startup and bank refresh
        if: success() || failure()
        run: node .github/scripts/lts_v229_startup_gate.js
      - name: Source-backed historical positions
        if: success() || failure()
        run: node .github/scripts/lts_v238_history_gate.js
      - name: Historical cycles and columns
        if: success() || failure()
        run: node .github/scripts/lts_v237_history_audit_gate.js
      - name: Balances and invalidation
        if: success() || failure()
        run: node .github/scripts/lts_v236_balance_gate.js
      - name: Cards and documents
        if: success() || failure()
        run: node .github/scripts/lts_v233_document_gate.js
      - name: Classifications and card flows
        if: success() || failure()
        run: node .github/scripts/lts_v229_cards_gate.js
      - name: Source signs
        if: success() || failure()
        run: node .github/scripts/lts_v234_source_gate.js
      - name: Historical inventory
        if: success() || failure()
        run: node .github/scripts/lts_v235_inventory_gate.js
      - name: Expense detail
        if: success() || failure()
        run: node .github/scripts/lts_v231_expense_drilldown_gate.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v260-regression
          path: qa/
