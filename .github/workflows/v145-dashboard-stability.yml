name: LTS v145 Dashboard stability
on:
  push:
    branches: [main, v145-dashboard-stability]
    paths:
      - 'homologacao-current.json'
      - 'homologacao.html'
      - 'wip35-v145-candidate.html'
      - 'wip35-v145-dashboard-stability.js'
      - '.github/scripts/lts_v145_dashboard_stability_smoke.js'
      - '.github/scripts/lts_button_contract_audit.js'
      - '.github/workflows/v145-dashboard-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate v145 architecture
        run: |
          node --check wip35-v145-dashboard-stability.js
          node --check .github/scripts/lts_v145_dashboard_stability_smoke.js
          python - <<'PY'
          from pathlib import Path
          html=Path('wip35-v145-candidate.html').read_text(encoding='utf-8')
          js=Path('wip35-v145-dashboard-stability.js').read_text(encoding='utf-8')
          required_html=[
            'wip35-v142-candidate.html?v145-parent',
            'wip35-v143-life-real.js?v143-life-real-v1',
            'wip35-v143-feedback-polish.js?v143-feedback-polish-v2',
            'wip35-v143-ownership.js?v143-ownership-v1',
            'wip35-v145-dashboard-stability.js?v145-dashboard-stability-v1',
            'wip35-v144-lexical-bridge.js?v144-lexical-bridge-v1',
            'wip35-v144-updates-layout.js?v144-updates-layout-v3',
            "__LTS_TOP_CANDIDATE_VERSION='v145'"
          ]
          required_js=[
            'single-refresh-title-stable-v1',
            '__LTS_V142_DASHBOARD_LOADING',
            'Sua vida financeira, em uma tela.',
            'Tenho dinheiro hoje? O que exige ação? Para onde estou indo?',
            '__ltsV145Stable',
            'LTS_V145_REFRESH_DASHBOARD'
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_js if x not in js]
          assert not missing, 'v145 markers missing: '+repr(missing)
          forbidden=['insert into','delete from','update public.','.upsert(']
          leaked=[x for x in forbidden if x.lower() in js.lower()]
          assert not leaked, 'direct financial write leaked into v145 browser layer: '+repr(leaked)
          assert '#badge' not in html and 'id="badge"' not in html, 'v145 must not expose inherited candidate badge that v143 rewrites'
          print('v145_dashboard_stability_static=PASS')
          PY
      - name: Audit inherited button wiring contracts
        run: node .github/scripts/lts_button_contract_audit.js
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Re-run inherited parser/static candidate gate
        run: python .github/scripts/lts_candidate_smoke.py
      - name: Re-run inherited v142 browser smoke
        run: |
          python3 -m http.server 8765 >/tmp/lts-http-v142-v145.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node .github/scripts/lts_candidate_browser_smoke.js
      - name: Re-run inherited v143 runtime/navigation smoke
        run: |
          python3 -m http.server 8766 >/tmp/lts-http-v143-v145.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          sed 's/8765/8766/g' .github/scripts/lts_v143_browser_smoke.js >/tmp/lts_v143_browser_smoke.js
          NODE_PATH="$PWD/node_modules" node /tmp/lts_v143_browser_smoke.js
      - name: Run temporal Dashboard stability smoke
        run: |
          python3 -m http.server 8771 >/tmp/lts-http-v145.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node .github/scripts/lts_v145_dashboard_stability_smoke.js
      - name: Upload v145 stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wip35-v145-dashboard-stability
          path: |
            v145-dashboard-stability-smoke-result.json
            candidate-smoke-result.txt
            candidate-browser-smoke-result.json
            v143-browser-smoke-result.json
            button-contract-audit-result.json
          if-no-files-found: error
