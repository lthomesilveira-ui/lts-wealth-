name: V240 configured and documentary FGTS scenarios
on:
  push:
    branches: ['work/v240-fgts-scenarios']
  pull_request:
    paths: ['releases/v240/**', '.github/scripts/lts_v240*', '.github/workflows/v240.yml', 'backend/patches/*v240.sql']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LTS_RELEASE: v240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/lts_v225_static_gate.js
      - run: node .github/scripts/lts_v229_flow_gate.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v240-http.log 2>&1 &
      - name: Configured and documentary FGTS with daily minima
        run: node .github/scripts/lts_v240_fgts_scenario_gate.js
      - name: Bounded source positions and slice
        if: success() || failure()
        run: node .github/scripts/lts_v238_history_gate.js
      - name: Historical columns and month audit
        if: success() || failure()
        run: node .github/scripts/lts_v237_history_audit_gate.js
      - name: Canonical balances and navigation
        if: success() || failure()
        run: node .github/scripts/lts_v236_balance_gate.js
      - name: Cards and full review
        if: success() || failure()
        run: node .github/scripts/lts_v233_document_gate.js
      - name: Full cards, explicit draft classification and preserved flows
        if: success() || failure()
        run: node .github/scripts/lts_v229_cards_gate.js
      - name: Startup ordering, bounded errors and sync completion
        if: success() || failure()
        run: node .github/scripts/lts_v229_startup_gate.js
      - name: Source signs and classification
        if: success() || failure()
        run: node .github/scripts/lts_v234_source_gate.js
      - name: Historical cycles and inventory
        if: success() || failure()
        run: node .github/scripts/lts_v235_inventory_gate.js
      - name: Expense details
        if: success() || failure()
        run: node .github/scripts/lts_v231_expense_drilldown_gate.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v240-browser-regression
          path: qa/
