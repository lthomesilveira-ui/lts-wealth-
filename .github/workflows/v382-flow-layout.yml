name: V382 compact Flow controls
on:
  pull_request:
    paths: ['releases/v393/**','releases/v391/**','releases/v390/**','releases/v389/**','releases/v386/**','releases/v385/**','releases/v382/**','mobile/current.json','.github/scripts/*v382*','.github/workflows/v382-flow-layout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flow-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      LTS_MOBILE_RELEASE: v393
      LTS_FLOW_RELEASE: v393
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/lts_v382_release_contract.cjs
      - run: node .github/scripts/lts_v379_period_contract.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v382-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/lts_v382_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v382-flow-layout
          path: qa/v382/
