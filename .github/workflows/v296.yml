name: V296 incoming classifications and populated Actions
on:
  pull_request:
    paths: ['releases/v296/**', 'backend/patches/v296/**', 'backend/operations/extend_confirmed_income_sender_v296.sql', 'backend/qa/lts_v296*', '.github/scripts/lts_v296*', '.github/workflows/v296.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-and-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve releases and financial contracts
        run: |
          node .github/scripts/lts_v296_release_contract.cjs
          node .github/scripts/lts_v272_payment_contract.cjs releases/v296/lts-v226-card-composition.js
          python3 backend/qa/lts_v269_classification_contract.py
          node backend/qa/lts_v290_future_import.test.mjs
          node backend/qa/lts_v249_card_normalization.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Serve application
        run: python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v296-http.log 2>&1 &
      - name: Verify receipts and populated mobile Actions
        run: node .github/scripts/lts_v296_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v296-homologation-evidence
          path: qa/v296/
