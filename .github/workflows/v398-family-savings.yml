name: V398 family savings indexation
on:
  pull_request:
    paths: ['backend/patches/v398/**','backend/tools/family_savings_v398/**','.github/workflows/v398-family-savings.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -v ON_ERROR_STOP=1 -f backend/tools/family_savings_v398/fixture.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v398/family_savings.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v398/savings_collection.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v398/family_savings.sql
          psql -v ON_ERROR_STOP=1 -f backend/patches/v398/savings_collection.sql
          psql -v ON_ERROR_STOP=1 -f backend/tools/family_savings_v398/verify.sql
