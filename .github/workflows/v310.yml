name: V310 reuse existing documentary contract payments
on:
  pull_request:
    paths: ['backend/patches/v310/**', 'backend/qa/*v310*', 'backend/qa/v310_*', 'backend/tools/build_contract_patch_v310.py', '.github/scripts/contract_payments_v310_browser.cjs', '.github/workflows/v310.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-state:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      LTS_RELEASE: v309
      LTS_V310_FIXTURE_ENGINE: postgresql17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 backend/qa/lts_v310_ci.py
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Serve unchanged V309 and await readiness
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 > /tmp/lts-v310-http.log 2>&1 &
          node .github/scripts/lts_v309_wait_http.cjs
      - run: node .github/scripts/contract_payments_v310_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v310-native-contract-and-browser-evidence
          path: qa/v310/
