name: Bank review decision isolated QA
on:
  pull_request:
    paths: ['backend/tools/review_decision_scope/**','.github/workflows/review-decision-scope.yml']
permissions:
  contents: read
jobs:
  native-postgres:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official native PostgreSQL17
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/17/bin/postgres ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update
            sudo apt-get install --yes postgresql-17
          fi
          /usr/lib/postgresql/17/bin/postgres --version
      - name: Guarded installer and actual writer contract with invented data
        env:
          LTS_INSTALLER_PG_BIN: /usr/lib/postgresql/17/bin
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 backend/tools/review_decision_scope/build.py
          git diff --exit-code -- backend/tools/review_decision_scope/install.sql backend/tools/review_decision_scope/rollback.sql
          python3 backend/tools/review_decision_scope/test_native.py
