name: V415 durable refresh backend
on:
  pull_request:
    paths:
      - 'backend/patches/v415/**'
      - 'backend/qa/v415*'
      - 'backend/qa/fixtures/v415*'
      - 'backend/tools/durable_refresh_v415/**'
      - 'supabase/migrations/*v415_durable_product_refresh.sql'
      - '.github/workflows/v415-durable-refresh-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
    steps:
      - uses: actions/checkout@v4
      - name: Compose exact migration and synthetic contracts
        run: |
          python3 backend/tools/durable_refresh_v415/test_sql.py > /tmp/v415-core.sql
          python3 backend/tools/durable_refresh_v415/test_sql.py --setup-only > /tmp/v415-native-setup.sql
          python3 backend/tools/durable_refresh_v415/test_sql.py --manifest > /tmp/v415-manifest.json
      - name: Verify guarded migration, access, rollback and retry contracts
        run: |
          createdb v415_core
          psql -X -d v415_core -v ON_ERROR_STOP=1 -At -f /tmp/v415-core.sql > /tmp/v415-core.log
      - name: Verify real commit boundaries and concurrent invalidation
        run: |
          createdb v415_concurrency
          psql -X -d v415_concurrency -v ON_ERROR_STOP=1 -At -f /tmp/v415-native-setup.sql > /tmp/v415-native-setup.log
          python3 backend/tools/durable_refresh_v415/concurrency_test.py --database v415_concurrency --output /tmp/v415-concurrency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v415-postgres17-backend-proof
          path: |
            /tmp/v415-core.log
            /tmp/v415-native-setup.log
            /tmp/v415-concurrency.json
            /tmp/v415-manifest.json
