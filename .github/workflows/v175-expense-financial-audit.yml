name: V175 financial expense audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/v175-expense-financial-audit-20260918
    paths:
      - 'wip35-v175-candidate.html'
      - 'lts-v175-expense-financial-audit.js'
      - 'lts-v175-expense-financial-audit.css'
      - 'backups/V175_*'
      - '.github/scripts/lts_v175_expense_financial_audit_contract.js'
      - '.github/scripts/lts_v175_expense_financial_audit_gate.js'
      - '.github/workflows/v175-expense-financial-audit.yml'

permissions:
  contents: read

jobs:
  contract-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V175 static contracts
        run: |
          node --check lts-v175-expense-financial-audit.js
          node --check .github/scripts/lts_v175_expense_financial_audit_contract.js
          node --check .github/scripts/lts_v175_expense_financial_audit_gate.js
          node .github/scripts/lts_v175_expense_financial_audit_contract.js
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.55.0
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Validate V175 desktop and mobile
        run: |
          python3 -m http.server 8785 >/tmp/lts-v175-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 240s node .github/scripts/lts_v175_expense_financial_audit_gate.js
      - name: Re-run protected contracts
        run: |
          node .github/scripts/lts_v174_v173_review_contract.js
          node .github/scripts/lts_v173_v172_feedback_contract.js
          node .github/scripts/lts_v172_v171_review_contract.js
          node .github/scripts/lts_v171_v170_review_contract.js
          node .github/scripts/lts_v170_v169_review_contract.js
          python .github/scripts/lts_integrated_flow_gate.py
          python .github/scripts/lts_flow_bank_scope_gate.py
          python .github/scripts/lts_invoice_reading_order_gate.py
          python .github/scripts/lts_flow_documentary_rollforward_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v175-financial-expense-audit
          path: |
            v175-expense-financial-audit-result.json
            v175-*.png
            integrated-flow-result.json
            integrated-*.png
            bank-scope-result.json
            bank-scope-*.png
            invoice-reading-order-result.json
            invoice-order-*.png
            flow-documentary-rollforward-result.json
          if-no-files-found: warn
