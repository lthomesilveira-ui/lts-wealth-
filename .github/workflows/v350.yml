name: V350 documented one-occurrence forecasts
on:
  pull_request:
    paths: ['backend/patches/v350/**','backend/qa/*v350*','backend/qa/fixtures/v350*','.github/workflows/v350.yml','docs/V350_DOCUMENTED_FORECASTS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
      - run: python3 backend/qa/lts_v350_ci_sql.py > /tmp/lts-v350.sql
      - run: psql -v ON_ERROR_STOP=1 -At -f /tmp/lts-v350.sql > /tmp/lts-v350-result.log
      - if: failure()
        run: tail -c 12000 /tmp/lts-v350-result.log || true
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(s)for s in Path('/tmp/lts-v350-result.log').read_text().splitlines()if s.startswith('{')]
          rows=[r for r in rows if r.get('version')==350]
          assert len(rows)==1 and rows[0]['pass'] and rows[0]['version']==350
          assert rows[0]['rejection_cases']==9
          print(json.dumps(rows[0]))
          PY
