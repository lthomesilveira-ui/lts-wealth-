function lineChart(vals,validated){const a=(vals||[]).filter(x=>num(x)!=null);if(!validated||a.length<2)return `<div class="chart-empty"><div><b>Planejamento em revalidação</b><br><br>FGTS conservador, sem aportes futuros. Nenhum valor antigo é usado como previsão atual.</div></div>`;const W=520,H=190,p=18,min=Math.min(...a,0),max=Math.max(...a,0),sp=Math.max(1,max-min),pts=a.map((v,i)=>[p+(W-2*p)*i/(a.length-1),p+(H-2*p)*(1-(v-min)/sp)]),zero=p+(H-2*p)*(1-(0-min)/sp);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g stroke="#e8edf2" stroke-width="1">${[.2,.4,.6,.8].map(q=>`<line x1="${p}" y1="${H*q}" x2="${W-p}" y2="${H*q}"/>`).join('')}</g><line x1="${p}" y1="${zero}" x2="${W-p}" y2="${zero}" stroke="#aeb8c5"/><path d="M${pts.map(x=>x.join(',')).join(' L')}" fill="none" stroke="#3479e7" stroke-width="2.5"/>${pts.map((x,i)=>`<circle cx="${x[0]}" cy="${x[1]}" r="${a[i]<0?4:2.5}" fill="${a[i]<0?'#e53e4d':'#3479e7'}"/>`).join('')}</svg>`}
function kpi(label,value,meta,vals,color='#0aa86e',cls=''){return `<article class="card kpi ${cls}"><label>${label}</label><strong>${value}</strong><div class="meta">${meta}</div><div class="spark">${sparkline(vals,color)}</div></article>`}
