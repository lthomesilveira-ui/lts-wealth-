<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>LTS Health · Inbox</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#112b46;--navy2:#173b61;--gold:#c39a5b;--bg:#f4f6f8;--ink:#183047;--mut:#748296;--bd:#dde4eb;--ok:#237a5a;--warn:#9a6a1d;--bad:#a64747}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}.hdr{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}.hdrin{max-width:840px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-weight:900}.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:8px 10px;font-size:12px}.wrap{max-width:840px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}.title{font-weight:900;font-size:18px;margin:0 0 6px}.mut{color:var(--mut);font-size:12px;line-height:1.5}.field{margin-top:14px}.field label{display:block;font-size:11px;font-weight:850;color:var(--mut);margin-bottom:6px}.field select,.field input[type=file]{width:100%;background:#fff;border:1px solid var(--bd);border-radius:11px;padding:11px}.btn{border:0;border-radius:10px;padding:12px 14px;background:var(--navy);color:#fff;font-weight:850;width:100%;margin-top:14px}.btn:disabled{opacity:.55}.msg{margin-top:10px;font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}.row{padding:11px 0;border-bottom:1px solid var(--bd);font-size:12px}.row:last-child{border:0}.pill{display:inline-block;border-radius:999px;padding:4px 7px;background:#eef3f7;color:var(--mut);font-size:9px;font-weight:850}.pill.warn{background:#fff5de;color:var(--warn)}.pill.ok{background:#e9f5ef;color:var(--ok)}
</style>
</head>
<body>
<header class="hdr"><div class="hdrin"><div class="top"><div class="brand"><div class="logo">L</div><div><b>LTS Health</b><div style="font-size:10px;opacity:.72">Health Data Inbox</div></div></div><a class="back" href="./">Voltar ao app</a></div></div></header>
<main class="wrap">
<div class="card"><div class="title">Enviar dados de saúde</div><div class="mut">Arquivos ficam em armazenamento privado e associados apenas à sua conta. O upload não significa que o conteúdo já foi interpretado: ele entra numa fila de processamento e revisão.</div>
<div class="field"><label>Tipo de fonte</label><select id="sourceType"><option value="myfitnesspal">MyFitnessPal</option><option value="labs">Exames laboratoriais</option><option value="apple_health">Apple Health</option><option value="polar">Polar</option><option value="body_composition">Bioimpedância</option><option value="documents">Laudos/documentos</option><option value="other">Outro</option></select></div>
<div class="field"><label>Arquivo</label><input id="fileInput" type="file" accept=".csv,.json,.pdf,.jpg,.jpeg,.png,.heic,.zip,.xml,text/csv,application/json,application/pdf,image/jpeg,image/png,image/heic,application/zip,application/xml,text/xml" /></div>
<button id="uploadBtn" class="btn">Enviar para o Inbox</button><div id="msg" class="msg mut"></div></div>
<div class="card"><div class="title">Arquivos enviados</div><div id="uploads"><div class="mut">Carregando…</div></div></div>
</main>
<script>
const SUPABASE_URL='https://tadhkamnwtsbdozwkyut.supabase.co';
const SUPABASE_KEY='sb_publishable__p3SAbpThUIKtDr7A4llPw_AVkOaNkm';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString('pt-BR'):'—';
function safeName(name){return name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g,'_').replace(/^_+|_+$/g,'').slice(-140)||'arquivo'}
async function getSession(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./';return null}return session}
async function loadUploads(){const session=await getSession();if(!session)return;const {data,error}=await sb.from('health_uploads').select('*').order('created_at',{ascending:false}).limit(50);const el=document.getElementById('uploads');if(error){el.innerHTML='<div class="bad">Não foi possível carregar o Inbox.</div>';return}el.innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="row"><b>${esc(x.original_filename)}</b><div class="mut">${esc(x.source_type)} · ${fmt(x.created_at)}</div><div style="margin-top:5px"><span class="pill ${x.status==='imported'?'ok':'warn'}">${esc(x.status)}</span></div></div>`).join(''):'<div class="mut">Nenhum arquivo enviado ainda.</div>'}
document.getElementById('uploadBtn').onclick=async()=>{const btn=document.getElementById('uploadBtn'),msg=document.getElementById('msg'),file=document.getElementById('fileInput').files[0],sourceType=document.getElementById('sourceType').value;if(!file){msg.textContent='Escolha um arquivo.';msg.className='msg bad';return}if(file.size>50*1024*1024){msg.textContent='O arquivo excede 50 MB.';msg.className='msg bad';return}const session=await getSession();if(!session)return;btn.disabled=true;msg.textContent='Enviando com segurança…';msg.className='msg mut';try{const path=`${session.user.id}/${Date.now()}_${safeName(file.name)}`;const up=await sb.storage.from('health-inbox').upload(path,file,{contentType:file.type||undefined,upsert:false});if(up.error)throw up.error;const ins=await sb.from('health_uploads').insert({user_id:session.user.id,source_type:sourceType,original_filename:file.name,storage_path:path,mime_type:file.type||null,size_bytes:file.size,status:'uploaded'});if(ins.error){await sb.storage.from('health-inbox').remove([path]);throw ins.error}msg.textContent='Upload concluído. O arquivo está no Inbox privado aguardando processamento.';msg.className='msg ok';document.getElementById('fileInput').value='';await loadUploads()}catch(e){msg.textContent='Falha no upload: '+(e?.message||'erro desconhecido');msg.className='msg bad'}finally{btn.disabled=false}};
loadUploads();
</script>
</body></html>
