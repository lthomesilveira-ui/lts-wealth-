  function quick(w){return `<div class="u142-quick"><div class="u142-quickcopy"><span>Lançamento rápido</span><b>Escreva como você fala.</b><small>Despesa ou receita: o LTS interpreta e leva para revisão antes de gravar. Resgate/aplicação continuam protegidos até a operação de liquidez ser validada.</small></div><div class="u142-quickform"><input id="u142Phrase" placeholder="Ex.: paguei 850 de pediatra hoje no Itaú"><button type="button" onclick="u142QuickInterpret()">Interpretar</button><div id="u142QuickMsg" class="u142-quickmsg"></div></div></div>`}
  function installQuick(w){
    if(w.__LTS_V142_QUICK)return;w.__LTS_V142_QUICK=true;
    const base=w.atualizacoes;
    w.atualizacoes=function(){return quick(w)+(typeof base==='function'?base():'')};
    w.u142QuickInterpret=function(){
      const d=w.document,inp=d.getElementById('u142Phrase'),msg=d.getElementById('u142QuickMsg'),text=String(inp?.value||'').trim();if(!text)return;
      const n=text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
      if(/\bresgat|\baplic/.test(n)){if(msg)msg.textContent='Operação de liquidez reconhecida. Não vou tratá-la como despesa/receita; a paridade banco + ativo está sendo reconectada antes de liberar a gravação.';return}
      w.V='Entradas';w.renderNav();w.render();setTimeout(()=>{const p=d.getElementById('phrase'),b=d.getElementById('pbtn');if(p){p.value=text;b?.click()}},40)
    };
  }
  function installPlanning(w){
    if(w.__LTS_V142_PLANNING)return;w.__LTS_V142_PLANNING=true;
    w.planejamento=function(){
      const l=w.D?.planning_ladder||{},layers=l.layers||[],eps=l.gap_episodes||[],fg=l.fgts_access||{},gap=l.first_real_gap_date,first=eps[0]||{},fmt=w.fmt,brl=w.brl,esc=w.esc,num=w.num;
      const cash=layers.find(x=>x.id==='cash')||{},d01=layers.find(x=>x.id==='d01')||{},vest=layers.find(x=>x.id==='rsu_vested')||{},future=layers.find(x=>x.id==='future_vestings')||{};
      const now=num(cash.starting_amount)+num(d01.starting_amount)+num(vest.starting_amount);
      const story=[
        ['1 · Conta corrente',brl(cash.starting_amount),cash.first_need_next_layer?`até ${fmt(cash.first_need_next_layer)}`:'sem ruptura'],
        ['2 · + Cofrinho',brl(d01.starting_amount),d01.first_need_next_layer?`próxima camada em ${fmt(d01.first_need_next_layer)}`:'não exigido'],
        ['3 · + RSU vested',brl(vest.starting_amount),vest.first_need_next_layer?`próxima camada em ${fmt(vest.first_need_next_layer)}`:'não exigido'],
        ['4 · Novos vestings','Condicional',future.first_need_next_layer?`gap em ${fmt(future.first_need_next_layer)}`:'cobre o horizonte'],
        ['5 · FGTS',brl(fg.amount_brl),fg.request_by_date?`pedir por volta de ${fmt(fg.request_by_date)}`:'contingência D+30']
      ];
      return `<div class="u142-page"><div class="u142-head"><div><span class="u142-eye">Planejamento</span><h1>${gap?`Seu primeiro aperto real é em ${fmt(gap)}.`:'Sua liquidez cobre o horizonte.'}</h1><p>A leitura é simples: o que você tem hoje, qual recurso entra depois e quando precisa agir. Recursos futuros só entram quando ficam disponíveis.</p></div><div class="u142-asof">${fmt(l.from)} → ${fmt(l.to)}</div></div><div class="u142-hero"><div class="u142-main"><span>Liquidez realizável hoje</span><strong>${brl(now)}</strong><small>Conta corrente + Cofrinho + RSU já vested. Não inclui novos vestings nem FGTS.</small></div><div class="u142-kpi"><span>Primeiro gap real</span><b>${gap?fmt(gap):'Nenhum'}</b><small>depois dos vestings programados</small></div><div class="u142-kpi"><span>Pior saldo</span><b class="${num(first.worst_balance)<0?'neg':''}">${first.worst_balance!=null?brl(first.worst_balance):'—'}</b><small>${first.recovery_date?`recupera em ${fmt(first.recovery_date)}`:'sem episódio negativo'}</small></div><div class="u142-kpi"><span>FGTS</span><b>${brl(fg.amount_brl)}</b><small>${fg.request_by_date?`se precisar, solicitar até ~${fmt(fg.request_by_date)}`:'contingência ~D+30'}</small></div></div><div class="u142-panel"><div class="u142-panelhead"><div><span>De onde vem o dinheiro</span><h3>As camadas na ordem em que você usaria</h3></div></div><div class="u142-story">${story.map((x,i)=>`<div class="u142-step ${i===4?'warn':''}"><em>${esc(x[0])}</em><b>${esc(x[1])}</b><span>${esc(x[2])}</span></div>`).join('')}</div></div><div class="u142-decision"><div class="u142-callout"><b>O que você precisa saber agora</b><span>${gap?`Pelo fluxo atual, o caixa cruza zero em ${fmt(gap)}. O pior ponto do primeiro episódio é ${brl(first.worst_balance)} e a recuperação ocorre em ${fmt(first.recovery_date)}.`:'Não há gap real no horizonte atual.'}</span></div><div class="u142-callout"><b>FGTS não é caixa automático</b><span>${fg.request_by_date?`Ele é contingência com prazo aproximado de 30 dias. Para estar disponível no primeiro gap, a referência de solicitação é ${fmt(fg.request_by_date)}.`:'Permanece separado do caixa imediato.'}</span></div></div>${eps.length?`<div class="u142-panel"><div class="u142-panelhead"><div><span>Depois disso</span><h3>${eps.length} episódio(s) de saldo negativo</h3></div></div>${eps.map(e=>`<div class="u142-minirow"><div><b>${fmt(e.start_date)} → ${fmt(e.end_date)}</b><span>${e.days} dia(s) · recupera em ${fmt(e.recovery_date)}</span></div><strong class="neg">${brl(e.worst_balance)}</strong></div>`).join('')}<div class="u142-actions"><button class="dashact" data-dashdest="Fluxo Diário">Abrir trajetória diária</button></div></div>`:''}</div>`
    };
  }
  function installWealth(w){
    if(w.__LTS_V142_WEALTH)return;w.__LTS_V142_WEALTH=true;
    w.patrimonio=function(){
      const W=w.D?.wealth||{},vals=W.market_valuations||{},cv=vals.cipo_396||{},vv=vals.volvo_xc40||{},hist=W.cipo_396?.historical_excel||{},docs=w.D?.documentary_commitments?.items||[],ci=docs.find(x=>x.commitment_id==='cipo_396')||{},accs=W.accounts||[],sn=W.asset_layers?.documentary_snapshots||[],num=w.num,brl=w.brl,fmt=w.fmt,esc=w.esc,sum=w.sum;
      const bank=sum(accs.map(x=>x.balance)),d0=sum(sn.filter(x=>x.liquidity_class==='D+0').map(x=>x.value_brl)),vest=sum(sn.filter(x=>x.liquidity_class==='D+3').map(x=>x.value_brl)),fgts=sum(sn.filter(x=>x.liquidity_class==='restricted').map(x=>x.value_brl)),future=sum(sn.filter(x=>x.liquidity_class==='future').map(x=>x.value_brl));
      const cVal=num(cv.central_value_brl),cDebt=num(ci.debt_balance||W.cipo_396?.mortgage?.current_debt_balance),cEq=cVal-cDebt,vVal=num(vv.central_value_brl),vDebt=num(vv.metadata?.documented_total_financed_brl),vEq=vVal-vDebt,liquid=bank+d0+vest,assets=liquid+fgts+cVal+vVal,debts=cDebt+vDebt,net=assets-debts;
      const com=w.D?.commitments?.commitments||[],cooph=com.find(x=>x.id==='coopharma')||{},fam=com.find(x=>x.id==='pai_mae')||{};
      return `<div class="u142-page"><div class="u142-head"><div><span class="u142-eye">Patrimônio</span><h1>Quanto você tem, quanto deve e quanto é seu.</h1><p>Primeiro a visão rápida. Detalhes técnicos e compromissos que não têm saldo devedor certificado ficam abaixo, sem poluir a leitura.</p></div><div class="u142-asof">Posições até ${fmt(accs.map(x=>x.as_of).sort().at(-1)||w.today())}</div></div><div class="u142-hero"><div class="u142-main"><span>Patrimônio líquido estimado</span><strong>${brl(net)}</strong><small>Ativos considerados ${brl(assets)} menos dívidas atuais conhecidas ${brl(debts)}.</small></div><div class="u142-kpi"><span>Liquidez até D+3</span><b>${brl(liquid)}</b><small>caixa + Cofrinho + RSU vested</small></div><div class="u142-kpi"><span>Equity imóvel</span><b>${brl(cEq)}</b><small>${brl(cVal)} valor − ${brl(cDebt)} dívida</small></div><div class="u142-kpi"><span>Equity Volvo</span><b>${brl(vEq)}</b><small>estimativa ainda depende de trim/km</small></div></div><div class="u142-assets"><div class="u142-asset w130-asset"><div class="u142-assettop"><div><span class="u142-eye">Imóvel</span><h3>CIPÓ 396 · cobertura duplex</h3></div><span class="u142-tag">175 m² · 4 vagas · jacuzzi</span></div><div class="u142-facts"><div><span>Valor estimado</span><b>${brl(cVal)}</b><small>${brl(cv.low_value_brl)} → ${brl(cv.high_value_brl)}</small></div><div><span>Dívida atual</span><b>${brl(cDebt)}</b><small>posição documental</small></div><div><span>Equity</span><b>${brl(cEq)}</b><small>valor − dívida</small></div></div><div class="u142-footnote">Compra + reforma no histórico: ${brl(hist.purchase_plus_reform_accum_brl)}. Reformas/melhorias: ${brl(hist.reforms_improvements_brl)}. O preço pedido do próprio imóvel não é tratado como venda comparável.</div></div><div class="u142-asset"><div class="u142-assettop"><div><span class="u142-eye">Veículo</span><h3>Volvo XC40 · 2019/2020</h3></div><span class="u142-tag">blindado Avalon</span></div><div class="u142-facts"><div><span>Valor estimado</span><b>${brl(vVal)}</b><small>${brl(vv.low_value_brl)} → ${brl(vv.high_value_brl)}</small></div><div><span>Dívida conhecida</span><b>${brl(vDebt)}</b><small>posição documental disponível</small></div><div><span>Equity</span><b>${brl(vEq)}</b><small>valor − dívida</small></div></div><div class="u142-footnote">Faixa provisória enquanto versão/trim e quilometragem não estiverem documentadas.</div></div></div><div class="u142-panel"><div class="u142-panelhead"><div><span>Liquidez</span><h3>O que pode virar caixa</h3></div></div><div class="u142-minirow"><div><b>Caixa bancário + Cofrinho + RSU vested</b><span>até D+3</span></div><strong>${brl(liquid)}</strong></div><div class="u142-minirow"><div><b>FGTS</b><span>contingência ~D+30</span></div><strong>${brl(fgts)}</strong></div><div class="u142-minirow"><div><b>Awards futuros</b><span>fora do patrimônio adquirido</span></div><strong>${brl(future)}</strong></div></div><details class="u142-fold"><summary>Compromissos que não entram como dívida atual</summary><div class="u142-minirow"><div><b>Coopharma</b><span>fluxo econômico futuro; saldo atual não certificado</span></div><strong>${brl(cooph.remaining_economic_outflow)}</strong></div><div class="u142-minirow"><div><b>Pai e Mãe</b><span>cronograma histórico; saldo atual não certificado</span></div><strong>${brl(fam.remaining_scheduled_outflow)}</strong></div></details></div>`
    };
  }
  function install(){
    const z=chain();if(!z||!z.w)return;hideBadges(z.docs);const w=z.w,d=z.d;if(w.__LTS_LEXICAL_BRIDGE!=='v140')return;
    w.__LTS_TOP_CANDIDATE_VERSION='v142';w.LTS_CANDIDATE_UX='v142-quick-planning-wealth-density-recovery';badge.textContent='CANDIDATA v142 · UX recuperada';
    try{const label=d.querySelector('.brand small');if(label)label.textContent='WIP35-v142 · candidata para homologação'}catch(e){}
    css(d);installQuick(w);installPlanning(w);installWealth(w);
    if(wired!==w){wired=w;setTimeout(()=>{try{if(w.D&&['Atualizações','Planejamento','Patrimônio','Despesas'].includes(w.V))w.render()}catch(e){}},100)}
  }
  shell.addEventListener('load',()=>setTimeout(install,180));setInterval(install,900);
})();
