<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LTS Wealth · Homologação v151</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}
#shell{border:0;width:100%;height:100%;display:block}
#badge{position:fixed;z-index:2147483647;right:8px;top:7px;padding:5px 8px;border-radius:999px;background:#102a47;color:#fff;font:700 10px/1.1 Arial,sans-serif;box-shadow:0 2px 8px #0002;pointer-events:none}
</style>
</head>
<body>
<div id="badge">CANDIDATA v151 · validação interna</div>
<iframe id="shell" src="wip35-v150-candidate.html?v151-parent"></iframe>
<script>
(function(){
  const VERSION='v151',VISIBLE='WIP35-v151 · Homologação',BADGE='CANDIDATA v151 · validação interna';
  function docs(){
    const out=[]; let fr=document.getElementById('shell');
    for(let i=0;i<18&&fr;i++){
      try{const d=fr.contentDocument;if(!d)break;out.push(d);fr=d.querySelector('iframe')}catch(e){break}
    }
    return out;
  }
  function stampDoc(d){
    try{
      const b=d.getElementById('badge');if(b&&b.textContent!==BADGE)b.textContent=BADGE;
      d.querySelectorAll('.brand small').forEach(x=>{if(x.textContent!==VISIBLE)x.textContent=VISIBLE});
      d.querySelectorAll('.footer').forEach(x=>{if(x.textContent!=='Versão WIP35-v151')x.textContent='Versão WIP35-v151'});
    }catch(e){}
  }
  function refresh(){
    try{document.getElementById('badge').textContent=BADGE}catch(e){}
    docs().forEach(stampDoc);
  }
  function addScript(deep,id,src,onload){
    if(deep.getElementById(id))return false;
    const s=deep.createElement('script');s.id=id;s.src=src;if(onload)s.onload=onload;(deep.head||deep.documentElement).appendChild(s);return true;
  }
  function addScriptWithObserverShadow(deep,id,src,onload){
    if(deep.getElementById(id))return false;
    const dw=deep.defaultView;
    if(!dw)return false;
    const hadOwn=Object.prototype.hasOwnProperty.call(dw,'MutationObserver');
    const originalDescriptor=hadOwn?Object.getOwnPropertyDescriptor(dw,'MutationObserver'):null;
    const nativeObserver=dw.MutationObserver;
    let restored=false;
    const restore=()=>{
      if(restored)return;
      restored=true;
      try{
        if(hadOwn&&originalDescriptor)Object.defineProperty(dw,'MutationObserver',originalDescriptor);
        else{
          try{delete dw.MutationObserver}catch(e){}
          if(dw.MutationObserver!==nativeObserver)Object.defineProperty(dw,'MutationObserver',{configurable:true,writable:true,value:nativeObserver});
        }
      }catch(e){try{dw.MutationObserver=nativeObserver}catch(_) {}}
    };
    try{Object.defineProperty(dw,'MutationObserver',{configurable:true,writable:true,value:undefined})}
    catch(e){try{dw.MutationObserver=undefined}catch(_) {}}
    const s=deep.createElement('script');s.id=id;s.src=src;
    s.onload=()=>{restore();if(onload)onload()};
    s.onerror=()=>{restore();try{console.error('v151 layer script load failed')}catch(_) {}};
    (deep.head||deep.documentElement).appendChild(s);return true;
  }
  function inject(){
    refresh();const ds=docs(),deep=ds[ds.length-1];if(!deep)return false;const dw=deep.defaultView;
    const brl=v=>{try{return typeof dw?.brl==='function'?dw.brl(Number(v||0)):new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0))}catch(e){return String(v??'—')}};
    const expensePanelMarkup=()=>{
      try{
        const data=dw?.__V150_EXP?.data;if(!data)return '';
        const states=new Map((data.unassigned_states||[]).map(x=>[String(x.state),x]));
        const hist=states.get('documentary_detail_not_recovered')||{},sys=states.get('detail_available_system_review')||{},act=states.get('classification_and_context_pending')||{};
        return `<section id="v151ExpenseState" class="v151-exp-state"><div class="v151-exp-box"><span>Histórico sem detalhe recuperado</span><b>${brl(hist.total)}</b><small>${Number(hist.rows||0)} registro(s) · não transformar em compra inventada.</small></div><div class="v151-exp-box"><span>LTS ainda investigando</span><b>${brl(sys.total)}</b><small>${Number(sys.rows||0)} registro(s) com detalhe disponível para revisão do sistema.</small></div><div class="v151-exp-box action"><span>Realmente para classificar/contextualizar</span><b>${brl(act.total)}</b><small>${Number(act.rows||0)} registro(s) que podem precisar de decisão.</small></div></section><div class="v151-exp-note">Casa é contexto. Moradia é natureza do gasto. O LTS mantém as duas dimensões separadas.</div>`;
      }catch(e){return ''}
    };
    const wireExpenses=()=>{
      try{
        const current=dw?.__v143Expenses;
        if(typeof current!=='function'||current.__ltsV151ExpenseOwned)return;
        const base=current.__ltsV151ExpenseBase||current;
        function ownedExpenses(){
          const html=base.apply(this,arguments);if(typeof html!=='string')return html;
          const panel=expensePanelMarkup();if(!panel||html.includes('id="v151ExpenseState"'))return html;
          let out=html.replace('<div class="v150-card"><b>O que significa “Não atribuído”</b>','<div class="v150-card v151-hide"><b>O que significa “Não atribuído”</b>');
          const needle='<div class="v150-grid">';
          out=out.includes(needle)?out.replace(needle,panel+needle):out+panel;
          return out;
        }
        ownedExpenses.__ltsV151ExpenseOwned=true;ownedExpenses.__ltsV151ExpenseBase=base;
        dw.__v143Expenses=ownedExpenses;
        try{dw.despesas=ownedExpenses}catch(e){}
      }catch(e){}
    };
    const paintDashboard=()=>{
      try{
        if(!dw||String(dw.V)!=='Dashboard'||typeof dw.__LTS_V151_DASHBOARD_FN!=='function')return;
        const root=deep.getElementById('A');if(!root)return;
        root.innerHTML=dw.__LTS_V151_DASHBOARD_FN();
      }catch(e){}
    };
    const prepareInheritedRoots=()=>{
      try{
        if(String(dw?.V)!=='Despesas')return;
        wireExpenses();
        const area=deep.getElementById('A');
        let root=deep.getElementById('v150ExpensesRoot')||deep.querySelector('#A > .v150')||deep.querySelector('#A .v150');
        if(!root&&area&&dw?.LTS_V150_RECOMPOSITION==='expense-input-dashboard-recomposition-v1'&&typeof dw.__v143Expenses==='function'){
          const html=dw.__v143Expenses();
          if(typeof html==='string'&&html)area.innerHTML=html;
          root=deep.querySelector('#A > .v150')||deep.querySelector('#A .v150');
        }
        if(root&&!root.id)root.id='v150ExpensesRoot';
      }catch(e){}
    };
    const repaintOnce=()=>{wireExpenses();paintDashboard();prepareInheritedRoots();try{dw&&dw.__LTS_V151_AFTER_RENDER&&dw.__LTS_V151_AFTER_RENDER()}catch(e){}try{dw&&dw.__LTS_V151_LEDGER_SEARCH_AFTER_RENDER&&dw.__LTS_V151_LEDGER_SEARCH_AFTER_RENDER()}catch(e){}refresh()};
    const repaintBurst=()=>{
      repaintOnce();
      [40,120,220,295,420].forEach(ms=>setTimeout(repaintOnce,ms));
    };
    const wireRender=()=>{
      try{
        wireExpenses();
        if(!dw||typeof dw.render!=='function'||dw.render.__ltsV151AfterRender)return;
        const base=dw.render;
        function wrappedRender(){const out=base.apply(this,arguments);Promise.resolve().then(repaintBurst);return out}
        wrappedRender.__ltsV151AfterRender=true;wrappedRender.__ltsV151Base=base;dw.render=wrappedRender;
      }catch(e){}
    };
    if(dw)dw.__LTS_V151_WRAPPER_REPAINT=repaintBurst;
    wireRender();
    if(!deep.getElementById('v151DashboardUpdatesLayer')){
      addScriptWithObserverShadow(deep,'v151DashboardUpdatesLayer','wip35-v151-dashboard-updates.js?v151-dashboard-updates-v1',()=>{
        wireRender();
        deep.addEventListener('click',repaintBurst,{capture:true});
        [120,500,1200,2600,5200,7600].forEach(ms=>setTimeout(repaintOnce,ms));
      });
    }
    addScript(deep,'v151LedgerSearchLayer','wip35-v151-ledger-search.js?v151-ledger-search-v1',()=>{wireRender();repaintBurst()});
    repaintBurst();return true;
  }
  document.getElementById('shell').addEventListener('load',()=>setTimeout(inject,80));
  [80,180,350,700,1200,2200,4000,7000,11000,15000].forEach(ms=>setTimeout(inject,ms));
  window.__LTS_TOP_CANDIDATE_VERSION=VERSION;
  window.__LTS_V151_WRAPPER_STATUS={version:'v151-wrapper-v14',bounded_retry:true,permanent_polling:false,public_index_changed:false,decoration_observer_suppressed:true,event_refresh:true,render_after_hook:true,inherited_expense_root_bridge:true,inherited_expense_renderer_bridge:true,inherited_expense_renderer_owner:true,version_observer:false,ledger_search_layer:true,dashboard_dom_owner:'bounded-event-repaint-burst',global_mutation_observer_preserved:true,global_mutation_observer_restored:true,layer_scope_shadow:true};
})();
</script>
<!-- v151 native script load with temporary observer-constructor shadow/restoration + bounded/event repaint burst + render-after hook + inherited expense renderer ownership/root bridge + server-side ledger search; public index untouched -->
</body>
</html>
