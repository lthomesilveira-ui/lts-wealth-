function flow(){const rows=flowRows();return shell(`<section class="view">${pageHead('Fluxo Diário','Saldo anterior, entradas, saídas e saldo final')}<div class="module-shell"><div class="module-toolbar"><select class="select" id="flowAccount"><option>Consolidado</option><option>Itaú</option><option>Bradesco</option><option>C6</option></select><span class="status-pill">${rows.length} dias carregados</span></div><article class="card module-card"><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Saldo anterior</th><th>Entradas</th><th>Saídas</th><th>Saldo final</th></tr></thead><tbody>${rows.length?rows.map(x=>{const c=x.fix86_columns||{},z=x.Consolidado||{},prev=finite(c.saldo_anterior_operacional??c.saldo_anterior),en=finite(c.entradas_operacionais??c.entradas),out=finite(c.saidas_operacionais??c.saidas),fin=finite(c.saldo_final_operacional??c.saldo_final??z.bank_balance);return `<tr><td>${fmt(x.date)}</td><td data-label="Saldo anterior">${money(prev)}</td><td data-label="Entradas" class="amount-pos">${money(en)}</td><td data-label="Saídas" class="amount-neg">${money(out)}</td><td data-label="Saldo final"><b>${money(fin)}</b></td></tr>`}).join(''):'<tr><td colspan="5"><div class="empty-state">Fluxo ainda não recebido.</div></td></tr>'}</tbody></table></div></article></div></section>`)}

function wealthView(){const w=C?.wealth||D?.wealth_executive||D?.wealth||{},summary=w.summary||{},net=finite(w.net_worth_central??summary.net_worth_central),debt=finite(w.known_debt_total??summary.known_debt_total),dist=arr(w.distribution);return shell(`<section class="view">${pageHead('Patrimônio','Ativos, passivos e posições documentadas')}<div class="module-shell"><div class="module-grid"><div class="mini-kpi"><span>Patrimônio líquido</span><b>${money(net)}</b></div><div class="mini-kpi"><span>Dívida conhecida</span><b>${money(debt)}</b></div><div class="mini-kpi"><span>RSUs vested</span><b>${money(model().vested)}</b></div><div class="mini-kpi"><span>FGTS</span><b>${money(model().fgts)}</b></div></div><article class="card module-card"><div class="panel-title"><h2>Composição</h2><small>sem inferir valor ausente</small></div>${dist.length?dist.map(x=>`<div class="list-row"><div><b>${esc(text(x.name,x.label,'Ativo'))}</b><span>${esc(text(x.detail,x.type,''))}</span></div><strong>${money(x.value??x.total)}</strong></div>`).join(''):'<div class="empty-state">A composição detalhada continua disponível apenas onde o backend a evidencia.</div>'}</article></div></section>`)}
function cardsView(){const c=C?.cards||D?.card_operating||{},next=c.next_due||{},open=finite(c.open_cycles_total),closed=finite(c.closed_or_due_total);const cycles=arr(c.cycles||D?.cards?.cycles||D?.card_cycles);return shell(`<section class="view">${pageHead('Cartões','Faturas abertas, vencidas e histórico certificado')}<div class="module-shell"><div class="module-grid"><div class="mini-kpi"><span>Faturas abertas</span><b>${money(open)}</b></div><div class="mini-kpi"><span>Vencidas / confirmar</span><b>${money(closed)}</b></div><div class="mini-kpi"><span>Próximo vencimento</span><b>${fmt(next.due_date)}</b></div><div class="mini-kpi"><span>Próxima fatura</span><b>${money(next.amount)}</b></div></div><article class="card module-card"><div class="panel-title"><h2>Faturas / ciclos</h2><small>documental quando disponível</small></div>${cycles.length?cycles.slice(0,18).map(x=>`<div class="list-row"><div><b>${esc(text(x.card_name,x.card,x.name,'Cartão'))}</b><span>${esc(text(x.cycle_label,x.month,x.competence,''))}</span></div><strong>${money(x.amount??x.total)}</strong></div>`).join(''):'<div class="empty-state">O resumo operacional está disponível; detalhe por ciclo depende da cobertura documental recebida.</div>'}</article></div></section>`)}
function updatesView(){const items=arr(D?.updates?.items);return shell(`<section class="view">${pageHead('Atualizações','Checklist compacto do que realmente pede ação')}<div class="module-shell"><div class="module-grid"><div class="mini-kpi"><span>Ações pendentes</span><b>${finite(C?.work?.actionable_count??D?.updates?.actionable_count)??'—'}</b></div><div class="mini-kpi"><span>Classificações</span><b>${finite(C?.work?.classification_groups)??'—'}</b></div><div class="mini-kpi"><span>Documentos</span><b>${finite(D?.updates?.document_count)??'—'}</b></div><div class="mini-kpi"><span>Estado</span><b>${items.length?'revisar':'em dia'}</b></div></div><article class="card module-card"><div class="panel-title"><h2>Fila priorizada</h2><small>sem criar decisão artificial</small></div>${items.length?items.slice().sort((a,b)=>n(a.priority)-n(b.priority)||Math.abs(n(b.impact_amount))-Math.abs(n(a.impact_amount))).slice(0,30).map(x=>`<div class="list-row"><div><b>${esc(text(x.title,x.label,'Pendência'))}</b><span>${esc(text(x.detail,x.description,x.reason,''))}</span></div><strong>${finite(x.impact_amount)!=null?money(Math.abs(x.impact_amount)):''}</strong></div>`).join(''):'<div class="empty-state">Nenhuma atualização recebida.</div>'}</article></div></section>`)}
function render(){if(loading){root.innerHTML='<div class="loading">Carregando LTS Wealth…</div>';return}if(error){root.innerHTML=`<div class="login-page"><div class="login-box"><div class="login-brand"><div class="monogram">LS</div><b>LTS Wealth</b></div><h1>Não foi possível carregar</h1><p>${esc(error)}</p><button class="login-btn" id="retry">Tentar novamente</button></div></div>`;document.getElementById('retry').onclick=load;return}if(!D||!C){login();return}const html=current==='Dashboard'?dashboard():current==='Fluxo Diário'?flow():current==='Despesas'?expenseView():current==='Patrimônio'?wealthView():current==='Cartões'?cardsView():updatesView();root.innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=e=>{e.preventDefault();const r=b.dataset.route;if(!ROUTES.includes(r))return;current=r;history.replaceState(null,'','#'+encodeURIComponent(r));render();window.scrollTo({top:0,behavior:'instant'})});const lo=document.getElementById('logout');if(lo)lo.onclick=async()=>{await S?.auth.signOut();D=C=null;current='Dashboard';render()};const sel=document.getElementById('flowAccount');if(sel)sel.onchange=()=>renderFlowAccount(sel.value)}
function renderFlowAccount(account){const rows=flowRows(),tbody=document.querySelector('.table tbody');if(!tbody)return;tbody.innerHTML=rows.map(x=>{const c=x.fix86_columns||{},z=x[account]||{},prev=account==='Consolidado'?finite(c.saldo_anterior_operacional??c.saldo_anterior):null,en=account==='Consolidado'?finite(c.entradas_operacionais??c.entradas):finite(z.entries??z.inflows),out=account==='Consolidado'?finite(c.saidas_operacionais??c.saidas):finite(z.exits??z.outflows),fin=account==='Consolidado'?finite(c.saldo_final_operacional??c.saldo_final??x.Consolidado?.bank_balance):finite(z.operational_balance??z.balance);return `<tr><td>${fmt(x.date)}</td><td data-label="Saldo anterior">${money(prev)}</td><td data-label="Entradas" class="amount-pos">${money(en)}</td><td data-label="Saídas" class="amount-neg">${money(out)}</td><td data-label="Saldo final"><b>${money(fin)}</b></td></tr>`}).join('')}
function login(msg=''){root.innerHTML=`<div class="login-page"><form class="login-box" id="loginForm"><div class="login-brand"><div class="monogram">LS</div><b>LTS Wealth</b></div><h1>Entrar</h1><p>Sua vida financeira, em uma tela.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="login-btn" id="signin" type="submit">Entrar</button><div class="login-msg" id="loginMsg">${esc(msg)}</div></form></div>`;document.getElementById('loginForm').onsubmit=auth}
async function auth(e){e.preventDefault();const b=document.getElementById('signin');b.disabled=true;b.textContent='Entrando…';const r=await S.auth.signInWithPassword({email:document.getElementById('email').value.trim().toLowerCase(),password:document.getElementById('password').value});if(r.error){b.disabled=false;b.textContent='Entrar';document.getElementById('loginMsg').textContent='Login: '+r.error.message;return}await load()}
async function load(){loading=true;error=null;render();if(FIXTURE){const f=fixture();D=f.product;C=f.cockpit;loading=false;render();window.__LTS_CANONICAL_STATUS={ready:true,fixture:true,iframe_count:0,routes:ROUTES.slice(),data_ready:true};return}const {data:{session}}=await S.auth.getSession();if(!session){loading=false;D=C=null;render();return}try{const [p,c]=await Promise.all([S.rpc('lts_browser_product_v1'),S.rpc('lts_browser_dashboard_cockpit_v1')]);if(p.error||!p.data?.mvp)throw new Error(p.error?.message||'Produto indisponível');if(c.error||!c.data?.version)throw new Error(c.error?.message||'Dashboard indisponível');D=p.data.mvp;C=c.data;loading=false;current=ROUTES.includes(decodeURIComponent(location.hash.slice(1)))?decodeURIComponent(location.hash.slice(1)):'Dashboard';render();window.__LTS_CANONICAL_STATUS={ready:true,fixture:false,iframe_count:document.querySelectorAll('iframe').length,routes:ROUTES.slice(),data_ready:true,authenticated_e2e_claimed:false}}catch(e){loading=false;error=String(e?.message||e);render()}}
S=client();load();
})();
</script>
