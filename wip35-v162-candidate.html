<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#shell{display:block;width:100%;height:100%;border:0;background:#f5f6f8}
#gate{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;background:#f5f6f8;color:#536174;font-size:13px}#gate[hidden]{display:none}
#scope{position:fixed;right:10px;bottom:10px;z-index:2147483647;border:1px solid #d9e0e8;border-radius:999px;background:rgba(255,255,255,.94);color:#526174;padding:6px 9px;font:750 9px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;box-shadow:0 4px 18px rgba(16,43,80,.10);pointer-events:none}
@media(max-width:820px){#scope{right:8px;bottom:8px;font-size:8px}}
</style>
</head>
<body>
<div id="gate" role="status" aria-live="polite">Preparando o Fluxo Diário…</div>
<div id="scope">Fluxo Diário · homologação</div>
<iframe id="shell" title="LTS Wealth — Fluxo Diário" src="index.html?v162-flow-recovery"></iframe>
<script>
// Scoped presentation only. The preserved public source and financial writer
// are unchanged. The invoice renderer already sorts net totals descending.
document.getElementById('shell').addEventListener('load',function(){
  const frame=this.contentWindow,doc=this.contentDocument;
  if(!frame||!doc)return;
  if(!doc.getElementById('lts-invoice-linear-order')){
    const style=doc.createElement('style');style.id='lts-invoice-linear-order';
    style.dataset.contract='invoice-single-list-descending-v1';
    style.textContent=`
      .lts-invoice-unified .fx89-invoice-body .fx89-catgrid{
        display:flex!important;flex-direction:column!important;gap:0!important;
        grid-template-columns:none!important;columns:auto!important;min-width:0!important;
      }
      .lts-invoice-unified .fx89-invoice-body .fx89-catgrid>.fx89-cat{
        display:flex!important;align-items:baseline!important;justify-content:space-between!important;
        gap:14px!important;width:100%!important;min-width:0!important;
        padding:9px 10px!important;border-bottom:1px solid var(--bd);border-radius:0!important;
      }
      .lts-invoice-unified .fx89-invoice-body .fx89-catgrid>.fx89-cat>span{
        min-width:0;overflow-wrap:anywhere;flex:1;
      }
      .lts-invoice-unified .fx89-invoice-body .fx89-catgrid>.fx89-cat>b{
        margin-left:auto;flex-shrink:0;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
      }
    `;
    doc.head.appendChild(style);
  }
  if(typeof frame.toast==='function')return;
  let timeout;
  frame.toast=function(message){
    let notice=doc.getElementById('ltsUserToast');
    if(!notice){
      notice=doc.createElement('div');notice.id='ltsUserToast';
      notice.setAttribute('role','status');notice.setAttribute('aria-live','polite');
      notice.style.cssText='position:fixed;left:16px;right:16px;bottom:48px;z-index:2147483640;margin:auto;max-width:520px;padding:14px 18px;border-radius:12px;background:#203f68;color:white;box-shadow:0 8px 30px #0002;font:600 14px/1.4 system-ui;box-sizing:border-box;overflow-wrap:anywhere;pointer-events:none';
      doc.body.appendChild(notice);
    }
    clearTimeout(timeout);notice.textContent=String(message||'');notice.hidden=false;
    timeout=setTimeout(()=>{notice.hidden=true},4500);
  };
});
</script>
<script src="wip35-v162-flow-recovery.js?v=20260911-default-window-v5&integrated=20260912-v4-linear-categories"></script>
