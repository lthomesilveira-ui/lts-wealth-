<script>
// The protected component calls toast after saving. Provide that missing UI
// dependency in this isolated shell without changing its financial writer.
document.getElementById('shell').addEventListener('load',function(){
  const frame=this.contentWindow,doc=this.contentDocument;
  if(!frame||!doc||typeof frame.toast==='function')return;
  let timeout;
  frame.toast=function(message){
    let notice=doc.getElementById('ltsUserToast');
    if(!notice){
      notice=doc.createElement('div');notice.id='ltsUserToast';
      notice.setAttribute('role','status');notice.setAttribute('aria-live','polite');
      notice.style.cssText='position:fixed;left:16px;right:16px;bottom:48px;z-index:2147483640;margin:auto;max-width:520px;padding:14px 18px;border-radius:12px;background:#203f68;color:white;box-shadow:0 8px 30px #0002;font:600 14px/1.4 system-ui;box-sizing:border-box;overflow-wrap:anywhere;pointer-events:none';
      doc.body.appendChild(notice);
    }
    clearTimeout(timeout);notice.textContent=String(message||'');notice.hidden=false;
    timeout=setTimeout(()=>{notice.hidden=true},4500);
  };
});
</script>
