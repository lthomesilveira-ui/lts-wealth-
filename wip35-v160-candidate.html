<style>

#v160Badge{position:fixed;right:9px;bottom:8px;z-index:2147483647;border-radius:999px;background:#14263c;color:#fff;padding:5px 8px;font:800 7px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;pointer-events:none}
@media(max-width:820px){#v160Badge{display:none}}

<body>
<iframe id="prototype" src="about:blank"></iframe>
<div id="v160Badge">CANDIDATA v160 · protótipo + dados reais</div>
<script>
(()=>{'use strict';
const host=document.getElementById('prototype');
const q=new URLSearchParams(location.search);q.set('v160-host','1');host.src='wip35-v156-candidate.html?'+q.toString();
const ROUTES=['Dashboard','Fluxo Diário','Despesas','Patrimônio','Cartões','Atualizações'];
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
const finite=v=>{if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const money=v=>finite(v)==null?'—':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2}).format(Number(v));
const TEST=new URLSearchParams(location.search).get('bridgeFixture')==='1';
let state='boot',checks=0,bridgeCalls=0,bridgeErrors=0,lastRoute='Dashboard',lastData=null,bridgeInflight=false,settled=false,routeState={dest:'Dashboard',ok:true,via:'prototype'};
function root(){try{return host.contentDocument&&host.contentWindow?{d:host.contentDocument,w:host.contentWindow}:null}catch(e){return null}}
function allFrames(){const r=root();if(!r)return [];const out=[r],seen=new Set([r.w]);for(let i=0;i<out.length&&out.length<64;i++){const z=out[i];let fs=[];try{fs=[...z.d.querySelectorAll('iframe')]}catch(e){}for(const f of fs){try{const d=f.contentDocument,w=f.contentWindow;if(d&&w&&!seen.has(w)){seen.add(w);out.push({d,w,f})}}catch(e){}}}return out}
function appCandidates(xs){return xs.filter(z=>{try{return !!z.w&&((z.w.D&&typeof z.w.D==='object')||(z.w.S&&typeof z.w.S.rpc==='function')||z.d.getElementById('A')||('V' in z.w&&typeof z.w.render==='function'))}catch(e){return false}})}
function cockpitFrom(xs){for(const z of xs){try{const c=z.w.D?.dashboard_cockpit;if(c&&typeof c==='object'&&c.version)return {c,z}}catch(e){}}return null}
function fixtureCockpit(){return {version:'v160-fixture',as_of:'2026-09-05',liquidity:{bank_cash:28000,d0:12000,d3_vested:24000,through_d3:64000,fgts_d30:22432.31,accounts:[{institution:'Itaú',balance:22000},{institution:'Bradesco',balance:5000},{institution:'C6',balance:1000}]},expenses:{current_month:{spend:68000}},work:{actionable_count:3,top_actions:[]},wealth:{net_worth_central:3590703.56},horizons:[{current_liquidity_balance:40000},{current_liquidity_balance:36000},{current_liquidity_balance:30500},{current_liquidity_balance:22000},{current_liquidity_balance:14500},{current_liquidity_balance:-3500}]}}
async function refreshCockpit(xs){if(TEST)return fixtureCockpit();if(bridgeInflight)return null;const apps=appCandidates(xs);for(const z of apps){try{if(z.w.D?.dashboard_cockpit?.version)return z.w.D.dashboard_cockpit;if(z.w.S&&typeof z.w.S.rpc==='function'&&z.w.D&&typeof z.w.D==='object'){bridgeInflight=true;bridgeCalls++;const {data,error}=await z.w.S.rpc('lts_browser_dashboard_cockpit_v1');bridgeInflight=false;if(error||!data){bridgeErrors++;continue}z.w.D.dashboard_cockpit=data;return data}}catch(e){bridgeInflight=false;bridgeErrors++}}return null}
function model(c){if(!c)return null;const l=c.liquidity||{},acc=Array.isArray(l.accounts)?l.accounts:[];let bank=finite(l.bank_cash);if(bank==null&&acc.length){const vals=acc.filter(x=>!/rsu/i.test(String(x.institution||x.account||x.name||''))).map(x=>finite(x.balance)).filter(x=>x!=null);if(vals.length)bank=vals.reduce((a,b)=>a+b,0)}const d0=finite(l.d0),vested=finite(l.d3_vested),through=finite(l.through_d3);let short=null;if(bank!=null&&d0!=null)short=bank+d0;else if(through!=null&&vested!=null)short=through-vested;return {bank,d0,vested,through,short,fgts:finite(l.fgts_d30),expenses:finite(c.expenses?.current_month?.spend),actions:finite(c.work?.actionable_count),net:finite(c.wealth?.net_worth_central),horizons:(c.horizons||[]).map(x=>finite(x.current_liquidity_balance)).filter(x=>x!=null),accounts:acc}}
function ensureCss(r){try{let s=r.d.getElementById('v160-css');if(!s){s=r.d.createElement('style');s.id='v160-css';(r.d.head||r.d.documentElement).appendChild(s)}s.textContent=`.candidate-badge{display:none!important}@media(max-width:820px){body{padding-bottom:64px!important}.mobile-nav{overflow:hidden!important;display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;padding-left:0!important;padding-right:0!important}.mobile-nav button{min-width:0!important;width:auto!important;padding:0 1px!important;font-size:6.2px!important;line-height:1.05!important;white-space:normal!important;overflow:hidden!important}.mobile-nav button svg{width:15px!important;height:15px!important}.route-frame{height:calc(100dvh - 122px)!important;min-height:0!important}.kpi{overflow:hidden!important}.kpi .meta,.kpi .mini-note{line-height:1.15!important}.kpi:last-child{min-height:94px!important;height:auto!important}}
body.v160-native-mode #dashboard{display:none!important}body.v160-native-mode #routeFrame{display:block!important;width:100%!important;background:#fff!important}@media(max-width:820px){body.v160-native-mode #routeFrame{height:calc(100dvh - 122px)!important}}`;r.d.title='LTS Wealth';r.d.querySelectorAll('.candidate-badge').forEach(x=>x.style.display='none')}catch(e){}}
function setKpi(r,label,val,meta){try{const cards=[...r.d.querySelectorAll('.kpi')];const card=cards.find(x=>norm(x.querySelector('label')?.textContent)===norm(label));if(!card)return;const strong=card.querySelector('strong');if(strong)strong.textContent=money(val);if(meta){const m=card.querySelector('.meta');if(m)m.textContent=meta}const note=card.querySelector('.mini-note');if(note)note.textContent=val==null?'posição financeira ainda não recebida':'posição financeira evidenciada'}catch(e){}}
function chartSvg(vals){const a=(vals||[]).filter(x=>finite(x)!=null);if(a.length<2)return null;const W=620,H=205,L=72,R=14,T=12,B=28,min=Math.min(...a,0),max=Math.max(...a,0),span=Math.max(1,max-min),y=v=>T+(H-T-B)*(1-(v-min)/span),x=i=>L+(W-L-R)*i/(a.length-1),pts=a.map((v,i)=>[x(i),y(v)]);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line class="axis-line" x1="${L}" y1="${y(0)}" x2="${W-R}" y2="${y(0)}"/><path class="series-line" d="M${pts.map(p=>p[0]+','+p[1]).join(' L')}"/>${pts.map(p=>`<circle class="series-point" cx="${p[0]}" cy="${p[1]}" r="2.8"/>`).join('')}</svg>`}
function patchDashboard(r,m){if(!r||!m||r.d.querySelectorAll('.kpi').length<5)return false;ensureCss(r);setKpi(r,'Dinheiro em contas',m.bank,'saldo bancário disponível');setKpi(r,'Contas + curto prazo',m.short,m.bank!=null&&m.d0!=null?'contas + recursos D0':'curto prazo derivado do D+3 sem RSU');setKpi(r,'RSUs vested',m.vested,'vested · liquidez D+3');setKpi(r,'FGTS',m.fgts,'restrito · aproximadamente D+30');setKpi(r,'Despesas (mês)',m.expenses,m.expenses==null?'dado mensal indisponível':'consolidado do mês');try{const p=r.d.querySelector('.page-title p');if(p)p.textContent='Liquidez primeiro: contas, curto prazo, RSUs vested e FGTS';const panels=[...r.d.querySelectorAll('.panel')];const evo=panels.find(x=>/evolucao da liquidez|evolucao do caixa/.test(norm(x.querySelector('.panel-title h2')?.textContent)));if(evo){const h=evo.querySelector('.panel-title h2');if(h)h.textContent='Evolução da Liquidez';const c=evo.querySelector('.scaled-chart,.cash-chart');const svg=chartSvg(m.horizons);if(c&&svg){c.className='scaled-chart';c.innerHTML=svg}}const fg=panels.find(x=>norm(x.querySelector('.panel-title h2')?.textContent)==='fgts');if(fg){const a=fg.querySelector('.amount');if(a)a.textContent=money(m.fgts)}}catch(e){}lastData=m;settled=true;if(lastRoute==='Dashboard'){r.d.body.classList.remove('v160-native-mode');const dash=r.d.getElementById('dashboard'),rf=r.d.getElementById('routeFrame');if(dash)dash.style.display='block';if(rf)rf.style.display='none';state='app';routeState={dest:'Dashboard',ok:true,via:'prototype'}}return true}
function exactNative(xs,dest){const t=norm(dest);for(const z of appCandidates(xs).reverse()){try{const nodes=[...z.d.querySelectorAll('button,a,[role="button"],[data-v],[data-view],[data-route]')];const hit=nodes.find(x=>norm(x.textContent)===t)||nodes.find(x=>norm(x.getAttribute('data-v'))===t)||nodes.find(x=>norm(x.getAttribute('data-view'))===t)||nodes.find(x=>norm(x.getAttribute('data-route'))===t);if(hit){hit.click();const current=String(z.w.V||z.w.currentView||z.w.currentRoute||'');return {ok:!current||norm(current)===t,via:'click',current}}if(z.w&&('V' in z.w)&&typeof z.w.render==='function'){z.w.V=dest;z.w.renderNav?.();z.w.render?.();return {ok:String(z.w.V||'')===dest,via:'force-V',current:String(z.w.V||'')}}}catch(e){}}return {ok:false,via:'not-found',current:''}}
function showNative(r,xs,dest){ensureCss(r);r.d.body.classList.add('v160-native-mode');const dash=r.d.getElementById('dashboard'),rf=r.d.getElementById('routeFrame');if(dash)dash.style.display='none';if(rf)rf.style.display='block';let rr={ok:true,via:'native-visible',current:''};if(dest&&dest!=='Dashboard')rr=exactNative(xs,dest);routeState={dest:dest||lastRoute,ok:!!rr.ok,via:rr.via,current:rr.current};state='native';settled=true;return routeState.ok}
function wireNav(r){try{if(r.d.__ltsV160Nav)return;r.d.__ltsV160Nav=true;r.d.addEventListener('click',e=>{const b=e.target.closest?.('[data-route],[data-route2]');if(!b)return;const dest=b.dataset.route||b.dataset.route2;if(!ROUTES.includes(dest))return;e.preventDefault();e.stopImmediatePropagation();lastRoute=dest;const xs=allFrames();if(dest==='Dashboard'&&lastData){r.d.body.classList.remove('v160-native-mode');const d=r.d.getElementById('dashboard'),f=r.d.getElementById('routeFrame');if(d)d.style.display='block';if(f)f.style.display='none';state='app';routeState={dest,ok:true,via:'prototype'};return}showNative(r,xs,dest)},true)}catch(e){}}
async function cycle(attempt){checks++;const r=root();if(!r)return false;ensureCss(r);wireNav(r);const xs=allFrames();let found=cockpitFrom(xs);let c=found?.c||null;if(!c)c=await refreshCockpit(xs);const m=model(c);const hasMaterial=!!m&&[m.bank,m.short,m.vested,m.fgts,m.expenses].some(x=>x!=null);if(hasMaterial){lastData=m;if(lastRoute==='Dashboard'){if(patchDashboard(r,m))return true}else{showNative(r,xs,lastRoute);return true}}const login=xs.some(z=>{try{const txt=norm(z.d.body?.innerText||'');return !!z.d.querySelector('input[type="password"],input[name*="password" i]')||((/entrar|login|acessar/.test(txt))&&!!z.d.querySelector('form,input'))}catch(e){return false}});if(login){showNative(r,xs,lastRoute);state='login';return true}if(attempt>=34){showNative(r,xs,lastRoute);state='native';return true}return false}
async function burst(){for(let i=0;i<=34;i++){const ok=await cycle(i);if(ok)return;await new Promise(res=>setTimeout(res,Math.min(120+i*25,420)))}}
host.addEventListener('load',()=>burst(),{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden)burst()});window.addEventListener('focus',()=>burst(),{passive:true});setTimeout(()=>burst(),0);
window.__LTS_V160_STATUS={version:'v160-real-data-bridge-v2',visual_baseline:'v156',recursive_frame_scan:true,dashboard_rpc:'lts_browser_dashboard_cockpit_v1',read_only_bridge:true,empty_dashboard_forbidden:true,native_route_owner:true,mobile_nav_six_fixed:true,synthetic_financial_values_added:false,authenticated_e2e_claimed:false,get state(){return state},get checks(){return checks},get bridgeCalls(){return bridgeCalls},get bridgeErrors(){return bridgeErrors},get settled(){return settled},get dataReady(){return !!lastData},get routeState(){return routeState}};
})();
</script>
